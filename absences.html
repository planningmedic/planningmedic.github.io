<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultations à venir — Planning-Med</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/fonts/polices.css">   <!-- (14/09/2026) même police que l'accueil et le planning : DM Sans -->
<link rel="stylesheet" href="partage/theme.css">   <!-- (14/09/2026) palette commune -->
<style>
:root{
--surface-2:#EEF1F5;
  --ok:#166534; --ok-soft:#F0FDF4; --ok-line:#BBF7D0;
  --rose:#BE123C; --rose-soft:#FFF1F3; --rose-line:#FBD5DC;
  --me:#1D6FB8; --me-soft:#E8F4FD; --me-border:#B9DCF5;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);
     -webkit-font-smoothing:antialiased}
svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}

.header{background:var(--white);border-bottom:1px solid var(--line);padding:0 26px;
        display:flex;align-items:center;justify-content:space-between;min-height:58px;
        position:sticky;top:0;z-index:300}
.header-brand{display:flex;align-items:center;gap:13px;min-width:0}
.header-brand>div:last-child{min-width:0}
.header-flag{display:flex;flex-direction:column;width:26px;height:26px;border-radius:6px;
             overflow:hidden;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.header-title{font-size:14.5px;font-weight:700;letter-spacing:-.02em;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-sub{font-size:11px;color:var(--ink-4);margin-top:1px;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-right{display:flex;align-items:center;gap:9px;flex-shrink:0}
.hbtn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12px;font-weight:700;
      color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;
      padding:5px 12px;text-decoration:none;cursor:pointer}
.me-pill{display:inline-flex;align-items:center;gap:6px;background:var(--me-soft);color:var(--me);
         border:1px solid var(--me-border);border-radius:999px;padding:5px 12px;font-size:12.5px;
         font-weight:700;white-space:nowrap}

.wrap{max-width:1180px;margin:0 auto;padding:28px 26px 60px}
h1{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.sub{font-size:13.5px;color:var(--ink-3);margin-bottom:22px;max-width:70ch}
.back{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:13px;font-weight:600;
      color:var(--me);background:none;border:none;cursor:pointer;padding:0;margin-bottom:14px;
      text-decoration:none}
.back i{width:15px;height:15px;display:inline-block}

.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:start}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card>h2{font-size:11px;font-family:var(--mono);font-weight:500;text-transform:uppercase;
         letter-spacing:.06em;color:var(--ink-4);padding:14px 18px 11px;border-bottom:1px solid var(--line)}
.card>h2 b{color:var(--ink-2);font-weight:600}
.scroller{max-height:62vh;overflow-y:auto}
.dayhead{position:sticky;top:0;background:var(--line-light);padding:6px 18px;font-size:11px;
         font-weight:600;color:var(--ink-3);border-bottom:1px solid var(--line);z-index:1;
         font-family:var(--mono)}
.slot{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 18px;
      border:none;background:none;font:inherit;cursor:pointer;border-bottom:1px solid var(--line-light)}
.slot:hover{background:var(--bg)}
.slot[aria-current="true"]{background:var(--me-soft);box-shadow:inset 3px 0 0 var(--me)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--rose);flex:none}
.dot.none{background:var(--line)}
.sect{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--ink-2);
      background:var(--surface-2);border-radius:5px;padding:2px 7px;white-space:nowrap}
.who{font-size:13.5px;font-weight:600;flex:1}
.when{font-size:11px;color:var(--ink-4);white-space:nowrap}
.empty{padding:30px 20px;color:var(--ink-3);font-size:13.5px;text-align:center;line-height:1.6}
.empty b{color:var(--ink)}

.who-head{padding:16px 18px 14px;border-bottom:1px solid var(--line)}
.who-head .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
             color:var(--ink-4)}
.who-head h3{font-size:20px;font-weight:700;letter-spacing:-.01em;margin-top:3px}
.who-head .ctx{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.answer{padding:16px 18px 4px}
.lbl{font-size:12px;color:var(--ink-3);margin-bottom:10px}
.lbl b{color:var(--ink)}
.dates{display:flex;flex-wrap:wrap;gap:7px}
.d{font-family:var(--mono);background:var(--rose-soft);border:1px solid var(--rose-line);
   color:var(--rose);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;
   line-height:1.2;cursor:pointer;text-align:left}
.d:hover{background:#FCE7EB}
.d[aria-pressed="true"]{background:var(--rose);color:#fff;border-color:var(--rose)}
.d small{display:block;font-family:'DM Sans',sans-serif;font-size:9.5px;font-weight:600;
         letter-spacing:.05em;text-transform:uppercase;opacity:.85;margin-top:3px}
.hintclick{font-size:11.5px;color:var(--ink-4);margin-top:10px}
.clear{background:var(--ok-soft);border:1px solid var(--ok-line);color:var(--ok);border-radius:12px;
       padding:14px 16px;font-size:13px;line-height:1.45}
.alt{margin:14px 18px 0;border:1px solid var(--ok-line);background:var(--ok-soft);border-radius:12px;
     padding:14px 16px}
.alt h4{font-size:13.5px;font-weight:700;color:var(--ok);margin-bottom:3px}
.alt .why{font-size:11.5px;color:#3F7A64;margin-bottom:10px}
.altgrp{margin-bottom:9px}
.altgrp .t{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;
           color:#4A8770;margin-bottom:5px}
.person{display:flex;align-items:baseline;gap:8px;background:var(--white);border:1px solid var(--ok-line);
        border-radius:8px;padding:7px 11px;margin-bottom:4px;font-size:12.5px;flex-wrap:wrap}
.person .cs{font-family:var(--mono);font-size:11px;color:var(--ink-4)}
.none-alt{font-size:12.5px;color:var(--rose);background:var(--rose-soft);border:1px solid var(--rose-line);
          border-radius:8px;padding:10px 12px}
.cal{padding:14px 18px 18px}
.cal .lbl2{font-size:10.5px;color:var(--ink-4);margin:0 0 8px;font-family:var(--mono);
           letter-spacing:.05em;text-transform:uppercase}
table.grid{width:100%;border-collapse:separate;border-spacing:4px}
table.grid th{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--ink-4);
              letter-spacing:.06em;text-transform:uppercase;padding-bottom:2px}
table.grid td{width:20%;height:44px;border-radius:9px;background:var(--bg);border:1px solid var(--line);
              text-align:center;vertical-align:middle;padding:3px}
table.grid td .n{font-family:var(--mono);font-size:13px;font-weight:500}
table.grid td .c{font-family:var(--mono);font-size:9px;color:var(--rose);margin-top:1px}
table.grid td.hors{opacity:.4}
table.grid td.absent{background:var(--rose-soft);border-color:var(--rose-line)}
table.grid td.absent .n{color:var(--rose);font-weight:700}
table.grid td.consult{box-shadow:inset 0 -3px 0 var(--me)}
table.grid td.pick{outline:2px solid var(--rose);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink-4);padding:0 18px 14px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.foot{padding:13px 18px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);
      line-height:1.55}
.foot b{color:var(--ink)}

.loading{padding:50px 20px;text-align:center;color:var(--ink-3);font-size:13.5px}
@media(max-width:900px){.cols{grid-template-columns:1fr}.wrap{padding:22px 15px 40px}
  .header{padding:0 15px}.scroller{max-height:40vh}}
/* ── Bandeau du haut : ne peut plus deborder, quelle que soit la largeur ──
   (14/08/2026) Sur iPhone, le titre et le sous-titre s'enroulaient sur
   plusieurs lignes ; la hauteur du bandeau etant figee, le debordement
   partait AU-DESSUS du bord de l'ecran et le titre etait coupe.
   Meme regle que planning.html / index.html. */
@media(max-width:640px){
  .header{min-height:52px;padding:0 12px;gap:8px}
  .header-sub{display:none}
  .header-right{gap:6px}
  .me-pill{padding:4px 9px;font-size:11.5px}
  .hbtn{padding:4px 10px;font-size:11.5px}
}
/* ══ MES CONSULTATIONS — VUE DU MAR (28/11/2026) ══
   Une seule colonne, pensée téléphone : « À faire » en tête, la liste des consultations,
   les absences, le calendrier replié. Maquette validée par le responsable le 28/11/2026. */
.mc{max-width:520px;margin:0 auto}
:where(.mc,.mc-feuille) button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mc-k{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:20px 2px 8px;display:flex;align-items:center;gap:8px}
.mc-k .n{background:#B45309;color:#fff;border-radius:99px;padding:1px 8px;font-weight:700;letter-spacing:0}

.mc-af.ind{background:#EEF2FF;border-color:#C7D2FE}
.mc-af .t{font-weight:700;font-size:15px;line-height:1.3}
.mc-af.amb .t{color:#78350F}.mc-af.ind .t{color:#3730A3}
.mc-af .sd{font-size:12.5px;margin-top:3px;color:#57534E}.mc-af.ind .sd{color:#4338CA}
.mc-qui{margin-top:11px;background:#fff;border:1px solid #FDE68A;border-radius:12px;overflow:hidden;color:#0F172A}
.mc-qui .h{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#92400E;padding:8px 12px 5px}
.mc-qui .p{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid #FEF3C7}
.mc-qui .p i{font:700 11px var(--mono);width:20px;height:20px;border-radius:50%;background:#FDE68A;color:#78350F;display:grid;place-items:center;font-style:normal;flex:none}
.mc-nom{flex:1;min-width:0;text-align:left;background:none;border:0;padding:4px 0;font-weight:700;font-size:14.5px;color:#0F172A}
.mc-nom span{border-bottom:1.5px dotted #D97706}
.mc-nom small{display:block;font-weight:400;color:#475569;font-size:11.5px;margin-top:2px}

.mc-dect{flex:none;font:500 13px var(--mono);background:#E8F4FD;color:#1D6FB8;border:1px solid #B9DCF5;border-radius:99px;padding:6px 10px;white-space:nowrap;text-decoration:none}
.mc-dect.sans{background:#F1F5F9;color:#94A3B8;border-color:#E2E8F0}
.mc-conf{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#FFFBEB;border-top:1px dashed #FCD34D}
.mc-conf span{flex:1;font-size:13.5px;font-weight:600;color:#78350F}
.mc-conf .mc-b{min-height:38px;padding:7px 16px;font-size:13.5px;color:#0F172A}
.mc-conf .mc-b.oui{background:#166534;border-color:#166534;color:#fff}
.mc-qui .aucun{padding:10px 12px;border-top:1px solid #FEF3C7;font-size:13px;color:#57534E}
.mc-note{font-size:12px;color:#78350F;margin:9px 2px 0}
.mc-btns{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.mc-b{border-radius:11px;padding:10px 14px;font-weight:700;font-size:13.5px;border:1.5px solid var(--line);background:#fff;min-height:42px}
.mc-b.ind{border-color:#A5B4FC;color:#3730A3}
.mc-b.bleu{background:var(--me);border-color:var(--me);color:#fff;width:100%}
.mc-b.amb2{border-color:#FCD34D;color:#92400E;background:transparent;font-weight:600;font-size:12.5px;min-height:36px;padding:7px 12px}
.mc-b:active{transform:translateY(1px)}
.mc-rien{background:var(--ok-soft);border:1px solid var(--ok-line);color:var(--ok);border-radius:14px;padding:12px 14px;font-weight:600;font-size:13.5px}
.mc-c{display:flex;align-items:center;gap:12px;padding:12px 13px;border:0;border-top:1px solid var(--line);background:var(--white);width:100%;text-align:left}
.mc-c:first-child{border-top:0}
button.mc-c:active{background:var(--line-light)}
.mc-j{width:46px;text-align:center;font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);line-height:1.25;flex:none}
.mc-j b{display:block;font:700 19px 'DM Sans',system-ui,sans-serif;color:var(--ink);letter-spacing:0}
.mc-m{flex:1;min-width:0}.mc-m b{font-size:15px}.mc-m>span{display:block;color:var(--ink-3);font-size:12.5px;margin-top:1px}
.mc-e{font-weight:700;font-size:12.5px;border-radius:99px;padding:5px 10px;white-space:nowrap;border:1px solid;flex:none}
.mc-e.amb{background:#FEF3C7;color:#92400E;border-color:#FDE68A}
.mc-e.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.mc-e.ind{background:#EEF2FF;color:#3730A3;border-color:#C7D2FE}
.mc-e.vide{background:var(--white);color:var(--me);border:1.5px dashed #93C5FD}
.mc-ch{color:var(--ink-4);font-size:18px;margin-left:-2px;flex:none}
.mc-vide{padding:22px 16px;text-align:center;color:var(--ink-3);font-size:13.5px;line-height:1.5}
.mc-vide b{color:var(--ink)}
.mc-abs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 13px}
.mc-abs span{background:var(--rose-soft);border:1px solid var(--rose-line);color:var(--rose);border-radius:10px;padding:7px 11px;font:700 13px var(--mono)}
.mc-abs span small{display:block;font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
.mc-pied{font-size:12px;color:var(--ink-3);padding:0 13px 12px}
.mc-calb{width:100%;margin-top:14px;display:flex;justify-content:space-between;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:13px 16px;font-weight:600;font-size:14px;color:var(--ink-2)}
.mc-calb i{font-style:normal;color:var(--ink-4)}
.mc-cal{margin-top:8px;padding:10px 8px 0}
.mc-calh,.mc-calr{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.mc-calh span{text-align:center;font-size:11px;color:var(--ink-4);padding-bottom:4px}
.mc-calr{margin-bottom:4px}

.mc-calc.off{background:var(--line-light)}.mc-calc.avant{opacity:.4}

.mc-calp{background:var(--me);color:#fff;border:0;border-radius:6px;font-size:10.5px;font-weight:600;padding:4px 2px}

.mc-voile.open{opacity:1;pointer-events:auto}
.mc-feuille{position:fixed;left:0;right:0;bottom:0;background:var(--white);border-radius:22px 22px 0 0;padding:10px 14px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;
  transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s;z-index:901;max-width:520px;margin:0 auto;box-shadow:0 -12px 40px rgba(15,23,42,.22)}

.mc-pl{border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:9px}

.mc-pl.amb .mc-j,.mc-pl.amb .mc-m>span{color:#57534E}.mc-pl.amb .mc-j b{color:#0F172A}

.mc-pl .ligne{display:flex;align-items:center;gap:12px}
.mc-tag{font:700 10px var(--mono);background:#EEF2FF;color:#3730A3;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:1px}
.mc-ok2{color:var(--ok);font-weight:700;font-size:15px}
.mc-sup{color:var(--ink-4);font-size:20px;background:none;border:0;width:34px;height:34px;flex:none}

/* ── (01/08/2026) FILET : CORPS DE REQUETE PERDU ─────────────────────────
   « Code absent de la requête » est un message que le serveur ne produit que
   dans un seul cas : il a recu la requete mais pas son corps, donc il n'a
   RIEN FAIT — ni lu, ni ecrit, ni envoye de mail. Renvoyer est donc sans
   danger, y compris pour une action d'ecriture : c'est la seule erreur du
   systeme dont on sache avec certitude qu'elle n'a laisse aucune trace.
   On ne rejoue QUE sur ce message, jamais sur un code refuse.
   Le second envoi apparait comme une ligne distincte dans chrono() : le
   probleme reste visible au lieu d'etre masque par le correctif. */
const ERR_CORPS_PERDU = 'Code absent de la requête';
async function apiPost(payload){
  let r;
  try {
    r = await _apiPostDirect(payload);
  } catch (e) {
    /* (04/08/2026) Rejeu sur echec de transport — meme protection que les
       autres pages : page d'erreur HTML servie au hasard par Google → un
       unique renvoi silencieux. 2e echec → l'erreur remonte. */
    console.warn('[api] echec de transport (' + (payload.action || '?') + ') — rejeu unique');
    r = await _apiPostDirect(payload);
  }
  if (r && r.success === false && r.error === ERR_CORPS_PERDU) {
    console.warn('[api] corps de requete perdu (' + (payload.action || '?') + ') — renvoi immediat');
    return await _apiPostDirect(payload);
  }
  return r;
}

/* _reveilAPI supprimé le 18/08/2026 : l'appel avait été retiré dès le 01/08 (le filet de rejeu suffit) ; la fonction restait sans appelant sur les 5 pages. Historique : ROADMAP. */

async function _apiPostDirect(payload){
  payload.code = VIEW_CODE;
  // (01/08/2026) Journal de mesure — lecture seule, alimente chrono().
  const _act = payload.action || '(sans action)';
  const _dep = Math.round(performance.now()), _t0 = Date.now();
  const res = await fetch(API_URL, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload), redirect:'follow'
  });
  const _rep = await res.json();
  try { if (window.PERF) PERF.appel(_act, Date.now() - _t0, _rep && _rep._srv_ms, _dep,
                                    res.ok ? 'ok' : 'ECHEC — HTTP ' + res.status,
                                      _rep && _rep._glob_ms); } catch (_e) {}
  return _rep;
}

/* ══ AUTH ══════════════════════════════════════════════════════════════ */
function authErr(m){
  const el = document.getElementById('authErr');
  el.textContent = m; el.style.display='block';
  setTimeout(()=>{ el.style.display='none'; }, 4000);
}
async function doLogin(code){
  VIEW_CODE = code;
  /* (04/08/2026, fusion) UN aller-retour au lieu de deux : getConsultAbsences
     authentifie (checkCode en routage, secretariat autorise) ET livre les
     donnees + role + nom (Indispos.gs 2026-08-04.5). (23/08/2026 : le login
     d'arriere-plan a ete retire, voir plus bas.) Tant que le GAS .5 n'est
     pas deploye, r.role est absent → deduction par la regle SERVEUR :
     motifs === false ⇔ secretariat (avecMotifs = role !== 'secretariat'). */
  const r = await apiPost({action:'getConsultAbsences'});
  if(!(r && r.success)){ VIEW_CODE=''; return r; }
  SessionPortail.memoriser(code);          // session commune du portail (30 j dans l'app installée)
  ROLE = r.role || (r.motifs ? 'mar' : 'secretariat');
  MOI  = (ROLE === 'mar') ? (r.moi || null) : null;
  document.getElementById('mePill').textContent =
    (ROLE === 'secretariat') ? 'Secrétariat'
    : (r.name || (r.noms && r.moi && r.noms[r.moi]) || r.moi || '');
  // Le secrétariat n'a pas de portail : on lui masque le lien de retour.
  document.getElementById('lnkBack').style.display = (ROLE === 'secretariat') ? 'none' : '';
  if(ROLE === 'mar') document.getElementById('titre').textContent = 'Mes consultations';   // (28/11/2026) vue du MAR
  document.getElementById('pitch').textContent = (ROLE === 'mar')
    ? (r.patlib ? "Vos consultations libérales des 4 prochaines semaines." : "Vos consultations des 4 prochaines semaines.")
    : "Avant de placer un patient libéral, vérifiez que le médecin qui le verra en consultation sera présent le jour de son intervention.";
  document.getElementById('authOverlay').style.display='none';
  document.getElementById('hdr').style.display='flex';
  document.getElementById('main').style.display='';
  chargerDepuis(r);   // la reponse deja recue EST le chargement — zero appel de plus
  /* (23/08/2026) JOURNAL DE CONNEXION RETIRE. Decision du responsable : la
     tracabilite ne se fait qu'a DEUX endroits — l'ouverture du portail
     (index.html) et la connexion du comite (admin.html). Partout ailleurs
     c'est la meme session, deja journalisee : l'envoi ne faisait que reveiller
     Apps Script sans rien apprendre a l'onglet CONNEXIONS. */
  return r;
}

(async function auto(){
  const saved = SessionPortail.lire();
  if(!saved) return;
  document.getElementById('authOverlay').style.display='none';
  document.getElementById('hdr').style.display='flex';
  document.getElementById('main').style.display='';

    SessionPortail.oublier();
    document.getElementById('authOverlay').style.display='flex';
    document.getElementById('hdr').style.display='none';
    document.getElementById('main').style.display='none';

    SessionPortail.oublier();
    document.getElementById('authOverlay').style.display='flex';
    document.getElementById('hdr').style.display='none';
    document.getElementById('main').style.display='none';

/* ══ DONNÉES ═══════════════════════════════════════════════════════════ */
const JOURS_FR=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS_FR=['janv.','févr.','mars','avril','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const LIB_CS={'CS-VIS':'Viscéral','CS-END':'Endoscopie','CS-ORL':'ORL','CS-ORT':'Orthopédie',
  'CS-MAT':'Maternité','CS-INTER':'Cardio interv.','CS-POLY':'Polyvalent','CS-CI':'Cardio interv.'};
const NOM_CODE={V:'Vacances',CP:'Congé',F:'Formation',RG:'Repos de garde',CL:'Absence longue',
  TP:'Jour non travaillé',R:'Récupération',A:'Absent',CTP:'Congé temps partiel',
  OFF:'Semaine off',HS:'Hors service'};
const FEN = 20;   // 4 semaines ouvrées — doit rester aligné sur JOURS_ABS côté serveur

let JOURS_ALL = [], IDX = {};
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dt(ds){ return new Date(ds+'T12:00:00'); }
function libDate(ds){ const d=dt(ds); return JOURS_FR[d.getDay()]+' '+d.getDate()+' '+MOIS_FR[d.getMonth()]; }
function nomDe(id){ return (DATA && DATA.noms && DATA.noms[id]) ? DATA.noms[id] : id; }
function libSect(cs){ return LIB_CS[cs] || String(cs||'').replace('CS-',''); }

// Reconstruit la même suite de jours ouvrés que le serveur (week-ends exclus).
function construireJours(){
  JOURS_ALL = []; IDX = {};
  const c = new Date(); c.setHours(12,0,0,0);
  while(JOURS_ALL.length < FEN*2){
    const w = c.getDay();
    if(w>=1 && w<=5) JOURS_ALL.push(iso(c));
    c.setDate(c.getDate()+1);
  }
  JOURS_ALL.forEach((ds,i)=>{ IDX[ds]=i; });
}

/* ── MARGE LIBÉRALE ─────────────────────────────────────────────────────────
   Sert à classer les confrères qui peuvent reprendre un patient. Calcul fait par le
   SERVEUR (getConsultAbsences) sur le dernier relevé ; getReleveLiberal reste interdite
   au code secrétariat. */
let RANG = {}, MARGE_OK = false;
/* (27/11/2026, décision du responsable) Plus aucun montant à l'écran ni dans la réponse :
   le serveur envoie seulement le RANG de chaque confrère (1 = le plus de place sous les
   30 %, d'après la plus serrée des marges CCAM et NGAP). Sans rang : fin de liste. */
function lireMarges(r){
  RANG = (r && r.rangsMarge) || {};
  MARGE_OK = Object.keys(RANG).length > 0;
}
function triMarge(a, b){
  return (RANG[a] == null ? 1e9 : RANG[a]) - (RANG[b] == null ? 1e9 : RANG[b]);
}

/* (04/08/2026, fusion) Consommation d'une reponse getConsultAbsences deja
   recue : partagee entre doLogin (fusion) et charger (rechargements). */
function chargerDepuis(r){

      '<div class="card"><div class="empty">Impossible de charger : '+

  if(r.moi) MOI = r.moi;
  patCharger(r.patients);   // (26/11/2026) patients lib (vide sans le droit patlib)
  lireMarges(r);
  if(r.moi) MOI = r.moi;
  construireJours();
  rendre();
}
async function charger(){

/* ══ CALCULS ═══════════════════════════════════════════════════════════ */
// Absences d'un MAR dans les 4 semaines qui SUIVENT la consultation.
function absFenetre(mar, dateConsult){
  const i0 = IDX[dateConsult]; if(i0 === undefined) return [];
  const liste = (DATA.absences && DATA.absences[mar]) || [];
  const out = [];
  liste.forEach(a=>{
    const i = IDX[a.d];
    if(i !== undefined && i >= i0 && i < i0+FEN) out.push({date:a.d, idx:i, code:a.c || ''});
  });
  out.sort((x,y)=> x.idx - y.idx);
  return out;
}
// Regroupe les jours ouvrés consécutifs. En session secrétariat le motif n'est
// pas transmis : on fusionne sans le regarder (décision du 24/07).
function grouper(liste){
  const g = [];
  liste.forEach(a=>{
    const L = g[g.length-1];
    if(L && a.idx === L.finIdx+1 && (!MOTIFS || a.code === L.code)){
      L.finIdx = a.idx; L.fin = a.date;
    } else {
      g.push({debIdx:a.idx, finIdx:a.idx, deb:a.date, fin:a.date, code:a.code});
    }
  });
  return g;
}
function libPlage(p){
  const a = dt(p.deb), b = dt(p.fin);
  if(p.deb === p.fin) return a.getDate()+' '+MOIS_FR[a.getMonth()];
  if(a.getMonth() === b.getMonth()) return a.getDate()+' – '+b.getDate()+' '+MOIS_FR[a.getMonth()];
  return a.getDate()+' '+MOIS_FR[a.getMonth()]+' – '+b.getDate()+' '+MOIS_FR[b.getMonth()];
}
function nbJours(p){ return p.finIdx - p.debIdx + 1; }

/* ══ MES CONSULTATIONS — VUE DU MAR (refonte du 28/11/2026) ════════════════
   Maquette validée par le responsable. Une colonne, pensée téléphone :
     • « À faire » : un patient lib opéré un jour où je suis absent (qui appeler,
       dans l'ordre, avec le DECT de chacun), une salle à choisir, une consultation
       du secteur à prendre ;
     • la liste de mes consultations, une ligne chacune, avec son état ;
     • mes absences ; le calendrier, replié.
   Le MAR note ses patients lib : date opératoire + nombre, AUCUN NOM. Le patient
   garde SA consultation : le confrère vient la faire à ma place puis opère
   (rattrapage) — il doit être présent le jour de ma consultation ET le jour du
   bloc, et membre du groupement. L'accord se prend DE VIVE VOIX ; toucher le nom
   du confrère qui a accepté (avec confirmation) est un pense-bête que MOI SEUL
   vois : le serveur ne le sert à personne d'autre. « Réglé autrement » : sans nom.
   Prévenir le secrétariat des consultations reste un appel, hors de l'outil.
   Le verdict (présent / absent) n'est jamais enregistré : recalculé à l'ouverture. */
let PATIENTS = {}, MC_OUVERTE = null, MC_FORM = false, MC_NB = 1, MC_SUPPR = null, MC_CONF = '', MC_CAL = false, MC_OCCUPE = false, MC_TOAST = null, MC_ANNULER = null;
const cleCons = c => c.date+'|'+c.per+'|'+c.mar;
const mcEsc = s => String(s == null ? '' : s).replace(/[&<>"]/g, x => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
const mcPl = (n, mot) => n+' '+mot+(n>1?'s':'');
const mcPer = p => p === 'am' ? 'matin' : 'après-midi';
const mcMaj = s => s.charAt(0).toUpperCase()+s.slice(1);
function mcDate(ds){ const d = dt(ds); return JOURS_FR[d.getDay()]+' '+(d.getDate() === 1 ? '1ᵉʳ' : d.getDate())+' '+MOIS_FR[d.getMonth()]; }
function mcJour(ds){ const d = dt(ds); return '<div class="mc-j">'+JOURS_FR[d.getDay()].slice(0,3)+'.<b>'+d.getDate()+'</b>'+MOIS_FR[d.getMonth()]+'</div>'; }
const MC_SERA = {V:'en vacances',CP:'en congé',CTP:'en congé',F:'en formation',RG:'en repos de garde',TP:'en temps partiel',R:'en récupération',OFF:'en semaine off'};
const MC_COURT = {V:'congé',CP:'congé',CTP:'congé',F:'formation',RG:'repos',TP:'non travaillé',R:'récup.',OFF:'off'};
function mcSera(a){ return (MOTIFS && a && MC_SERA[a.c]) || 'absent'; }

function patCharger(liste){
  PATIENTS = {};
  (liste||[]).forEach(p=>{ if(p.mar !== MOI) return; const k = p.consult+'|'+p.per+'|'+p.mar; (PATIENTS[k] = PATIENTS[k] || []).push(p); });
  Object.keys(PATIENTS).forEach(k => PATIENTS[k].sort((a,b)=> a.bloc < b.bloc ? -1 : a.bloc > b.bloc ? 1 : 0));
}
function absentLeJour(mar, ds){ return ((DATA.absences && DATA.absences[mar]) || []).find(a => a.d === ds) || null; }
function patDe(c){ return (PATIENTS[cleCons(c)] || []).filter(p => p.bloc >= iso(new Date())); }   // date opératoire passée : masquée
function mcMes(){ return (DATA.consultations||[]).filter(c => c.mar === MOI)
  .sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : (a.per === b.per ? 0 : a.per === 'am' ? -1 : 1)); }
function mcCons(k){ return mcMes().find(c => cleCons(c) === k) || null; }
function mcTotal(c){ return patDe(c).reduce((n,p)=>n+p.nb,0); }
function mcARegler(c){ return (DATA.patlib && !c.aValider) ? patDe(c).filter(p => absentLeJour(MOI,p.bloc) && !p.confieA) : []; }
function mcSalle(c){ const L = [].concat((DATA.salles || {})[c.date+'|'+c.per] || []).filter(x => x && x !== '-'); return L.length ? 'salle'+(L.length>1?'s ':' ')+L.join(', ') : ''; }
/* Export CPA : deux salles de mon secteur ouvertes la même demi-journée → le serveur demande (DATA.aChoisir). */
function patSalleAChoisir(c){ return (DATA.patlib && !c.aValider && (DATA.aChoisir || []).find(x => x.date === c.date && x.per === c.per)) || null; }

/* DECT : « 81234 » dans le classeur → « 8 1234 » à l'écran ; un toucher lance l'appel (comme l'annuaire). */
function mcDect(id){
  const brut = String((DATA.dects || {})[id] || '').trim(), ch = brut.replace(/\D/g,'');
  if(!brut) return '<span class="mc-dect sans">DECT —</span>';
  const lib = /^8\d{4}$/.test(ch) ? '8 '+ch.slice(1) : brut;
  return ch ? '<a class="mc-dect" href="tel:'+ch+'">☎ '+mcEsc(lib)+'</a>' : '<span class="mc-dect">☎ '+mcEsc(lib)+'</span>';
}
/* Qui appeler : membre du groupement, présent le jour de MA consultation ET le jour du bloc
   (une garde compte comme présent : le serveur ne la sert pas comme une absence).
   ORDRE (28/11/2026, décision du responsable) — le MAR DU SECTEUR d'abord, indépendamment du libéral :
     1. placé dans le secteur de la consultation le jour de la consultation ET le jour de l'intervention ;
     2. placé dans ce secteur le jour de l'intervention ;
     3. les autres.
   Dans chaque groupe : le rang envoyé par le serveur (1 = le plus de place sous les 30 %), jamais un
   montant ; puis le nom. Un jour dont le planning n'est pas encore posé : personne n'est « du secteur ». */
function mcBlocDe(cs){ const x = String(cs || '').replace('CS-',''); return ({INTER:'CI'})[x] || x; }
function mcPlace(id, ds, per, bloc){ const m = ((DATA.placements || {})[ds] || {})[id] || {};
  return (per ? [per] : ['am','pm']).some(q => (m[q] || []).indexOf(bloc) >= 0); }
function mcNiveau(id, c, p){ const b = mcBlocDe(c.cs);
  return !mcPlace(id, p.bloc, null, b) ? 2 : (mcPlace(id, c.date, c.per, b) ? 0 : 1); }
function mcQui(c, p){
  const GRP = DATA.groupement || {};
  return Object.keys(DATA.noms || {}).filter(id => id !== MOI && GRP[id] && !absentLeJour(id, c.date) && !absentLeJour(id, p.bloc))
    .sort((a,b) => (mcNiveau(a, c, p) - mcNiveau(b, c, p)) || triMarge(a, b) || nomDe(a).localeCompare(nomDe(b)));
}
function mcBlocQui(c, p){
  const L = mcQui(c, p), k = mcEsc(cleCons(c)), pid = mcEsc(p.id);
  const occupe = id => (DATA.consultations || []).find(x => x.mar === id && x.date === c.date && x.per === c.per);
  let h = '<div class="mc-qui"><div class="h">Qui appeler, dans l\'ordre</div>';
  if(!L.length) return h + '<div class="aucun">Aucun confrère du groupement n\'est présent ces deux jours-là. À voir avec le comité.</div></div>';
  h += L.map((id, i) => { const o = occupe(id), nv = mcNiveau(id, c, p);
    return '<div class="p"><i>'+(i+1)+'</i><button type="button" class="mc-nom" data-g="avec" data-c="'+k+'" data-p="'+pid+'" data-a="'+mcEsc(id)+'"><span>'+mcEsc(nomDe(id))+'</span>'
      + (nv < 2 ? '<small class="mc-sec">'+mcEsc(libSect(c.cs))+(nv === 0 ? ' les deux jours' : ' le jour de l\'intervention')+'</small>' : '')
      + (o ? '<small>déjà en consultation ('+mcEsc(libSect(o.cs))+') '+(c.per === 'am' ? 'ce matin-là' : 'cet après-midi-là')+'</small>' : '')+'</button>'+mcDect(id)+'</div>'
      + (MC_CONF === p.id+'§'+id ? '<div class="mc-conf"><span>Le '+mcEsc(nomDe(id))+' a accepté ?</span><button type="button" class="mc-b oui" data-g="oui" data-c="'+k+'" data-p="'+pid+'" data-a="'+mcEsc(id)+'">Oui</button><button type="button" class="mc-b" data-g="non">Non</button></div>' : '');
  }).join('');
  return h + '</div><div class="mc-note">Appelez-le sur son DECT. S\'il accepte, <b>touchez son nom</b> puis confirmez : il fera la consultation à votre place. Prévenez ensuite le secrétariat des consultations.</div>';
}
function mcPiedRegler(c, p){ return '<div class="mc-btns"><button type="button" class="mc-b amb2" data-g="regle" data-c="'+mcEsc(cleCons(c))+'" data-p="'+mcEsc(p.id)+'">Réglé autrement</button></div>'; }
function mcBtnsSalle(c, ch){ const k = mcEsc(cleCons(c));
  return '<div class="mc-btns">'+ch.salles.map(x => '<button type="button" class="mc-b ind" data-g="salle" data-c="'+k+'" data-v="'+mcEsc(x)+'">Salle '+mcEsc(x)+'</button>').join('')
    + (ch.aucune ? '<button type="button" class="mc-b ind" data-g="salle" data-c="'+k+'" data-v="-">Aucune</button>' : '')+'</div>'; }
function mcSecteurTxt(c){ const n = c.nbSecteur || 0; return c.enAttente ? '' : (n ? mcPl(n,'patient')+' lib' : 'aucun patient lib'); }

/* ── À FAIRE ── */
function mcAFaire(){
  const M = mcMes(); if(!M.length || !DATA.patlib) return '';
  const cartes = [];
  M.forEach(c => {
    mcARegler(c).forEach(p => { const a = absentLeJour(MOI, p.bloc);
      cartes.push({ tri:'1'+p.bloc, h:'<div class="mc-af amb"><div class="t">'+mcPl(p.nb,'patient')+' opéré'+(p.nb>1?'s':'')+' le '+mcDate(p.bloc)+' : vous serez '+mcSera(a)+'</div>'
        + '<div class="sd">Vu'+(p.nb>1?'s':'')+' à votre consultation du '+mcDate(c.date)+' '+mcPer(c.per)+' · '+mcEsc(libSect(c.cs))+'</div>'
        + mcBlocQui(c, p) + mcPiedRegler(c, p) + '</div>' }); });
    const ch = patSalleAChoisir(c);
    if(ch) cartes.push({ tri:'2'+c.date, h:'<div class="mc-af ind"><div class="t">'+mcMaj(mcDate(c.date))+' '+mcPer(c.per)+' : dans quelle salle serez-vous ?</div>'
      + '<div class="sd">'+mcEsc(libSect(c.cs))+' · sert à retrouver vos patients dans l\'export des consultations</div>'+mcBtnsSalle(c, ch)+'</div>' });
    if(c.aValider){ const t = mcSecteurTxt(c);
      cartes.push({ tri:'3'+c.date, h:'<div class="mc-af ind"><div class="t">'+mcMaj(mcDate(c.date))+' '+mcPer(c.per)+' : est-ce vous qui faites cette consultation ?</div>'
      + '<div class="sd">'+mcEsc(libSect(c.cs))+' · posée au nom du secteur'+(t ? ' · '+t : '')+'</div>'
      + '<div class="mc-btns"><button type="button" class="mc-b ind" data-g="moi" data-c="'+mcEsc(cleCons(c))+'">Oui, c\'est moi</button></div></div>' }); }
  });
  cartes.sort((a,b)=> a.tri < b.tri ? -1 : a.tri > b.tri ? 1 : 0);
  return cartes.length
    ? '<div class="mc-k">À faire <span class="n">'+cartes.length+'</span></div>'+cartes.map(x => x.h).join('')
    : '<div class="mc-k">À faire</div><div class="mc-rien">✓ Rien à faire : aucun de vos patients lib n\'est opéré un jour où vous êtes absent.</div>';
}

/* ── LISTE ── */
function mcEtat(c){
  if(c.aValider) return ['ind','à confirmer'];
  if(patSalleAChoisir(c)) return ['ind','salle ?'];
  const n = mcARegler(c).reduce((t,p)=>t+p.nb,0);
  if(n) return ['amb', n+' à régler'];
  if(mcTotal(c)) return ['ok','✓ tout va bien'];
  return ['vide','＋ Ajouter'];
}
function mcSousTitre(c){
  const t = [mcPer(c.per)], s = mcSalle(c);
  if(s) t.push(s);
  if(c.aValider) t.push('du secteur');
  else if(DATA.patlib) t.push(mcTotal(c) ? mcPl(mcTotal(c),'patient')+' lib' : 'aucun patient lib noté');
  return t.join(' · ');
}
function mcListe(){
  const M = mcMes();
  if(!M.length) return '<div class="mc-vide"><b>Aucune consultation à votre nom</b><br>sur les 4 prochaines semaines.</div>';
  return M.map(c => { const e = mcEtat(c), corps = mcJour(c.date)+'<div class="mc-m"><b>'+mcEsc(libSect(c.cs))+'</b><span>'+mcSousTitre(c)+'</span></div>';
    // Sans patients lib à noter (MAR hors groupement) : la ligne informe, elle ne s'ouvre pas.
    return DATA.patlib ? '<button type="button" class="mc-c" data-g="ouvrir" data-c="'+mcEsc(cleCons(c))+'">'+corps+'<span class="mc-e '+e[0]+'">'+e[1]+'</span><span class="mc-ch">›</span></button>'
                       : '<div class="mc-c">'+corps+'</div>'; }).join('');
}

/* ── MES ABSENCES : d'aujourd'hui à 4 semaines après ma dernière consultation ── */
function mcAbsences(){
  const M = mcMes(); if(!M.length) return [];
  const i1 = Math.min((IDX[M[M.length-1].date] === undefined ? 0 : IDX[M[M.length-1].date]) + FEN - 1, JOURS_ALL.length - 1);
  const out = [];
  ((DATA.absences && DATA.absences[MOI]) || []).forEach(a => { const i = IDX[a.d]; if(i !== undefined && i <= i1) out.push({date:a.d, idx:i, code:a.c || ''}); });
  return out.sort((x,y)=> x.idx - y.idx);
}
function mcAbs(){
  if(!mcMes().length) return '';
  const P = grouper(mcAbsences());
  if(!P.length) return '<div class="mc-k">Mes absences sur la période</div><div class="card"><div class="mc-pied" style="padding-top:12px">Aucune absence : toutes les dates d\'intervention conviennent.</div></div>';
  return '<div class="mc-k">Mes absences sur la période</div><div class="card"><div class="mc-abs">'
    + P.map(p => '<span>'+libPlage(p)+(MOTIFS && p.code ? '<small>'+mcEsc(NOM_CODE[p.code] || p.code)+'</small>' : '')+'</span>').join('')
    + '</div><div class="mc-pied">Un patient opéré l\'un de ces jours devra être vu par un confrère.</div></div>';
}

/* ── CALENDRIER, REPLIÉ (décision du responsable : il apporte peu, il reste à portée de main) ── */
function mcCal(){
  const M = mcMes(); if(!M.length) return '';
  let h = '<button type="button" class="mc-calb" data-g="cal" aria-expanded="'+MC_CAL+'"><span>Voir le calendrier</span><i>'+(MC_CAL ? '▴' : '▾')+'</i></button>';
  if(!MC_CAL) return h;
  const abs = {}, cs = {}, auj = iso(new Date());
  mcAbsences().forEach(a => { abs[a.date] = a.code || '·'; });
  M.forEach(c => { (cs[c.date] = cs[c.date] || []).push(c); });
  // Du lundi de cette semaine à la semaine de ma dernière consultation (4 semaines au moins).
  const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate() - ((d.getDay()+6)%7));
  if(new Date().getDay() === 6 || new Date().getDay() === 0) d.setDate(d.getDate()+7);   // le week-end : la semaine qui vient
  const fin = M[M.length-1].date;
  h += '<div class="card mc-cal"><div class="mc-calh"><span>lun.</span><span>mar.</span><span>mer.</span><span>jeu.</span><span>ven.</span></div>';
  for(let w = 0; w < 4 || (iso(d) <= fin && w < 6); w++){
    h += '<div class="mc-calr">';
    for(let j = 0; j < 5; j++){ const k = iso(d), L = cs[k] || [];
      h += '<div class="mc-calc'+(abs[k] ? ' off' : '')+(k < auj ? ' avant' : '')+'"><b>'+d.getDate()+'</b>'
        + (j === 0 || d.getDate() === 1 ? '<em>'+MOIS_FR[d.getMonth()]+'</em>' : '')
        + L.map(c => DATA.patlib ? '<button type="button" class="mc-calp" data-g="ouvrir" data-c="'+mcEsc(cleCons(c))+'">'+(c.per === 'am' ? 'matin' : 'ap.-m.')+'</button>'
                                 : '<span class="mc-calp" style="text-align:center">'+(c.per === 'am' ? 'matin' : 'ap.-m.')+'</span>').join('')
        + (abs[k] ? '<small>'+((MOTIFS && MC_COURT[abs[k]]) || 'absent')+'</small>' : '')+'</div>';
      d.setDate(d.getDate()+1); }
    d.setDate(d.getDate()+2); h += '</div>';
  }
  return h + '<div class="mc-pied">En bleu, vos consultations'+(DATA.patlib ? ' : touchez-en une pour l\'ouvrir' : '')+'. En gris, vos absences.</div></div>';
}

/* ── FEUILLE D'UNE CONSULTATION ── */
function _bornes(c){ const d=dt(c.date); const a=new Date(d); a.setDate(a.getDate()+2); const b=new Date(d); b.setMonth(b.getMonth()+1); return [iso(a), iso(b)]; }

  if(c.secteur) h += '<div class="mc-info"><span>Consultation du secteur, prise par vous.</span><button type="button" data-g="pasmoi" data-c="'+k+'">Ce n\'est pas moi</button></div>';
  if(MC_SUPPR) h += '<div class="mc-undo"><span>Ligne supprimée.</span><button type="button" data-g="restaurer">Annuler</button></div>';

    const X = '<button type="button" class="mc-sup" data-g="suppr" data-p="'+pid+'" aria-label="Supprimer la ligne">×</button>';
    if(!a) h += '<div class="mc-pl"><div class="ligne">'+tete+'vous êtes là</span></div><span class="mc-ok2">✓</span>'+X+'</div></div>';
    else if(p.confieA) h += '<div class="mc-pl vert"><div class="ligne">'+tete+'vous serez '+mcSera(a)+'</span></div>'+X+'</div>'
      + '<div class="mc-avec">✓ Réglé'+(p.confieA !== '-' ? ' avec le '+mcEsc(nomDe(p.confieA)) : '')+'</div>'
      + '<button type="button" class="mc-lien" data-g="deregle" data-p="'+pid+'">Ce n\'est plus réglé</button></div>';
    else h += '<div class="mc-pl amb"><div class="ligne">'+tete+'vous serez '+mcSera(a)+'</span></div>'+X+'</div>'+mcBlocQui(c, p)+mcPiedRegler(c, p)+'</div>';
  });
  if(!MC_FORM) h += '<button type="button" class="mc-aj" data-g="form">＋ Ajouter un patient lib</button>';
  else { const B = _bornes(c);
    h += '<div class="mc-form"><div class="rg"><div style="flex:1"><label for="mcDate">Date opératoire</label><input type="date" id="mcDate" min="'+B[0]+'" max="'+B[1]+'"></div>'
      + '<div><label>Nombre</label><div class="mc-nb"><button type="button" data-g="nb" data-v="-1" aria-label="Moins">−</button><span id="mcNb">'+MC_NB+'</span><button type="button" data-g="nb" data-v="1" aria-label="Plus">+</button></div></div></div>'
      + '<div class="mc-err" id="mcErr"></div><div class="mc-btns"><button type="button" class="mc-b bleu" data-g="ajouter">Ajouter</button></div></div>'; }
  document.getElementById('mcCorps').innerHTML = h+'<p class="mc-mention">Aucun nom de patient n\'est enregistré.</p>';
}
function mcOuvrir(k){ if(!DATA.patlib || !mcCons(k)) return; MC_OUVERTE = k; MC_FORM = false; MC_NB = 1; MC_SUPPR = null; mcFeuille();
  document.getElementById('mcVoile').classList.add('open'); document.getElementById('mcFeuille').classList.add('open'); }
function mcFermer(){ MC_OUVERTE = null; MC_SUPPR = null; document.getElementById('mcVoile').classList.remove('open'); document.getElementById('mcFeuille').classList.remove('open'); }

function rendreMar(){
  document.getElementById('zone').innerHTML = '<div class="mc">'+mcAFaire()
    + '<div class="mc-k">Mes consultations</div><div class="card">'+mcListe()+'</div>'+mcAbs()+mcCal()+'</div>';
  if(MC_OUVERTE) mcFeuille();
}
function mcToast(txt, annuler){
  const t = document.getElementById('mcToast'); document.getElementById('mcToastTxt').textContent = txt;
  MC_ANNULER = annuler || null; document.getElementById('mcToastBtn').style.display = annuler ? '' : 'none';
  t.classList.add('open'); clearTimeout(MC_TOAST); MC_TOAST = setTimeout(() => t.classList.remove('open'), annuler ? 7000 : 4000);
}
function mcErr(m){ const e = document.getElementById('mcErr'); if(e){ e.textContent = m; e.style.display = 'block'; } else mcToast(m); }

/* Un seul envoi à la fois ; la réponse du serveur EST la nouvelle liste. */
async function patEnvoyer(corps){
  if(MC_OCCUPE) return null;
  MC_OCCUPE = true; document.body.classList.add('mc-occupe');
  try{
    const r = await apiPost(Object.assign({action:'patientsLib'}, corps));
    if(!(r && r.success)){ mcErr((r && r.error) || 'Le serveur n\'a pas répondu — réessayez.'); return null; }
    // Lignes CPA : servies seulement par getConsultAbsences — la réponse de patientsLib ne les
    // contient pas. Dès qu'il y en a à l'écran, on relit tout, sinon elles disparaissent.
    const aCpa = Object.keys(PATIENTS).some(k => PATIENTS[k].some(p => p.cpa));
    if(aCpa || corps.op === 'salle' || corps.op === 'secteur' || String(corps.id || '').indexOf('cpa|') === 0){
      const d = await apiPost({action:'getConsultAbsences'});   // lignes CPA : recalculées par le serveur
      if(d && d.success){ DATA = d; lireMarges(d); patCharger(d.patients); }
      return r;
    }
    patCharger(r.patients); return r;
  }catch(e){ mcErr('Erreur réseau — réessayez.'); return null; }
  finally{ MC_OCCUPE = false; document.body.classList.remove('mc-occupe'); }
}
function mcPatient(pid){ let p = null; Object.keys(PATIENTS).some(k => !!(p = PATIENTS[k].find(x => x.id === pid))); return p; }
async function mcRegler(pid, avec){            // avec = identifiant du confrère, ou « - » (réglé autrement)
  const p = mcPatient(pid); if(!p) return;
  const txt = avec === '-' ? 'Noté : '+mcPl(p.nb,'patient')+' du '+mcDate(p.bloc)+', réglé.' : 'Noté : réglé avec le '+nomDe(avec)+'.';
  const r = await patEnvoyer({op:'confier', id:pid, a:avec}); MC_CONF = '';
  if(!r){ rendreMar(); return; }
  rendreMar(); mcToast(txt, () => mcDeregler(pid));
}
async function mcDeregler(pid){ const r = await patEnvoyer({op:'reprendre', id:pid}); if(r) rendreMar(); }
async function mcAjouter(){
  const c = mcCons(MC_OUVERTE); if(!c) return;
  MC_SUPPR = null;
  const v = document.getElementById('mcDate').value, B = _bornes(c);
  if(!v) return mcErr('Choisissez la date opératoire.');
  const w = dt(v).getDay(); if(w===0||w===6) return mcErr('Cette date tombe un week-end.');
  if(v < B[0]) return mcErr('Trop tôt : la consultation doit avoir lieu au moins 48 h avant le geste.');
  if(v > B[1]) return mcErr('Trop tard : la consultation doit avoir lieu dans le mois qui précède le geste.');
  const r = await patEnvoyer({op:'ajouter', consult:c.date, per:c.per, bloc:v, nb:MC_NB});
  if(!r) return;
  MC_FORM = false; MC_NB = 1; rendreMar();
}
async function mcSupprimer(pid){
  const p = mcPatient(pid); if(!p) return;
  const r = await patEnvoyer({op:'supprimer', id:pid}); if(!r) return;
  MC_SUPPR = p; MC_CONF = ''; rendreMar();
}
async function mcRestaurer(){
  const p = MC_SUPPR, c = mcCons(MC_OUVERTE); if(!p) return;
  if(p.cpa){ const r0 = await patEnvoyer({op:'reprendre', id:p.id}); if(!r0) return; MC_SUPPR = null; rendreMar(); return; }
  const r = await patEnvoyer({op:'ajouter', consult:p.consult, per:p.per, bloc:p.bloc, nb:p.nb}); if(!r) return;
  if(p.confieA && c){            // la ligne était réglée : elle le redevient
    const n = patDe(c).find(x => x.bloc === p.bloc && x.nb === p.nb && !x.confieA);
    if(n) await patEnvoyer({op:'confier', id:n.id, a:p.confieA});
  }
  MC_SUPPR = null; rendreMar();
}
/* Export CPA — choix de la salle : un toucher, et les patients de la salle apparaissent. */
async function mcChoisirSalle(k, salle){
  const c = mcCons(k); if(!c) return;
  const r = await patEnvoyer({op:'salle', date:c.date, per:c.per, salle:salle}); if(!r) return;
  rendreMar(); const c2 = mcCons(k), n = c2 ? mcTotal(c2) : 0;
  mcToast(salle === '-' ? 'Noté : aucune salle.' : 'Salle '+salle+' : '+(n ? mcPl(n,'patient')+' lib retrouvé'+(n>1?'s':'')+'.' : 'aucun patient lib.'));
}
/* Consultation tenue par le secteur (sans nom dans l'admin) : montrée aux MAR placés dans ce
   secteur du bloc ; celui qui la fait la prend, elle devient la sienne. « Ce n'est pas moi » la rend. */
async function mcSecteur(k, prendre){
  const c = mcCons(k); if(!c) return;
  const r = await patEnvoyer({op:'secteur', date:c.date, per:c.per, cs:c.cs, prendre:prendre});
  if(!r) return;                 // refus (déjà prise, plus dans le secteur…) : le message est affiché
  if(!prendre) mcFermer();
  rendreMar(); const c2 = mcCons(k);
  if(prendre && c2) mcToast('Consultation prise : '+(mcTotal(c2) ? mcPl(mcTotal(c2),'patient')+' lib.' : 'aucun patient lib.'));
}

/* ── GESTES : un seul écouteur, chaque bouton porte data-g ── */
document.addEventListener('click', function(ev){
  const b = ev.target && ev.target.closest && ev.target.closest('[data-g]'); if(!b || ROLE !== 'mar' || !DATA) return;
  const d = b.dataset;
  switch(d.g){
    case 'ouvrir':   mcOuvrir(d.c); break;
    case 'cal':      MC_CAL = !MC_CAL; rendreMar(); break;
    case 'avec':     MC_CONF = (MC_CONF === d.p+'§'+d.a) ? '' : d.p+'§'+d.a; rendreMar(); break;   // 1er toucher : la question, rien n'est enregistré
    case 'non':      MC_CONF = ''; rendreMar(); break;
    case 'oui':      mcRegler(d.p, d.a); break;
    case 'regle':    mcRegler(d.p, '-'); break;
    case 'deregle':  mcDeregler(d.p); break;
    case 'salle':    mcChoisirSalle(d.c, d.v); break;
    case 'moi':      mcSecteur(d.c, true); break;
    case 'pasmoi':   mcSecteur(d.c, false); break;
    case 'form':     MC_FORM = true; MC_NB = 1; MC_SUPPR = null; mcFeuille(); break;
    case 'nb':       MC_NB = Math.max(1, Math.min(9, MC_NB + Number(d.v))); document.getElementById('mcNb').textContent = MC_NB; break;
    case 'ajouter':  mcAjouter(); break;
    case 'suppr':    mcSupprimer(d.p); break;
    case 'restaurer':mcRestaurer(); break;
    case 'fermer':   mcFermer(); break;
    case 'annuler':  { const f = MC_ANNULER; MC_ANNULER = null; document.getElementById('mcToast').classList.remove('open'); if(f) f(); } break;
  }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && MC_OUVERTE) mcFermer(); });

/* ══ RENDU ═════════════════════════════════════════════════════════════ */
let curBtn=null, curSlot=null, pick=null;

function rendre(){
  if(ROLE === 'mar'){ rendreMar(); return; }   // (28/11/2026) le MAR a sa propre vue ; ce qui suit sert le secrétariat
  const mien = (ROLE === 'mar');
  const vis = (DATA.consultations||[]).filter(c => !mien || c.mar === MOI);
  document.getElementById('zone').innerHTML =
    '<div class="cols">'+
      '<div class="card"><h2>'+(mien?'Mes consultations':'Consultations posées')+

    '</div>';

  const file = document.getElementById('file');
  if(!vis.length){
    file.innerHTML = '<div class="empty">'+(mien
      ? '<b>Aucune consultation à votre nom</b> sur les 4 prochaines semaines.'
      : '<b>Aucune consultation posée</b> sur les 4 prochaines semaines.<br>Le comité ne les a pas encore nommées.')+'</div>';
    document.getElementById('panel').style.display='none';
    return;
  }
  const parJour = {};
  vis.forEach(c=>{ (parJour[c.date] = parJour[c.date] || []).push(c); });
  Object.keys(parJour).sort().forEach(ds=>{
    const g = document.createElement('div');
    g.innerHTML = '<div class="dayhead">'+libDate(ds)+'</div>';
    parJour[ds].forEach(c=>{
      const n = absFenetre(c.mar, c.date).length;

      b.className='slot';

        '<span class="when">'+(c.per==='am'?'matin':'après-midi')+'</span>';
      b.addEventListener('click', ()=> selectionner(b, c));
      g.appendChild(b);
    });
    file.appendChild(g);
  });
  const p0 = file.querySelector('.slot'); if(p0) p0.click();
}

function selectionner(btn, c){
  if(curBtn) curBtn.setAttribute('aria-current','false');
  curBtn = btn; btn.setAttribute('aria-current','true');
  curSlot = c; pick = null;

  document.getElementById('pName').textContent = nomDe(c.mar);
  document.getElementById('pCtx').textContent =
    libSect(c.cs)+' · '+libDate(c.date)+' '+(c.per==='am'?'matin':'après-midi');
  const i0 = IDX[c.date];
  const fin = JOURS_ALL[Math.min(i0+FEN-1, JOURS_ALL.length-1)];
  document.getElementById('calLbl').textContent =
    '4 semaines — jusqu\'au '+dt(fin).getDate()+' '+MOIS_FR[dt(fin).getMonth()];

  const plages = grouper(absFenetre(c.mar, c.date));
  const a = document.getElementById('pAnswer');
  if(!plages.length){
    a.innerHTML = '<div class="clear"><b>Aucune absence dans les 4 semaines qui suivent.</b><br>'+
      'Toutes les dates d\'intervention conviennent'+(ROLE==='mar'?'':' pour ce médecin')+'.</div>';
  } else {
    const tot = plages.reduce((t,p)=> t+nbJours(p), 0);
    /* (27/11/2026, décision du responsable) Le panneau « qui peut prendre le patient »
       d'une période sert l'orientation d'emblée (secrétariat, solution finale). Pour le
       MAR, on reste sur le rattrapage (« Qui peut le voir ? » des patients lib) : ses
       dates d'absence s'affichent mais ne s'ouvrent plus. */
    const ouvrable = ROLE !== 'mar';
    a.innerHTML = '<div class="lbl">Dates d\'intervention à éviter — <b>'+tot+'</b> jour'+
      (tot>1?'s':'')+' sur '+plages.length+' période'+(plages.length>1?'s':'')+' :</div>'+
      '<div class="dates">'+plages.map((p,k)=>
        (ouvrable ? '<button class="d" data-k="'+k+'" aria-pressed="false">' : '<span class="d" style="cursor:default">')+libPlage(p)+
        (MOTIFS && p.code ? '<small>'+(NOM_CODE[p.code]||p.code)+'</small>' : '')+
        (ouvrable ? '</button>' : '</span>')).join('')+'</div>'+
      (ouvrable ? '<div class="hintclick">Cliquez une période pour voir qui peut prendre le patient.</div>' : '');
    if(ouvrable) a.querySelectorAll('.d').forEach(el=>{
      el.addEventListener('click', ()=>{
        const was = el.getAttribute('aria-pressed')==='true';
        a.querySelectorAll('.d').forEach(x=> x.setAttribute('aria-pressed','false'));
        pick = was ? null : plages[+el.dataset.k];
        if(!was) el.setAttribute('aria-pressed','true');
        rendreAlt(); rendreGrille();
      });
    });
  }
  rendreAlt(); rendreGrille();
  document.getElementById('pFoot').innerHTML = (ROLE==='mar')
    ? 'Ce sont vos absences après cette consultation. Un patient que vous y verriez et qui serait opéré sur l\'une de ces périodes devra être <b>repris par un confrère</b>.'
    : 'Comparez ces périodes avec les <b>dates d\'intervention</b> de votre liste. Un patient dont le bloc y tombe doit être placé sur la consultation d\'un autre médecin.';
}

function rendreAlt(){
  const box = document.getElementById('pAlt');
  if(!pick || !curSlot){ box.innerHTML=''; return; }
  const p = pick, secteur = curSlot.cs;
  const total = p.finIdx - p.debIdx + 1;
  // Absence d'un MAR un JOUR donné (index dans JOURS_ALL).
  const absentLe = (id, i)=>{
    const l = (DATA.absences && DATA.absences[id]) || [];
    for(const a of l){ if(IDX[a.d] === i) return true; }
    return false;
  };
  // Toutes ses consultations de la fenêtre, de la plus ancienne à la plus récente.
  const csDe = (id)=> (DATA.consultations||[])
    .filter(x=> x.mar===id && IDX[x.date] !== undefined)
    .sort((a,b)=> IDX[a.date] - IDX[b.date]);
  /* COUVERTURE JOUR PAR JOUR (28/07/2026) — remplace deux critères absolus qui
     vidaient l'écran sur les longues absences :
       • « présent sur TOUTE la période » écartait quiconque avait un seul jour
         d'absence sur 19 jours ouvrés — en août, tout le monde ;
       • « consultation avant le DÉBUT de la période » ne laissait éligibles que
         les consultations déjà passées, soit une seule journée.
     Le patient est opéré UN jour, pas pendant toute la période. Un confrère couvre
     le jour i s'il est présent ce jour-là ET a une consultation strictement avant —
     y compris une consultation qui tombe PENDANT la période : il voit le patient
     ce jour-là et l'opère plus tard. Renvoie les plages de jours consécutifs. */
  const couverture = (id)=>{
    const cs = csDe(id); if(!cs.length) return null;
    const c0 = IDX[cs[0].date];                   // sa première consultation
    const plages = [];
    for(let i=p.debIdx; i<=p.finIdx; i++){
      if(i <= c0 || absentLe(id, i)) continue;
      const L = plages[plages.length-1];
      if(L && i === L.fin+1) L.fin = i; else plages.push({deb:i, fin:i});
    }
    if(!plages.length) return null;
    return {plages: plages, nb: plages.reduce((n,x)=> n + (x.fin-x.deb+1), 0), cs: cs};
  };
  const COUV = {};
  const tous = Object.keys(DATA.noms||{});
  // GROUPEMENT SEULEMENT (28/07/2026). Un MAR hors groupement ne peut pas prendre en
  // charge un patient libéral : le proposer n'aurait pas de sens. Source = colonne
  // LIBERAL de MEDECINS transmise par le serveur, jamais le relevé mensuel.
  // Repli : si le serveur ne transmet rien (ancienne version déployée), on n'exclut
  // personne — l'écran dégrade vers son comportement précédent au lieu de se vider.
  const GRP = (DATA && DATA.groupement) || null;
  const dispo = tous.filter(id=>{
    if(id === curSlot.mar) return false;
    if(GRP && !GRP[id]) return false;
    const cv = couverture(id);
    if(!cv) return false;
    COUV[id] = cv; return true;
  });
  const plageTxt = (x)=> libPlage({deb:JOURS_ALL[x.deb], fin:JOURS_ALL[x.fin]});
  const ligne = (id)=>{
    const cv = COUV[id];
    // Marges CCAM et NGAP : affichées au MAR seulement (vides pour le secrétariat).
    const quand = (cv.nb === total)
      ? 'couvre toute la période'
      : 'couvre ' + cv.plages.slice(0,2).map(plageTxt).join(' · ')
        + (cv.plages.length > 2 ? ' +' + (cv.plages.length-2) : '');
    return '<div class="person"><b>'+nomDe(id)+'</b>'+
      '<span class="cs">'+quand+' · consulte '+libDate(cv.cs[0].date)+
      ' '+(cv.cs[0].per==='am'?'matin':'ap.-midi')+'</span></div>';
  };
  // TRI PAR MARGE CCAM DÉCROISSANTE (27/07/2026). Une consultation libérale déclenche
  // un bloc : c'est l'axe CCAM qui portera la charge, pas le NGAP. Reprendre le patient
  // d'un confrère doit donc se faire vers celui qui a le plus de place au BLOC.
  // Un membre dont le relevé du mois n'est pas encore saisi n'a pas de chiffre : il
  // passe en fin de liste, sans pastille — il reste proposable.
  // À marge égale (ou sans chiffre), la plus large couverture d'abord.
  // (27/11/2026) Puis NGAP aussi : la plus serrée des deux marges décide (margeEff).
  const parMarge = (a,b) => triMarge(a, b) || (COUV[b].nb - COUV[a].nb);
  const meme  = dispo.filter(id=> COUV[id].cs.some(x=> x.cs === secteur)).sort(parMarge);
  const autres= dispo.filter(id=> meme.indexOf(id) < 0).sort(parMarge);

  let h = '<div class="alt"><h4>Patient opéré '+(nbJours(p)>1?'entre le ':'le ')+libPlage(p)+
    ' — qui peut le voir ?</h4><div class="why">Membres du groupement ayant une consultation '+
    'avant la date d\'intervention et présents ce jour-là. La plage indiquée est celle '+
    'que chacun couvre.</div>';
  if(MARGE_OK) h += '<div class="why" style="margin-top:-4px">Classés du plus disponible au moins disponible sous les 30 % de libéral.</div>';
  if(!dispo.length){
    h += '<div class="none-alt">Aucun membre du groupement ne remplit les conditions. À arbitrer avec le comité.</div>';
  } else {
    if(meme.length)   h += '<div class="altgrp"><div class="t">Même secteur — '+libSect(secteur)+
                           '</div>'+meme.map(ligne).join('')+'</div>';
    if(autres.length) h += '<div class="altgrp"><div class="t">Autres secteurs — '+autres.length+
                           ' possible'+(autres.length>1?'s':'')+'</div>'+
                           autres.map(ligne).join('')+'</div>';
  }
  box.innerHTML = h+'</div>';
}

function rendreGrille(){
  if(!curSlot) return;
  const g = document.getElementById('pGrid');
  const i0 = IDX[curSlot.date];
  const debut = i0 - (dt(curSlot.date).getDay() - 1);   // lundi de sa semaine
  const absMap = {};
  ((DATA.absences && DATA.absences[curSlot.mar]) || []).forEach(a=>{ absMap[a.d] = a.c || '·'; });
  const mesCS = {};
  (DATA.consultations||[]).forEach(x=>{ if(x.mar === curSlot.mar) mesCS[x.date] = true; });
  g.innerHTML = '';
  for(let w=0; w<4; w++){
    const tr = document.createElement('tr'); let html='';
    for(let k=0; k<5; k++){
      const i = debut + w*5 + k;
      if(i<0 || i>=JOURS_ALL.length){ html += '<td class="hors"></td>'; continue; }
      const ds = JOURS_ALL[i], cls = [];
      let motif = '';
      if(i < i0) cls.push('hors');
      else {
        if(absMap[ds]){
          cls.push('absent');
          if(MOTIFS && absMap[ds] !== '·') motif = '<div class="c">'+absMap[ds]+'</div>';
        }
        if(pick && i >= pick.debIdx && i <= pick.finIdx) cls.push('pick');
      }
      if(mesCS[ds]) cls.push('consult');
      html += '<td class="'+cls.join(' ')+'"><div class="n">'+dt(ds).getDate()+'</div>'+motif+'</td>';
    }
    tr.innerHTML = html; g.appendChild(tr);
  }
}
/* ═══════════════════════════════════════════════════════════════════════════
   CHRONO — INSTRUMENT DE MESURE (01/08/2026)
   ═══════════════════════════════════════════════════════════════════════════
   LECTURE SEULE. N'ecrit rien, n'appelle rien, ne modifie aucun affichage.
   Se contente d'observer et de tenir un journal, consultable dans la console.

   POURQUOI. Jusqu'ici seul admin.html savait mesurer ses APPELS (chronoAPI).
   Rien ne mesurait : le temps du navigateur (analyse du JS, rendu), les
   ressources tierces (polices, icones), ni le COUT D'UN CLIC. Or sur admin
   chaque placement rappelle renderWeek() en entier : c'est la partie du temps
   que personne n'a jamais chiffree.

   A TAPER DANS LA CONSOLE :
     chrono()        le budget complet de la page (ouverture + appels + rendus)
     chronoClics()   le detail des interactions : clic -> ecran mis a jour
     chronoAPI()     (admin) le detail des appels serveur, inchange

   TROIS MESURES, TROIS SENS DIFFERENTS :
   - « attente »    : le temps entre le clic et le debut du traitement. Si elle
                      est grande, le navigateur etait deja occupe ailleurs.
   - « traitement » : le temps passe DANS notre code. C'est le seul que l'on
                      peut reduire nous-memes.
   - « ecran »      : le temps de peinture apres le traitement.

   Cout de l'instrument lui-meme : deux observateurs natifs du navigateur et
   un push dans un tableau par evenement. Non mesurable a l'echelle de la page.
   ═════════════════════════════════════════════════════════════════════════ */
(function () {
  if (window.PERF) return;

  var P = {
    page: (location.pathname.split('/').pop() || 'planning.html'),
    jalons: [],      // etapes nommees du chargement
    rendus: [],      // durees des fonctions d'affichage surveillees
    clics: [],       // interactions utilisateur
    longues: [],     // taches > 50 ms : l'ecran est fige pendant ce temps
    appels: []       // journal des appels serveur (admin : partage avec chronoAPI)
  };
  window.PERF = P;

  // ── Jalons ───────────────────────────────────────────────────────────────
  P.jalon = function (nom) {
    try { P.jalons.push({ nom: nom, t: Math.round(performance.now()) }); } catch (e) {}
  };

  // ── Journal d'appel serveur (pages sans chronoAPI) ───────────────────────
  P.appel = function (action, ms, srv, depart, issue, glob) {
    try {
      P.appels.push({ action: action, ms: ms, srv: (typeof srv === 'number' ? srv : null),
                      glob: (typeof glob === 'number' ? glob : null),
                      depart: depart, essais: 1, issue: issue || 'ok' });
    } catch (e) {}
  };

  // Enregistre une duree. Plafond : une session de plusieurs heures ne doit pas
  // faire enfler le journal (l'instrument ne doit jamais devenir le probleme).
  P.note = function (nom, ms, t, bloquant) {
    if (P.rendus.length >= 5000) P.rendus.shift();
    P.rendus.push({ nom: nom, ms: ms, t: t, bloquant: (bloquant == null ? ms : bloquant) });
  };

  // ── Surveillance des fonctions d'affichage ───────────────────────────────
  // Enveloppe une fonction globale pour en chronometrer chaque execution.
  // A appeler APRES la declaration des fonctions concernees (fin de script).
  P.surveiller = function (noms) {
    (noms || []).forEach(function (n) {
      var f = window[n];
      if (typeof f !== 'function' || f._chrono) return;
      var g = function () {
        var d = performance.now(), r;
        try { r = f.apply(this, arguments); }
        finally { try {
          var sync = performance.now() - d;
          // Fonction asynchrone : le temps qui compte est celui de la promesse,
          // pas celui du retour. On note les deux — « bloquant » est le seul
          // temps pendant lequel l'ecran est fige.
          if (r && typeof r.then === 'function') {
            r.then(_fin, _fin);
            function _fin() { P.note(n, Math.round(performance.now() - d), Math.round(d), Math.round(sync)); }
          } else {
            P.note(n, Math.round(sync), Math.round(d), Math.round(sync));
          }
        } catch (e) { /* l'instrument ne doit JAMAIS casser la fonction mesuree */ } }
        return r;
      };
      g._chrono = true;
      try { window[n] = g; } catch (e) {}
    });
  };

  // ── Observateur : taches longues (ecran fige) ────────────────────────────
  try {
    new PerformanceObserver(function (l) {
      l.getEntries().forEach(function (e) {
        P.longues.push({ t: Math.round(e.startTime), ms: Math.round(e.duration) });
      });
    }).observe({ type: 'longtask', buffered: true });
  } catch (e) {}

  // ── Observateur : interactions (clic -> ecran) ───────────────────────────
  function _cible(el) {
    if (!el || !el.tagName) return '?';
    var s = el.tagName.toLowerCase();
    if (el.id) return s + '#' + el.id;
    var c = (el.className && el.className.baseVal !== undefined) ? el.className.baseVal : el.className;
    if (typeof c === 'string' && c.trim()) return s + '.' + c.trim().split(/\s+/).slice(0, 2).join('.');
    var t = (el.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 18);
    return t ? s + ' « ' + t + ' »' : s;
  }
  try {
    new PerformanceObserver(function (l) {
      l.getEntries().forEach(function (e) {
        if (e.name !== 'click' && e.name !== 'keydown' && e.name !== 'pointerdown') return;
        P.clics.push({
          nom: e.name,
          cible: _cible(e.target),
          t: Math.round(e.startTime),
          attente: Math.round(e.processingStart - e.startTime),
          traitement: Math.round(e.processingEnd - e.processingStart),
          ecran: Math.round(e.startTime + e.duration - e.processingEnd),
          total: Math.round(e.duration)
        });
      });
    }).observe({ type: 'event', durationThreshold: 16, buffered: true });
  } catch (e) {}

  // ── Mise en forme ────────────────────────────────────────────────────────
  function col(t, n) { var s = String(t); while (s.length < n) s += ' '; return s.slice(0, n); }
  function ms(v, n) { return String(Math.round(v)).padStart(n || 6, ' '); }
  function sec(v) { return (v / 1000).toFixed(1) + ' s'; }

  // ── chrono() : le budget complet ─────────────────────────────────────────
  P.rapport = function () {
    var L = ['', '══ CHRONO — ' + P.page + ' — ' + new Date().toLocaleTimeString('fr-FR') + ' ══'];
    var nav = null;
    try { nav = performance.getEntriesByType('navigation')[0] || null; } catch (e) {}

    // 1. Arrivee de la page elle-meme
    if (nav) {
      L.push('');
      L.push('── 1. La page (fichier HTML) ' + '─'.repeat(30));
      L.push('   DNS + connexion   ' + ms(nav.connectEnd - nav.domainLookupStart) + ' ms');
      L.push('   Reponse serveur   ' + ms(nav.responseStart - nav.requestStart) + ' ms   (premier octet)');
      L.push('   Telechargement    ' + ms(nav.responseEnd - nav.responseStart) + ' ms   '
             + (nav.transferSize ? '(' + Math.round(nav.transferSize / 1024) + ' Ko transferes)' : ''));
      L.push('   Analyse + script  ' + ms(nav.domContentLoadedEventEnd - nav.responseEnd) + ' ms   '
             + '(lecture du HTML, du CSS et execution du JS)');
      L.push('   → page prete      ' + ms(nav.domContentLoadedEventEnd) + ' ms');
    }

    // 2. Ressources tierces
    var res = [];
    try {
      res = performance.getEntriesByType('resource')
        .filter(function (r) { return r.duration >= 5 && !/googleusercontent|script\.google/.test(r.name); })
        .sort(function (a, b) { return b.duration - a.duration; }).slice(0, 8);
    } catch (e) {}
    if (res.length) {
      L.push('');
      L.push('── 2. Ressources chargees ' + '─'.repeat(33));
      res.forEach(function (r) {
        var court = r.name.replace(/^https?:\/\//, '').replace(/\?.*$/, '');
        if (court.length > 46) court = court.slice(0, 20) + '…' + court.slice(-25);
        L.push('   ' + col(court, 48) + ms(r.duration) + ' ms  '
               + (r.transferSize ? Math.round(r.transferSize / 1024) + ' Ko' : 'poids n.c.'));
      });
    }

    // 3. Appels serveur
    var J = P.appels;
    if (J && J.length) {
      var tot = 0, srv = 0, glo = 0, ech = 0;
      J.forEach(function (c) {
        tot += c.ms; srv += (c.srv || 0); glo += (c.glob || 0);
        if (String(c.issue).indexOf('ECHEC') === 0) ech++;
      });
      L.push('');
      L.push('── 3. Appels serveur ' + '─'.repeat(38));
      J.forEach(function (c, i) {
        var dep = (c.depart != null) ? ('T+' + (c.depart / 1000).toFixed(1) + 's ') : '';
        L.push('   ' + String(i + 1).padStart(2) + '. ' + col(dep, 9) + col(c.action, 24)
               + ms(c.ms) + ' ms'
               + (c.srv != null
                    ? '   (avant doGet ' + (c.glob != null ? ms(c.glob, 5) : '    ?')
                      + ' · doGet ' + ms(c.srv, 5)
                      + ' · reseau ' + ms(Math.max(0, c.ms - c.srv - (c.glob || 0)), 5) + ')'
                    : '')
               + (c.essais > 1 ? '  ' + c.essais + ' ESSAIS' : '')
               + (String(c.issue).indexOf('ECHEC') === 0 ? '   ' + c.issue : ''));
      });
      L.push('   ' + col('', 9) + col('TOTAL ' + J.length + ' appels', 24) + ms(tot) + ' ms'
             + '   (avant doGet ' + ms(glo, 5) + ' · doGet ' + ms(srv, 5)
             + ' · reseau ' + ms(Math.max(0, tot - srv - glo), 5) + ')'
             + (ech ? '   ' + ech + ' EN ECHEC' : ''));
      L.push('   « avant doGet » = notre code global (TEST_YEAR, ouverture du classeur).');
      L.push('   « reseau » contient encore la COMPILATION des 545 Ko de .gs : la separer');
      L.push('   demande le menu Executions d\'Apps Script (duree totale a comparer).');
    }

    // 3bis. Detail serveur (fourni par getAdminBootstrap)
    var avecDetail = (J || []).filter(function (c) { return c.detail && typeof c.detail === 'object'; });
    avecDetail.forEach(function (c) {
      var etapes = Object.keys(c.detail);
      if (!etapes.length) return;
      L.push('');
      L.push('── 3bis. Detail de ' + c.action + ' (' + (c.srv != null ? c.srv + ' ms' : '?') + ') '
             + '─'.repeat(Math.max(0, 26 - c.action.length)));
      etapes.sort(function (a, b) { return c.detail[b] - c.detail[a]; }).forEach(function (e) {
        L.push('   ' + col(e, 38) + ms(c.detail[e]) + ' ms');
      });
      if (c.ser != null) L.push('   ' + col('serialisation de la reponse', 38) + ms(c.ser) + ' ms');
      if (c.taille) L.push('   ' + col('taille de la reponse', 38)
                           + ms(Math.round(c.taille / 1024)) + ' Ko');
    });

    // 4. Jalons
    if (P.jalons.length) {
      L.push('');
      L.push('── 4. Etapes ' + '─'.repeat(46));
      P.jalons.forEach(function (j) { L.push('   ' + col(j.nom, 34) + ms(j.t) + ' ms'); });
    }

    // 5. Rendus
    if (P.rendus.length) {
      var par = {};
      P.rendus.forEach(function (r) {
        if (!par[r.nom]) par[r.nom] = { n: 0, tot: 0, pire: 0, bloq: 0 };
        par[r.nom].n++; par[r.nom].tot += r.ms; par[r.nom].bloq += r.bloquant;
        if (r.ms > par[r.nom].pire) par[r.nom].pire = r.ms;
      });
      L.push('');
      L.push('── 5. Affichage (temps passe dans notre code) ' + '─'.repeat(13));
      L.push('   ' + col('fonction', 26) + col('appels', 8) + col('cumul', 10)
             + col('moyenne', 10) + col('pire', 10) + 'dont ecran fige');
      Object.keys(par).sort(function (a, b) { return par[b].tot - par[a].tot; }).forEach(function (n) {
        var d = par[n];
        L.push('   ' + col(n, 26) + col(d.n, 8) + col(d.tot + ' ms', 10)
               + col(Math.round(d.tot / d.n) + ' ms', 10) + col(d.pire + ' ms', 10) + d.bloq + ' ms');
      });
    }

    // 6. Ecran fige
    if (P.longues.length) {
      var cum = 0, pire = 0;
      P.longues.forEach(function (t) { cum += t.ms; if (t.ms > pire) pire = t.ms; });
      L.push('');
      L.push('── 6. Ecran fige ' + '─'.repeat(42));
      L.push('   ' + P.longues.length + ' tache(s) de plus de 50 ms · cumul ' + cum + ' ms · pire ' + pire + ' ms');
      L.push('   (pendant ce temps la page ne repond a aucun clic)');
    }

    // 7. Budget
    if (nav) {
      var apiTot = 0; (P.appels || []).forEach(function (c) { apiTot += c.ms; });
      // (01/08/2026) On somme le temps BLOQUANT et non le cumul : `initDashboard`
      // affichait 16 s de cumul pour 0 ms de blocage — elle attend le serveur.
      // Additionner les cumuls annoncait « affichage 16,7 s » au lieu de 0,3 s.
      var renduTot = 0; P.rendus.forEach(function (r) { renduTot += r.bloquant; });
      L.push('');
      L.push('── BUDGET ' + '─'.repeat(49));
      L.push('   statique (page + ressources) ' + col(sec(nav.domContentLoadedEventEnd), 10)
             + '   appels serveur ' + col(sec(apiTot), 10)
             + '   affichage ' + sec(renduTot) + ' (ecran fige)');
    }
    L.push('');
    return L.join('\n');
  };

  // ── chronoClics() : le detail des interactions ───────────────────────────
  P.rapportClics = function () {
    if (!P.clics.length) {
      return 'Aucune interaction de plus de 16 ms enregistree.\n'
           + '(Chrome/Edge uniquement. Sur Safari et Firefox cette mesure n\'existe pas.)';
    }
    var L = ['', '══ CLICS — ' + P.page + ' — ' + new Date().toLocaleTimeString('fr-FR') + ' ══', '',
             '   ' + col('#', 4) + col('cible', 30) + col('attente', 10) + col('traitement', 13)
             + col('ecran', 9) + 'total'];
    var tot = [], pire = null;
    P.clics.forEach(function (c, i) {
      tot.push(c.total);
      if (!pire || c.total > pire.total) pire = c;
      L.push('   ' + col(i + 1, 4) + col(c.cible, 30) + col(c.attente + ' ms', 10)
             + col(c.traitement + ' ms', 13) + col(c.ecran + ' ms', 9) + c.total + ' ms');
    });
    tot.sort(function (a, b) { return a - b; });
    var med = (tot.length % 2) ? tot[(tot.length - 1) / 2]
            : Math.round((tot[tot.length / 2 - 1] + tot[tot.length / 2]) / 2);
    L.push('   ' + '─'.repeat(66));
    L.push('   ' + P.clics.length + ' interaction(s) · mediane ' + med
           + ' ms · pire ' + pire.total + ' ms sur ' + pire.cible);
    L.push('   Repere : au-dela de 200 ms le clic est ressenti comme lent, au-dela de 500 ms comme bloque.');
    L.push('');
    return L.join('\n');
  };

  window.chrono = function () { var t = P.rapport(); console.log(t); return t; };
  window.chronoClics = function () { var t = P.rapportClics(); console.log(t); return t; };
})();

/* ── BRANCHEMENT DE L'INSTRUMENT ─────────────────────────────────────────
   Place a la fin du script : toutes les fonctions sont declarees. */
try {
  PERF.surveiller([
    'charger',
    'rendre',
    'rendreMar',
    'rendreAlt',
    'rendreGrille',
    'construireJours',
    'grouper',
    'doLogin'
  ]);
} catch (e) { console.warn('[chrono] branchement impossible :', e && e.message); }

</script>
