<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Pense-bête « Mes patients lib » — page AUTONOME (30/09/2026).
     Remplacement temporaire, en attendant un module libéral utilisable en
     consultation : date opératoire + secteur + initiales, et rien d'autre.
     ⚠️ Les saisies restent dans CE navigateur (stockage local du téléphone) :
     aucun appel réseau, aucune police ni script extérieur, rien vers le portail,
     le classeur ou le dépôt. Le banc (banc/banc_pense_bete.js) le vérifie.
     Installable à part (manifest.webmanifest de ce dossier). -->
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes patients lib</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0E7C7B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Patients lib">
<style>
:root{
  --bg:#F6F8F9; --card:#FFFFFF; --ink:#18242F; --mute:#66727E; --line:#DCE2E7;
  --acc:#0E7C7B; --acc-ink:#FFFFFF; --acc-soft:#E3F2F1; --past:#A3ADB7; --warn:#B4541A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10171D; --card:#18222A; --ink:#E6EDF2; --mute:#94A2AE; --line:#2A3742;
    --acc:#3FB8B5; --acc-ink:#062625; --acc-soft:#16302F; --past:#5B6873; --warn:#E59560;
  }
}
:root[data-theme="dark"]{
  --bg:#10171D; --card:#18222A; --ink:#E6EDF2; --mute:#94A2AE; --line:#2A3742;
  --acc:#3FB8B5; --acc-ink:#062625; --acc-soft:#16302F; --past:#5B6873; --warn:#E59560;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font:17px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;}
main{max-width:520px;margin:0 auto;padding:18px 16px 90px}
h1{font-size:22px;margin:4px 0 14px;font-weight:700}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
label{display:block;font-size:14px;color:var(--mute);margin:0 0 4px}
.row{display:grid;grid-template-columns:1fr;gap:10px}
.lbl{display:block;font-size:14px;color:var(--mute);margin:0 0 6px}
.f{margin-bottom:12px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;min-height:46px;-webkit-appearance:none;appearance:none}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#ini{text-transform:uppercase;letter-spacing:.06em;font-weight:700;font-size:20px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{font:inherit;font-size:16px;font-weight:700;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:10px;min-height:46px;cursor:pointer}
.chip[aria-checked="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.add{width:100%;font:inherit;font-weight:700;font-size:18px;background:var(--acc);color:var(--acc-ink);
  border:0;border-radius:10px;min-height:50px;cursor:pointer}
.msg{font-size:14px;color:var(--warn);margin:8px 0 0;min-height:1em}
.day{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.dnum{text-align:center;line-height:1}
.dnum b{display:block;font-size:30px}
.dnum span{font-size:13px;color:var(--mute)}
.today .dnum b{color:var(--acc)}
.pt{display:flex;align-items:center;gap:10px;min-height:38px}
.pt .i{font-weight:700;font-size:19px;letter-spacing:.04em;min-width:64px}
.pt .s{color:var(--mute);flex:1}
.x{font:inherit;background:none;border:0;color:var(--mute);font-size:22px;width:40px;height:40px;cursor:pointer;border-radius:8px}
.past .dnum b,.past .i{color:var(--past)}
section{margin-top:22px}
h2{font-size:16px;margin:0 0 2px;color:var(--mute);font-weight:700}
details summary{cursor:pointer;color:var(--mute);font-size:15px;padding:10px 0}
.empty{color:var(--mute);padding:18px 0}
.undo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:none;gap:14px;align-items:center;
  max-width:calc(100% - 32px);font-size:15px}
.undo button{font:inherit;font-weight:700;background:none;border:0;color:var(--acc-soft);cursor:pointer}
.foot{font-size:13px;color:var(--mute);margin-top:26px}
/* (05/10/2026) Onglets + compteur de la règle des 30 % (axe CCAM) */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:0 0 16px}
.tab{font:inherit;font-weight:700;font-size:16px;border:0;background:none;color:var(--mute);border-radius:9px;min-height:42px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--acc);color:var(--acc-ink)}
.chips.deux{grid-template-columns:1fr 1fr}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.kpi .big{font-size:40px;font-weight:700;line-height:1.1}
.kpi .sub{color:var(--mute);font-size:14px}
.kpi .duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;font-size:15px}
.kpi .duo b{display:block;font-size:18px}
.marge{margin-top:12px;font-weight:700;font-size:15px}
.marge.ok{color:var(--acc)} .marge.ko{color:var(--warn)}
.gestes{display:grid;grid-template-columns:1fr;gap:8px;margin-top:4px}
.geste{font:inherit;font-weight:700;font-size:18px;background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;min-height:52px;cursor:pointer}
.geste:disabled{opacity:.4;cursor:default}
.acte{display:flex;align-items:center;gap:10px;min-height:40px;border-bottom:1px solid var(--line)}
.acte .d{color:var(--mute);min-width:54px;font-size:15px}
.acte .g{flex:1}
.acte .v{font-variant-numeric:tabular-nums}
.reg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-top:22px}
.reg .grille{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.reg input{min-width:0;box-sizing:border-box} /* le contenu d'un <details> n'hérite pas toujours du border-box */
.reg h3{font-size:15px;margin:14px 0 8px}
.autre{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.autre .ligne{display:grid;grid-template-columns:1fr auto;gap:8px}
.autre .ligne .geste{padding:0 18px}
#cCode{text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.case{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:15px;color:var(--ink)}
.case input{width:22px;height:22px;min-height:0}
.lib{font-size:14px;color:var(--mute);margin-top:6px;min-height:1.2em}
@media (prefers-reduced-motion:no-preference){ .fresh{animation:f .6s ease-out} @keyframes f{from{background:var(--acc-soft)}to{background:transparent}} }
</style>
</head>
<body>
<main>
  <h1>Mes patients lib</h1>
  <div class="tabs" role="tablist">
    <button type="button" class="tab" role="tab" id="tP" aria-selected="true" aria-controls="vP">Patients</button>
    <button type="button" class="tab" role="tab" id="tC" aria-selected="false" aria-controls="vC">Compteur</button>
  </div>
  <div id="vP" role="tabpanel" aria-labelledby="tP">
  <form id="frm" autocomplete="off">
    <div class="row">
      <div class="f"><label for="dt">Date opératoire</label><input type="date" id="dt" required></div>
    </div>
    <div class="f"><span class="lbl" id="secLbl">Secteur</span>
      <div class="chips" id="chips" role="radiogroup" aria-labelledby="secLbl"></div></div>
    <div class="f" style="margin-top:12px"><label for="ini">Initiales</label><input id="ini" maxlength="8" required autocapitalize="characters"></div>
    <button class="add" type="submit">Ajouter</button>
    <p class="msg" id="msg" role="status"></p>
  </form>

  <section><h2>À venir</h2><div id="next"></div></section>
  <section id="pastBox" hidden><details><summary id="pastSum"></summary><div id="past"></div></details></section>
  </div>

  <!-- (05/10/2026) COMPTEUR — règle des 30 %, axe CCAM seulement.
       Part du dernier relevé (point de départ saisi à la main) et ajoute les
       actes comptés depuis. Aucune projection. Aucun montant dans ce fichier :
       valeurs et point de départ se saisissent dans « Réglages », sur l'appareil. -->
  <div id="vC" role="tabpanel" aria-labelledby="tC" hidden>
    <div class="kpi">
      <div class="big" id="cPct">—</div>
      <div class="sub" id="cSub">part libérale CCAM</div>
      <div class="duo"><div>Libéral<b id="cLib">—</b></div><div>Public<b id="cPub">—</b></div></div>
      <div class="marge" id="cMarge"></div>
    </div>
    <form id="cFrm" autocomplete="off">
      <div class="f"><label for="cDt">Date de l'acte</label><input type="date" id="cDt"></div>
      <div class="f"><div class="chips deux" id="cMode" role="radiogroup" aria-label="Activité">
        <button type="button" class="chip" role="radio" data-v="lib" aria-checked="true">Libéral</button>
        <button type="button" class="chip" role="radio" data-v="pub" aria-checked="false">Public</button></div></div>
      <div class="f"><div class="chips deux" id="cAss" role="radiogroup" aria-label="Assurance">
        <button type="button" class="chip" role="radio" data-v="mc" aria-checked="true">Monaco</button>
        <button type="button" class="chip" role="radio" data-v="fr" aria-checked="false">France</button></div></div>
      <div class="gestes" id="cGestes">
        <button type="button" class="geste" data-g="colo">Colo</button>
        <button type="button" class="geste" data-g="gastro">Gastro</button>
        <button type="button" class="geste" data-g="combo">Colo + gastro</button>
      </div>
      <!-- (05/10/2026) Autre acte : code CCAM tapé, tarif d'anesthésie lu dans la
           liste CCAM publique du site (docs/module-liberal/ccam_actes.json),
           + 6 % (modificateur 7, toujours), × 50 % si 2e acte, × coefficient Monaco.
           Seul échange réseau de la page : le TÉLÉCHARGEMENT de cette liste,
           sans rien y ajouter (ni code, ni date, ni montant). -->
      <div class="autre">
        <label for="cCode">Autre acte : code CCAM</label>
        <div class="ligne"><input id="cCode" maxlength="7" autocapitalize="characters" autocomplete="off" spellcheck="false">
          <button type="button" class="geste" id="cAutre">Ajouter</button></div>
        <label class="case"><input type="checkbox" id="c50"> 2e acte du même patient (50 %)</label>
        <div class="lib" id="cLibelle"></div>
      </div>
      <p class="msg" id="cMsg" role="status"></p>
    </form>
    <section><h2 id="cListT">Actes comptés</h2><div id="cList"></div></section>
    <details class="reg" id="cReg">
      <summary>Réglages</summary>
      <h3>Point de départ (dernier relevé)</h3>
      <div class="f"><label for="rD0">Relevé arrêté au</label><input type="date" id="rD0"></div>
      <div class="grille">
        <div class="f"><label for="rP0">Public CCAM (€)</label><input id="rP0" inputmode="decimal"></div>
        <div class="f"><label for="rL0">Libéral CCAM (€)</label><input id="rL0" inputmode="decimal"></div>
      </div>
      <h3>Valeur d'un acte (€, sans dépassement)</h3>
      <div class="grille" id="rVals"></div>
      <h3>Forfaits de réanimation (€, tarif de base)</h3>
      <div class="grille" id="rRea"></div>
      <button type="button" class="add" id="rSave" style="margin:6px 0 14px">Enregistrer</button>
      <p class="msg" id="rMsg" role="status"></p>
    </details>
  </div>

  <p class="foot">Tout est gardé sur cet appareil uniquement, rien n'est envoyé.</p>
</main>
<div class="undo" id="undo" role="status"><span id="undoTxt"></span><button type="button" id="undoBtn">Annuler</button></div>

<script>
const KEY='pense-bete-lib-v1';
let L=[], lastDel=null, undoT=null, freshId=null, storageOK=true;
const $=id=>document.getElementById(id);
const JOURS=['dim','lun','mar','mer','jeu','ven','sam'];
const MOIS=['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];

function load(){ try{ L=JSON.parse(localStorage.getItem(KEY)||'[]'); if(!Array.isArray(L)) L=[]; }catch(e){ L=[]; storageOK=false; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(L)); storageOK=true; }catch(e){ storageOK=false; } }
function isoToday(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const SECTEURS=['Endos','Viscéral','Ortho','ORL','Cardio','Mater'];
let SEC='';
function renderChips(){
  $('chips').innerHTML=SECTEURS.map(s=>'<button type="button" role="radio" class="chip" aria-checked="'+(s===SEC)+'" data-s="'+esc(s)+'">'+esc(s)+'</button>').join('');
}
function dayBlock(date, pts, cls){
  const d=new Date(date+'T12:00:00');
  return '<div class="day '+cls+'"><div class="dnum"><span>'+JOURS[d.getDay()]+'</span><b>'+d.getDate()+'</b><span>'+MOIS[d.getMonth()]+'</span></div><div>'
    + pts.map(p=>'<div class="pt'+(p.id===freshId?' fresh':'')+'"><span class="i">'+esc(p.i)+'</span><span class="s">'+esc(p.s)+'</span><button class="x" aria-label="Effacer '+esc(p.i)+'" data-id="'+p.id+'">×</button></div>').join('')
    + '</div></div>';
}
function group(list){
  const g={}; list.forEach(p=>{ (g[p.d]=g[p.d]||[]).push(p); });
  Object.values(g).forEach(a=>a.sort((x,y)=>x.s.localeCompare(y.s)||x.t-y.t));
  return g;
}
function render(){
  const today=isoToday();
  const nx=group(L.filter(p=>p.d>=today)), ps=group(L.filter(p=>p.d<today));
  const nk=Object.keys(nx).sort(), pk=Object.keys(ps).sort().reverse();
  $('next').innerHTML = nk.length ? nk.map(k=>dayBlock(k,nx[k],k===today?'today':'')).join('')
    : '<p class="empty">Aucun patient à venir. Ajoutez le premier ci-dessus.</p>';
  $('pastBox').hidden=!pk.length;
  const n=pk.reduce((s,k)=>s+ps[k].length,0);
  $('pastSum').textContent='Passés ('+n+')';
  $('past').innerHTML=pk.map(k=>dayBlock(k,ps[k],'past')).join('');
  renderChips();
  if(!storageOK) $('msg').textContent="Ce navigateur n'enregistre pas : la liste sera perdue en fermant la page.";
}

$('frm').addEventListener('submit',e=>{
  e.preventDefault();
  const d=$('dt').value, s=SEC, i=$('ini').value.trim().toUpperCase();
  if(!d||!s||!i){ $('msg').textContent=!s?'Touchez un secteur.':'Date et initiales sont nécessaires.'; return; }
  const p={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), d, s, i, t:Date.now()};
  L.push(p); save(); freshId=p.id;
  $('msg').textContent='';
  $('ini').value=''; $('ini').focus();          // date et secteur restent : patient suivant du même jour
  render();
});
$('chips').addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; SEC=b.dataset.s; renderChips(); $('ini').focus(); });
document.addEventListener('click',e=>{
  const b=e.target.closest('.x'); if(!b || b.classList.contains('cx')) return;
  const k=L.findIndex(p=>p.id===b.dataset.id); if(k<0) return;
  lastDel={k:'p',o:L.splice(k,1)[0]}; save(); freshId=null; render();
  $('undoTxt').textContent=lastDel.o.i+' effacé'; $('undo').style.display='flex';
  clearTimeout(undoT); undoT=setTimeout(()=>{ $('undo').style.display='none'; lastDel=null; },6000);
});
$('undoBtn').addEventListener('click',()=>{
  if(lastDel && lastDel.k==='p'){ L.push(lastDel.o); save(); render(); }
  if(lastDel && lastDel.k==='c'){ C.actes.push(lastDel.o); cSave(); cRender(); }
  lastDel=null; $('undo').style.display='none';
});
function montrerAnnuler(txt){
  $('undoTxt').textContent=txt; $('undo').style.display='flex';
  clearTimeout(undoT); undoT=setTimeout(()=>{ $('undo').style.display='none'; lastDel=null; },6000);
}

/* ══ ONGLETS ══════════════════════════════════════════════════════════════ */
const KEY_TAB='pense-bete-onglet';
function onglet(v){
  const c = v==='C';
  $('vP').hidden=c; $('vC').hidden=!c;
  $('tP').setAttribute('aria-selected', String(!c)); $('tC').setAttribute('aria-selected', String(c));
  try{ localStorage.setItem(KEY_TAB, v); }catch(e){}
}
$('tP').addEventListener('click',()=>onglet('P'));
$('tC').addEventListener('click',()=>onglet('C'));

/* ══ COMPTEUR — règle des 30 %, axe CCAM (05/10/2026) ══════════════════════
   Libéral L et public P = point de départ (dernier relevé) + actes comptés
   depuis. Part libérale = L / (L + P). Marge à public constant :
   3/7·P − L (nulle à 30 %), même formule que la page Suivi libéral.
   Excédent = L − 30 % (L + P) ; public à produire = 10/3 × excédent.
   Tout est en CENTIMES entiers : aucune erreur d'arrondi en additionnant.
   Aucun montant n'est écrit ici : les valeurs viennent des Réglages. */
const KEY_C='pense-bete-compteur-v1';
const GESTES={colo:'Colo', gastro:'Gastro', combo:'Colo + gastro'};
const ASS={mc:'Monaco', fr:'France'};
let C={d0:'', p0:null, l0:null, v:{}, rea:{}, actes:[]};
/* (05/10/2026) Forfaits de réanimation : activité 1, absents de la liste CCAM du
   site (qui ne garde que l'anesthésie). Tarif saisi dans les Réglages, SANS le
   modificateur 7 (réservé à l'anesthésie), × 50 % éventuel, × coefficient Monaco. */
const REA={YYYY015:'Forfait de réanimation niveau A', YYYY020:'Forfait de réanimation niveau B'};
let cMode='lib', cAss='mc';
function cLoad(){
  try{ const o=JSON.parse(localStorage.getItem(KEY_C)||'null');
    if(o && typeof o==='object'){ C=Object.assign(C,o); if(!Array.isArray(C.actes)) C.actes=[]; if(!C.v||typeof C.v!=='object') C.v={}; if(!C.rea||typeof C.rea!=='object') C.rea={}; } }
  catch(e){ /* stockage abîmé : on repart à vide */ }
}
function cSave(){ try{ localStorage.setItem(KEY_C, JSON.stringify(C)); storageOK=true; }catch(e){ storageOK=false; } }
// « 1 234,56 » → 123456 centimes ; null si illisible
function enCentimes(t){
  const s=String(t==null?'':t).replace(/[\s\u00a0\u202f€]/g,'').replace(',','.');
  if(!/^\d+(\.\d{1,2})?$/.test(s)) return null;
  const [e,d='']=s.split('.'); return parseInt(e,10)*100 + parseInt((d+'00').slice(0,2),10);
}
const euros=c=>(c/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const saisie=c=>c==null?'':(c/100).toFixed(2).replace('.',',');
function valeur(g,a){ const x=C.v[g+'_'+a]; return Number.isInteger(x)?x:null; }
// Valeur d'un acte de la liste : figée à l'ajout pour « autre », lue dans les Réglages sinon
function valeurActe(x){ return x.g==='autre' ? (Number.isInteger(x.v)?x.v:null) : valeur(x.g,x.a); }
function regleComplet(){ return !!C.d0 && Number.isInteger(C.p0) && Number.isInteger(C.l0) && Object.keys(GESTES).every(g=>Object.keys(ASS).every(a=>valeur(g,a)!=null)); }
function cTotaux(){
  let L0=C.l0||0, P0=C.p0||0, nl=0, np=0;
  C.actes.forEach(x=>{ const v=valeurActe(x)||0; if(x.m==='lib'){ L0+=v; nl++; } else { P0+=v; np++; } });
  return {L:L0, P:P0, nl, np};
}
function cRender(){
  const ok=regleComplet(), t=cTotaux(), T=t.L+t.P;
  document.querySelectorAll('.geste').forEach(b=>b.disabled=!ok);
  $('cCode').disabled=!ok;
  $('cMsg').textContent = ok ? '' : 'Remplissez d\'abord les Réglages (en bas) : point de départ et valeur des actes.';
  if(!ok) $('cReg').open=true;
  $('cPct').textContent = T>0 ? (t.L*100/T).toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1})+' %' : '—';
  $('cSub').textContent = 'part libérale CCAM' + (C.d0 ? ' · depuis le relevé du '+C.d0.split('-').reverse().join('/') : '');
  $('cLib').textContent = euros(t.L) + (t.nl ? ' · +'+t.nl+' acte'+(t.nl>1?'s':'') : '');
  $('cPub').textContent = euros(t.P) + (t.np ? ' · +'+t.np+' acte'+(t.np>1?'s':'') : '');
  const marge7 = 3*t.P - 7*t.L;                   // = 7 × marge, en centimes
  const m=$('cMarge');
  if(!ok){ m.textContent=''; m.className='marge'; }
  else if(marge7>=0){ m.className='marge ok'; m.textContent='Marge avant 30 % : '+euros(Math.floor(marge7/7)); }
  else { const exc=Math.ceil((7*t.L-3*t.P)/10);     // L − 0,3·T, arrondi au centime supérieur
    m.className='marge ko'; m.textContent='Au-delà de 30 % : '+euros(exc)+' · public à produire ≈ '+euros(Math.ceil(exc*10/3)); }
  const tri=[...C.actes].sort((a,b)=>b.d.localeCompare(a.d)||b.t-a.t);
  $('cListT').textContent='Actes comptés'+(C.actes.length?' ('+C.actes.length+')':'');
  $('cList').innerHTML = tri.length ? tri.map(x=>'<div class="acte"><span class="d">'+x.d.slice(8,10)+'/'+x.d.slice(5,7)+'</span>'
      +'<span class="g">'+(x.g==='autre' ? esc(x.code)+(x.r50?' (50 %)':'') : esc(GESTES[x.g]||x.g))+' · '+(x.m==='lib'?'Lib':'Pub')+' · '+esc(ASS[x.a]||x.a)+'</span>'
      +'<span class="v">'+(valeurActe(x)!=null?euros(valeurActe(x)):'—')+'</span>'
      +'<button type="button" class="x cx" aria-label="Retirer cet acte" data-id="'+x.id+'">×</button></div>').join('')
    : '<p class="empty">Aucun acte compté depuis le relevé.</p>';
  if(!storageOK) $('cMsg').textContent="Ce navigateur n'enregistre pas : le compteur sera perdu en fermant la page.";
}
function cReglagesAfficher(){
  $('rRea').innerHTML=Object.keys(REA).map(k=>'<div class="f"><label for="rr_'+k+'">'+(k==='YYYY015'?'Réa A':'Réa B')+' · '+k+'</label><input id="rr_'+k+'" inputmode="decimal" value="'+saisie(Number.isInteger(C.rea[k])?C.rea[k]:null)+'"></div>').join('');
  $('rD0').value=C.d0||''; $('rP0').value=saisie(C.p0); $('rL0').value=saisie(C.l0);
  $('rVals').innerHTML=Object.keys(GESTES).map(g=>Object.keys(ASS).map(a=>
    '<div class="f"><label for="rv_'+g+'_'+a+'">'+GESTES[g]+' · '+ASS[a]+'</label><input id="rv_'+g+'_'+a+'" inputmode="decimal" value="'+saisie(valeur(g,a))+'"></div>').join('')).join('');
}
function radios(id, set){
  $(id).addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return;
    $(id).querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-checked', String(x===b))); set(b.dataset.v); });
}
radios('cMode', v=>cMode=v);
radios('cAss', v=>cAss=v);
function dateActe(){
  const d=$('cDt').value;
  if(!d){ $('cMsg').textContent='Indiquez la date de l\'acte.'; return null; }
  if(d<=C.d0){ $('cMsg').textContent='Cet acte est antérieur ou égal au relevé du '+C.d0.split('-').reverse().join('/')+' : il y est déjà compté.'; return null; }
  return d;
}

/* ── Autre acte : liste CCAM publique, téléchargée une fois à la demande ── */
const CCAM_URL='/docs/module-liberal/ccam_actes.json?v=84';
let CCAM=null, ccamP=null;
function chargerCCAM(){
  if(CCAM) return Promise.resolve(CCAM);
  if(!ccamP) ccamP=fetch(CCAM_URL,{method:'GET',credentials:'omit',cache:'force-cache'})
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(d=>{ const m={}; (d.actes||[]).forEach(a=>{ if(a&&a.c&&typeof a.t==='number') m[a.c]=a; }); CCAM=m; return m; })
    .catch(e=>{ ccamP=null; throw e; });
  return ccamP;
}
const codeSaisi=()=>$('cCode').value.trim().toUpperCase().replace(/\s/g,'');
// tarif (€) → centimes : + 6 % (modificateur 7) × 50 % éventuel × coefficient Monaco, arrondi au centime
function montantAutre(t, r50, a){ return Math.round(Math.round(t*100) * 1.06 * (r50?0.5:1) * (a==='mc'?1.95:1)); }
// forfait de réa : tarif déjà en centimes, pas de modificateur 7
function montantRea(c, r50, a){ return Math.round(c * (r50?0.5:1) * (a==='mc'?1.95:1)); }
async function apercuAutre(){
  const code=codeSaisi(), el=$('cLibelle');
  if(code.length<7){ el.textContent=''; return null; }
  if(!/^[A-Z]{4}\d{3}$/.test(code)){ el.textContent='Un code CCAM, c\'est 4 lettres et 3 chiffres.'; return null; }
  const lieu=' ('+ASS[cAss]+(cMode==='lib'?', libéral':', public')+')';
  if(REA[code]){
    const c=C.rea[code];
    if(!Number.isInteger(c)){ el.textContent=REA[code]+' : renseignez son tarif dans les Réglages.'; return null; }
    const v=montantRea(c,$('c50').checked,cAss);
    el.textContent=REA[code]+' → '+euros(v)+lieu;
    return {c:code, v};
  }
  el.textContent='Recherche…';
  let m; try{ m=await chargerCCAM(); }catch(e){ el.textContent='Liste CCAM injoignable (réseau ?). Réessayez.'; return null; }
  if(codeSaisi()!==code) return null;            // le code a changé pendant le chargement
  const a=m[code];
  if(!a){ el.textContent=code+' : absent de la liste (pas de tarif d\'anesthésie).'; return null; }
  const v=montantAutre(a.t,$('c50').checked,cAss);
  el.textContent=a.l+' → '+euros(v)+lieu;
  return {c:a.c, v};
}
$('cCode').addEventListener('input',apercuAutre);
$('c50').addEventListener('change',apercuAutre);
$('cAss').addEventListener('click',()=>{ if(codeSaisi().length===7) apercuAutre(); });
$('cMode').addEventListener('click',()=>{ if(codeSaisi().length===7) apercuAutre(); });
$('cAutre').addEventListener('click',async()=>{
  if($('cAutre').disabled) return;
  const d=dateActe(); if(!d) return;
  const a=await apercuAutre();
  if(!a){ $('cMsg').textContent=$('cLibelle').textContent||'Tapez un code CCAM.'; return; }
  const r50=$('c50').checked;
  C.actes.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), d, g:'autre', code:a.c, r50, v:a.v, m:cMode, a:cAss, t:Date.now()});
  cSave(); cRender();
  $('cMsg').textContent='+1 '+a.c+(r50?' (50 %)':'')+' '+(cMode==='lib'?'libéral':'public')+' '+ASS[cAss]+' le '+d.split('-').reverse().join('/');
  $('cCode').value=''; $('c50').checked=false; $('cLibelle').textContent='';
});

$('cGestes').addEventListener('click',e=>{
  const b=e.target.closest('.geste'); if(!b || b.disabled) return;
  const d=dateActe(); if(!d) return;
  C.actes.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), d, g:b.dataset.g, m:cMode, a:cAss, t:Date.now()});
  cSave(); cRender();
  $('cMsg').textContent='+1 '+GESTES[b.dataset.g]+' '+(cMode==='lib'?'libéral':'public')+' '+ASS[cAss]+' le '+d.split('-').reverse().join('/');
});
$('cList').addEventListener('click',e=>{
  const b=e.target.closest('.cx'); if(!b) return;
  e.stopPropagation();
  const k=C.actes.findIndex(x=>x.id===b.dataset.id); if(k<0) return;
  lastDel={k:'c',o:C.actes.splice(k,1)[0]}; cSave(); cRender();
  montrerAnnuler((lastDel.o.g==='autre'?lastDel.o.code:GESTES[lastDel.o.g])+' retiré');
});
$('rSave').addEventListener('click',()=>{
  const d0=$('rD0').value, p0=enCentimes($('rP0').value), l0=enCentimes($('rL0').value||'0');
  if(!d0||p0==null||l0==null){ $('rMsg').textContent='Date du relevé et montants public / libéral nécessaires (ex. 1 234,56).'; return; }
  const v={};
  for(const g of Object.keys(GESTES)) for(const a of Object.keys(ASS)){
    const c=enCentimes($('rv_'+g+'_'+a).value);
    if(c==null||c===0){ $('rMsg').textContent='Valeur manquante ou illisible : '+GESTES[g]+' · '+ASS[a]+'.'; return; }
    v[g+'_'+a]=c;
  }
  const rea={};
  for(const k of Object.keys(REA)){
    const t=$('rr_'+k).value.trim(); if(!t) continue;      // facultatif
    const c=enCentimes(t);
    if(c==null||c===0){ $('rMsg').textContent='Tarif illisible : '+(k==='YYYY015'?'Réa A':'Réa B')+'.'; return; }
    rea[k]=c;
  }
  const avant=C.actes.length;
  C.d0=d0; C.p0=p0; C.l0=l0; C.v=v; C.rea=rea;
  C.actes=C.actes.filter(x=>x.d>d0);           // un nouveau relevé contient déjà les actes antérieurs
  cSave(); cRender(); cReglagesAfficher();
  const n=avant-C.actes.length;
  $('rMsg').textContent='Enregistré.'+(n?' '+n+' acte'+(n>1?'s':'')+' antérieur'+(n>1?'s':'')+' au relevé retiré'+(n>1?'s':'')+' (déjà dans le relevé).':'');
});

load(); $('dt').value=isoToday(); render();
cLoad(); $('cDt').value=isoToday(); cReglagesAfficher(); cRender();
try{ if(localStorage.getItem(KEY_TAB)==='C') onglet('C'); }catch(e){}
</script>
