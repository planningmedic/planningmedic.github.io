function buildMobileDayList() {
  if (!DATA) return;
  const month = DATA.months.find(m => m.id === currentMonthId);
  if (!month) return;
  allDaysFlat = month.days.map((day, idx) => ({...day, dayIdx: idx, month}));
  const today = todayStr();
  const todayIdx = allDaysFlat.findIndex(d => d.date === today);
  currentDayIdx = todayIdx >= 0 ? todayIdx : 0;
}

function mobilePrevDay() {
  if (currentDayIdx > 0) { currentDayIdx--; renderMobileDay(); return; }
  const sel = document.getElementById('monthSelect');
  if (sel.selectedIndex > 0) {
    sel.selectedIndex--;
    currentMonthId = sel.value;
    window._weekInitialized = false;
    buildWeekNav();
    buildMobileDayList();
    currentDayIdx = allDaysFlat.length - 1;
    renderMobileDay();
    if (!isMobile) render();
  }
}

function mobileNextDay() {
  if (currentDayIdx < allDaysFlat.length - 1) { currentDayIdx++; renderMobileDay(); return; }
  const sel = document.getElementById('monthSelect');
  if (sel.selectedIndex < sel.options.length - 1) {
    sel.selectedIndex++;
    currentMonthId = sel.value;
    window._weekInitialized = false;
    buildWeekNav();
    buildMobileDayList();
    currentDayIdx = 0;
    renderMobileDay();
    if (!isMobile) render();
  }
}

let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  if (!isMobile || mobilePlanningView !== 'planning') return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  // Garde verticale : un scroll diagonal ne change plus de jour par accident
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    const el=document.getElementById('mobileDayContent');
    if(el){ el.classList.remove('slide-l','slide-r'); void el.offsetWidth; el.classList.add(dx<0?'slide-l':'slide-r'); }
    if (dx < 0) mobileNextDay(); else mobilePrevDay();
  }
}, {passive:true});

function renderMobileDay() {

  const dayData = allDaysFlat[currentDayIdx];
  if (!dayData) return;
  const month = dayData.month;
  const today = todayStr();
  const dt = new Date(dayData.date);
  const isToday = dayData.date === today;

  document.getElementById('mobileDayName').textContent = DAYS_FR_FULL[dt.getDay()];
  const dateEl = document.getElementById('mobileDayDate');
  dateEl.textContent = dayData.day + ' ' + MONTHS_FR_FULL[dt.getMonth()];
  dateEl.className = 'mobile-day-date' + (isToday ? ' today' : '');
  const jfEl=document.getElementById('mobileDayJF');
  const prov = isWeekProvisoire(dayData.date);
  jfEl.innerHTML = (dayData.isFerie ? 'Jour férié' : '') + (prov ? (dayData.isFerie?' · ':'')+'🚧 provisoire' : '');
  const fab=document.getElementById('mobileTodayFab');
  if(fab) fab.style.display = isToday ? 'none' : 'flex';

  const dayIdx = dayData.dayIdx;
  const smap = {};
  SECTORS_DEF.forEach(s => { smap[s.code] = {am:[], pm:[]}; });
  const guards = [], h18arr = [], rg = [], absents = [];
  const cons = {};  // consultations par spécialité : cons[spec]={am:[],pm:[]}

  month.doctors.forEach(doc => {
    const entry = doc.days[dayIdx] || {};
    const st = entry.status || '';
    if (st==='G'||st==='G2') guards.push(doc.initials);
    if (st==='18') h18arr.push(doc.initials);
    if (st==='RG') rg.push(doc.initials);
    if (ABSENT_PANNEAU.includes(st)) absents.push(doc.initials);
    if (ABSENT_STATUSES.has(st)) return;
    // multi-secteur "VIS+REA" → le MAR apparaît dans chaque secteur
    [['am',entry.morning],['pm',entry.afternoon]].forEach(([half,val])=>{
      (val||'').split('+').forEach(raw=>{
        const part=raw.trim(); if(!part) return;
        if(part.startsWith('CS-')){ const sp=part.slice(3); (cons[sp]=cons[sp]||{am:[],pm:[]})[half].push({init:doc.initials,lib:!!(entry.lib && sp==='END' && half==='pm')}); }
        else if(smap[part]) smap[part][half].push(doc.initials);
      });
    });
    const _jsDowMat = dayData.date ? new Date(dayData.date+'T12:00:00').getDay() : -1;
    if((_jsDowMat===2||_jsDowMat===4) && String(entry.morning||'').split('+').map(x=>x.trim()).includes('MAT')){
      (cons['MAT']=cons['MAT']||{am:[],pm:[]}).am.push({init:doc.initials,lib:false});
    }
  });

  const specCol = sp => SECTOR_COLORS[sp] || (sp==='INTER'?SECTOR_COLORS.CI:sp==='POLY'?SECTOR_COLORS.VOLANT:{bg:'#F1F5F9',fg:'#64748B'});
  const _meDoc = MY_ID ? month.doctors.find(d=>d.id===MY_ID) : null;
  const MY_INIT = _meDoc ? _meDoc.initials : null;
  const chip = (init, cls='', col=null) => `<span class="mobile-chip ${cls}${init===MY_INIT?' me-chip':''}"${col?` style="background:${col.bg};color:${col.fg}"`:''}>${init}</span>`;
  const dash = () => '<span class="mobile-chip dash">—</span>';
  // Qui est de garde / 18h aujourd'hui → pour les repérer DANS leur secteur de journée
  const guardSet = new Set(guards), h18Set = new Set(h18arr);
  const schip = (init, col) => {
    const duty = guardSet.has(init) ? {c:'#CE1126',t:'G'} : (h18Set.has(init) ? {c:'#D97706',t:'18'} : null);
    const base = col ? `background:${col.bg};color:${col.fg}` : '';
    const ring = duty ? `;box-shadow:0 0 0 2px ${duty.c}` : '';
    const tag  = duty ? `<sup style="color:${duty.c};font-weight:800;font-size:9px;margin-left:1px">${duty.t}</sup>` : '';
    return `<span class="mobile-chip${init===MY_INIT?' me-chip':''}" style="${base}${ring}">${init}${tag}</span>`;
  };
  let html = '';

  if (isToday) {
    const nm=id=>(id==='PRUNET'?'Pr ':'Dr ')+id.charAt(0)+id.slice(1).toLowerCase();
    const tomIds=_gardeOn(_plusDays(today,1));
    const meTonight = MY_INIT && guards.includes(MY_INIT);
    html += `<div class="m-tonight">
      <div class="m-tonight-main"><span>🌙</span><div><div class="m-tonight-label">Cette nuit</div><div class="m-tonight-name">${guards.length?guards.join(' + '):'—'}${meTonight?' · c\u2019est vous':''}</div></div></div>
      ${tomIds.length?`<div class="m-tonight-sub">Demain : ${tomIds.map(nm).join(' + ')}</div>`:''}
    </div>`;
  }

  const isWE = dayData.isWeekend || dayData.isFerie;
  if (!isWE) {
    const activeSectors = SECTORS_DEF.filter(s => s.code!=='CS' && (smap[s.code].am.length || smap[s.code].pm.length));
    activeSectors.forEach(s => {
      const am = smap[s.code].am;
      const pm = smap[s.code].pm;
      const col = SECTOR_COLORS[s.code] || null;
      html += `<div class="mobile-sector-card"${col?` style="border-left:3px solid ${col.fg}"`:''}>
        <div class="mobile-sector-header"><span class="mobile-sector-name">${s.label}</span></div>
        <div class="mobile-sector-body">
          <div class="mobile-slot">
            <div class="mobile-slot-label">Matin</div>
            <div class="mobile-slot-names">${am.length ? am.map(i=>schip(i,col)).join('') : dash()}</div>
          </div>
          <div class="mobile-slot">
            <div class="mobile-slot-label">Après-midi</div>
            <div class="mobile-slot-names">${pm.length ? pm.map(i=>schip(i,col)).join('') : dash()}</div>
          </div>
        </div>
      </div>`;
    });
    // Consultations — une carte PAR spécialité, classées (fini le vrac)
    const CS_LABELS={VIS:'Viscéral',ORL:'ORL',ORT:'Ortho',END:'Endoscopies',MAT:'Maternité',INTER:'Interventionnel',POLY:'Polyvalent'};
    const CS_ORDER=['VIS','ORL','ORT','END','MAT','INTER','POLY'];
    const consSpecs=Object.keys(cons).sort((a,b)=>{const ia=CS_ORDER.indexOf(a),ib=CS_ORDER.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b);});
    const cchip=(o,col)=>{ if(o&&o.lib){ const base=col?`background:${col.bg};color:${col.fg}`:''; return `<span class="mobile-chip lib-chip" style="${base}"><span class="lib-tag">LIB</span>${o.init}</span>`; } return schip(o.init,col); };
    consSpecs.forEach(sp=>{
      const am=cons[sp].am, pm=cons[sp].pm;
      const lbl=CS_LABELS[sp]||(sp||'Consultation');
      const col=specCol(sp);
      html += `<div class="mobile-sector-card" style="border-left:3px solid ${col.fg}">
        <div class="mobile-sector-header"><span class="mobile-sector-name">Consultation · ${lbl}</span></div>
        <div class="mobile-sector-body">
          <div class="mobile-slot">
            <div class="mobile-slot-label">Matin</div>
            <div class="mobile-slot-names">${am.length ? am.map(i=>cchip(i,col)).join('') : dash()}</div>
          </div>
          <div class="mobile-slot">
            <div class="mobile-slot-label">Après-midi</div>
            <div class="mobile-slot-names">${pm.length ? pm.map(i=>cchip(i,col)).join('') : dash()}</div>
          </div>
        </div>
      </div>`;
    });
  }

  html += `<div class="mobile-gardes-section"><div class="mobile-gardes-title">Gardes &amp; fonctions</div>`;
  if (guards.length) html += `<div class="mobile-garde-row"><div class="mobile-garde-label">Garde 24h</div><div class="mobile-garde-names">${guards.map(i=>chip(i,'guard')).join('')}</div></div>`;
  if (h18arr.length) html += `<div class="mobile-garde-row"><div class="mobile-garde-label">8h – 18h</div><div class="mobile-garde-names">${h18arr.map(i=>chip(i,'h18')).join('')}</div></div>`;
  if (rg.length) html += `<div class="mobile-garde-row"><div class="mobile-garde-label">Sortie de garde</div><div class="mobile-garde-names">${rg.map(i=>`<span class="mobile-garde-name rg">${i}</span>`).join('')}</div></div>`;
  if (absents.length) html += `<div class="mobile-garde-row"><div class="mobile-garde-label">Absents</div><div class="mobile-garde-names">${absents.map(i=>`<span class="mobile-garde-name absent">${i}</span>`).join('')}</div></div>`;
  if (!guards.length && !h18arr.length && !rg.length && !absents.length) html += `<div class="mobile-garde-row"><div style="color:var(--ink-4);font-size:12px;padding:4px 0">—</div></div>`;
  html += `</div>`;

  document.getElementById('mobileDayContent').innerHTML = html;
}

/* ═══ (05/08/2026) RAFRAÎCHIR EN TIRANT LA PAGE VERS LE BAS ═══
   Constat du terrain : ajouté à l'écran d'accueil, le portail s'ouvre en mode
   application (apple-mobile-web-app-capable) — et dans ce mode, iOS ne fournit
   AUCUN rafraîchissement par glissement. Le geste faisait bouger l'écran sans
   rien recharger. On le fournit donc nous-mêmes, à l'identique de ce que fait
   Safari : même seuil, même indicateur circulaire, même sensation.
   Conditions : page tout en haut, glissement vers le bas d'au moins 70 px,
   un seul doigt. Sinon, on ne touche à rien — le défilement reste normal. */
(function () {
  var SEUIL = 70, depart = null, actif = false, enCours = false;

  var ind = document.createElement('div');
  ind.id = 'ptrInd';
  ind.style.cssText = 'position:fixed;top:0;left:50%;margin-left:-17px;width:34px;height:34px;' +
    'border-radius:50%;background:#fff;box-shadow:0 3px 12px rgba(15,23,42,.18);z-index:99998;' +
    'display:flex;align-items:center;justify-content:center;font-size:16px;color:#DC2626;' +
    'transform:translateY(-46px);transition:transform .18s ease-out;pointer-events:none';
  ind.textContent = '↻';
  document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(ind); });

  function place(y, tourne) {
    ind.style.transform = 'translateY(' + Math.min(y, 74) + 'px)' + (tourne ? ' rotate(' + (y * 4) + 'deg)' : '');
  }
  function range() { ind.style.transform = 'translateY(-46px)'; }

  document.addEventListener('touchstart', function (e) {
    if (enCours || e.touches.length !== 1) { depart = null; return; }
    depart = (window.scrollY || document.documentElement.scrollTop) <= 0 ? e.touches[0].clientY : null;
    actif = false;
  }, { passive: true });

  document.addEventListener('touchmove', function (e) {
    if (depart === null || enCours) return;
    var d = e.touches[0].clientY - depart;
    if (d <= 0) { depart = null; range(); return; }
    if ((window.scrollY || document.documentElement.scrollTop) > 0) { depart = null; range(); return; }
    actif = true;
    place(d * 0.55 - 40, true);
  }, { passive: true });

  document.addEventListener('touchend', function (e) {
    if (depart === null || !actif || enCours) { depart = null; range(); return; }
    var d = (e.changedTouches[0].clientY - depart);
    depart = null; actif = false;
    if (d < SEUIL) { range(); return; }
    enCours = true;
    place(16, false);
    ind.style.animation = 'ptrTourne .7s linear infinite';
    Promise.resolve()
      .then(function () { return window.__rafraichirDonnees ? window.__rafraichirDonnees() : null; })
      .catch(function () {})
      .then(function () {
        setTimeout(function () {
          ind.style.animation = ''; range(); enCours = false;
        }, 320);
      });
  }, { passive: true });

  var st = document.createElement('style');
  st.textContent = '@keyframes ptrTourne{to{transform:translateY(16px) rotate(360deg)}}';
  document.head.appendChild(st);
})();

/* ═══════════════════════════════════════════════════════════════════════════
   CHRONO — INSTRUMENT DE MESURE (01/08/2026)
   ═══════════════════════════════════════════════════════════════════════════
   LECTURE SEULE. N'ecrit rien, n'appelle rien, ne modifie aucun affichage.
   Se contente d'observer et de tenir un journal, consultable dans la console.

   POURQUOI. Jusqu'ici seul admin.html savait mesurer ses APPELS (chronoAPI).
   Rien ne mesurait : le temps du navigateur (analyse du JS, rendu), les
   ressources tierces (polices, icones), ni le COUT D'UN CLIC. Or sur admin
   chaque placement rappelle renderWeek() en entier : c'est la partie du temps
   que personne n'a jamais chiffree.

   A TAPER DANS LA CONSOLE :
     chrono()        le budget complet de la page (ouverture + appels + rendus)
     chronoClics()   le detail des interactions : clic -> ecran mis a jour
     chronoAPI()     (admin) le detail des appels serveur, inchange

   TROIS MESURES, TROIS SENS DIFFERENTS :
   - « attente »    : le temps entre le clic et le debut du traitement. Si elle
                      est grande, le navigateur etait deja occupe ailleurs.
   - « traitement » : le temps passe DANS notre code. C'est le seul que l'on
                      peut reduire nous-memes.
   - « ecran »      : le temps de peinture apres le traitement.

   Cout de l'instrument lui-meme : deux observateurs natifs du navigateur et
   un push dans un tableau par evenement. Non mesurable a l'echelle de la page.
   ═════════════════════════════════════════════════════════════════════════ */
(function () {
  if (window.PERF) return;

  var P = {
    page: (location.pathname.split('/').pop() || 'index.html'),
    jalons: [],      // etapes nommees du chargement
    rendus: [],      // durees des fonctions d'affichage surveillees
    clics: [],       // interactions utilisateur
    longues: [],     // taches > 50 ms : l'ecran est fige pendant ce temps
    appels: []       // journal des appels serveur (admin : partage avec chronoAPI)
  };
  window.PERF = P;

  // ── Jalons ───────────────────────────────────────────────────────────────
  P.jalon = function (nom) {
    try { P.jalons.push({ nom: nom, t: Math.round(performance.now()) }); } catch (e) {}
  };

  // ── Journal d'appel serveur (pages sans chronoAPI) ───────────────────────
  P.appel = function (action, ms, srv, depart, issue, glob) {
    try {
      P.appels.push({ action: action, ms: ms, srv: (typeof srv === 'number' ? srv : null),
                      glob: (typeof glob === 'number' ? glob : null),
                      depart: depart, essais: 1, issue: issue || 'ok' });
    } catch (e) {}
  };

  // Enregistre une duree. Plafond : une session de plusieurs heures ne doit pas
  // faire enfler le journal (l'instrument ne doit jamais devenir le probleme).
  P.note = function (nom, ms, t, bloquant) {
    if (P.rendus.length >= 5000) P.rendus.shift();
    P.rendus.push({ nom: nom, ms: ms, t: t, bloquant: (bloquant == null ? ms : bloquant) });
  };

  // ── Surveillance des fonctions d'affichage ───────────────────────────────
  // Enveloppe une fonction globale pour en chronometrer chaque execution.
  // A appeler APRES la declaration des fonctions concernees (fin de script).
  P.surveiller = function (noms) {
    (noms || []).forEach(function (n) {
      var f = window[n];
      if (typeof f !== 'function' || f._chrono) return;
      var g = function () {
        var d = performance.now(), r;
        try { r = f.apply(this, arguments); }
        finally { try {
          var sync = performance.now() - d;
          // Fonction asynchrone : le temps qui compte est celui de la promesse,
          // pas celui du retour. On note les deux — « bloquant » est le seul
          // temps pendant lequel l'ecran est fige.
          if (r && typeof r.then === 'function') {
            r.then(_fin, _fin);
            function _fin() { P.note(n, Math.round(performance.now() - d), Math.round(d), Math.round(sync)); }
          } else {
            P.note(n, Math.round(sync), Math.round(d), Math.round(sync));
          }
        } catch (e) { /* l'instrument ne doit JAMAIS casser la fonction mesuree */ } }
        return r;
      };
      g._chrono = true;
      try { window[n] = g; } catch (e) {}
    });
  };

  // ── Observateur : taches longues (ecran fige) ────────────────────────────
  try {
    new PerformanceObserver(function (l) {
      l.getEntries().forEach(function (e) {
        P.longues.push({ t: Math.round(e.startTime), ms: Math.round(e.duration) });
      });
    }).observe({ type: 'longtask', buffered: true });
  } catch (e) {}

  // ── Observateur : interactions (clic -> ecran) ───────────────────────────
  function _cible(el) {
    if (!el || !el.tagName) return '?';
    var s = el.tagName.toLowerCase();
    if (el.id) return s + '#' + el.id;
    var c = (el.className && el.className.baseVal !== undefined) ? el.className.baseVal : el.className;
    if (typeof c === 'string' && c.trim()) return s + '.' + c.trim().split(/\s+/).slice(0, 2).join('.');
    var t = (el.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 18);
    return t ? s + ' « ' + t + ' »' : s;
  }
  try {
    new PerformanceObserver(function (l) {
      l.getEntries().forEach(function (e) {
        if (e.name !== 'click' && e.name !== 'keydown' && e.name !== 'pointerdown') return;
        P.clics.push({
          nom: e.name,
          cible: _cible(e.target),
          t: Math.round(e.startTime),
          attente: Math.round(e.processingStart - e.startTime),
          traitement: Math.round(e.processingEnd - e.processingStart),
          ecran: Math.round(e.startTime + e.duration - e.processingEnd),
          total: Math.round(e.duration)
        });
      });
    }).observe({ type: 'event', durationThreshold: 16, buffered: true });
  } catch (e) {}

  // ── Mise en forme ────────────────────────────────────────────────────────
  function col(t, n) { var s = String(t); while (s.length < n) s += ' '; return s.slice(0, n); }
  function ms(v, n) { return String(Math.round(v)).padStart(n || 6, ' '); }
  function sec(v) { return (v / 1000).toFixed(1) + ' s'; }

  // ── chrono() : le budget complet ─────────────────────────────────────────
  P.rapport = function () {
    var L = ['', '══ CHRONO — ' + P.page + ' — ' + new Date().toLocaleTimeString('fr-FR') + ' ══'];
    var nav = null;
    try { nav = performance.getEntriesByType('navigation')[0] || null; } catch (e) {}

    // 1. Arrivee de la page elle-meme
    if (nav) {
      L.push('');
      L.push('── 1. La page (fichier HTML) ' + '─'.repeat(30));
      L.push('   DNS + connexion   ' + ms(nav.connectEnd - nav.domainLookupStart) + ' ms');
      L.push('   Reponse serveur   ' + ms(nav.responseStart - nav.requestStart) + ' ms   (premier octet)');
      L.push('   Telechargement    ' + ms(nav.responseEnd - nav.responseStart) + ' ms   '
             + (nav.transferSize ? '(' + Math.round(nav.transferSize / 1024) + ' Ko transferes)' : ''));
      L.push('   Analyse + script  ' + ms(nav.domContentLoadedEventEnd - nav.responseEnd) + ' ms   '
             + '(lecture du HTML, du CSS et execution du JS)');
      L.push('   → page prete      ' + ms(nav.domContentLoadedEventEnd) + ' ms');
    }

    // 2. Ressources tierces
    var res = [];
    try {
      res = performance.getEntriesByType('resource')
        .filter(function (r) { return r.duration >= 5 && !/googleusercontent|script\.google/.test(r.name); })
        .sort(function (a, b) { return b.duration - a.duration; }).slice(0, 8);
    } catch (e) {}
    if (res.length) {
      L.push('');
      L.push('── 2. Ressources chargees ' + '─'.repeat(33));
      res.forEach(function (r) {
        var court = r.name.replace(/^https?:\/\//, '').replace(/\?.*$/, '');
        if (court.length > 46) court = court.slice(0, 20) + '…' + court.slice(-25);
        L.push('   ' + col(court, 48) + ms(r.duration) + ' ms  '
               + (r.transferSize ? Math.round(r.transferSize / 1024) + ' Ko' : 'poids n.c.'));
      });
    }

    // 3. Appels serveur
    var J = P.appels;
    if (J && J.length) {
      var tot = 0, srv = 0, glo = 0, ech = 0;
      J.forEach(function (c) {
        tot += c.ms; srv += (c.srv || 0); glo += (c.glob || 0);
        if (String(c.issue).indexOf('ECHEC') === 0) ech++;
      });
      L.push('');
      L.push('── 3. Appels serveur ' + '─'.repeat(38));
      J.forEach(function (c, i) {
        var dep = (c.depart != null) ? ('T+' + (c.depart / 1000).toFixed(1) + 's ') : '';
        L.push('   ' + String(i + 1).padStart(2) + '. ' + col(dep, 9) + col(c.action, 24)
               + ms(c.ms) + ' ms'
               + (c.srv != null
                    ? '   (avant doGet ' + (c.glob != null ? ms(c.glob, 5) : '    ?')
                      + ' · doGet ' + ms(c.srv, 5)
                      + ' · reseau ' + ms(Math.max(0, c.ms - c.srv - (c.glob || 0)), 5) + ')'
                    : '')
               + (c.essais > 1 ? '  ' + c.essais + ' ESSAIS' : '')
               + (String(c.issue).indexOf('ECHEC') === 0 ? '   ' + c.issue : ''));
      });
      L.push('   ' + col('', 9) + col('TOTAL ' + J.length + ' appels', 24) + ms(tot) + ' ms'
             + '   (avant doGet ' + ms(glo, 5) + ' · doGet ' + ms(srv, 5)
             + ' · reseau ' + ms(Math.max(0, tot - srv - glo), 5) + ')'
             + (ech ? '   ' + ech + ' EN ECHEC' : ''));
      L.push('   « avant doGet » = notre code global (TEST_YEAR, ouverture du classeur).');
      L.push('   « reseau » contient encore la COMPILATION des 545 Ko de .gs : la separer');
      L.push('   demande le menu Executions d\'Apps Script (duree totale a comparer).');
    }

    // 3bis. Detail serveur (fourni par getAdminBootstrap)
    var avecDetail = (J || []).filter(function (c) { return c.detail && typeof c.detail === 'object'; });
    avecDetail.forEach(function (c) {
      var etapes = Object.keys(c.detail);
      if (!etapes.length) return;
      L.push('');
      L.push('── 3bis. Detail de ' + c.action + ' (' + (c.srv != null ? c.srv + ' ms' : '?') + ') '
             + '─'.repeat(Math.max(0, 26 - c.action.length)));
      etapes.sort(function (a, b) { return c.detail[b] - c.detail[a]; }).forEach(function (e) {
        L.push('   ' + col(e, 38) + ms(c.detail[e]) + ' ms');
      });
      if (c.ser != null) L.push('   ' + col('serialisation de la reponse', 38) + ms(c.ser) + ' ms');
      if (c.taille) L.push('   ' + col('taille de la reponse', 38)
                           + ms(Math.round(c.taille / 1024)) + ' Ko');
    });

    // 4. Jalons
    if (P.jalons.length) {
      L.push('');
      L.push('── 4. Etapes ' + '─'.repeat(46));
      P.jalons.forEach(function (j) { L.push('   ' + col(j.nom, 34) + ms(j.t) + ' ms'); });
    }

    // 5. Rendus
    if (P.rendus.length) {
      var par = {};
      P.rendus.forEach(function (r) {
        if (!par[r.nom]) par[r.nom] = { n: 0, tot: 0, pire: 0, bloq: 0 };
        par[r.nom].n++; par[r.nom].tot += r.ms; par[r.nom].bloq += r.bloquant;
        if (r.ms > par[r.nom].pire) par[r.nom].pire = r.ms;
      });
      L.push('');
      L.push('── 5. Affichage (temps passe dans notre code) ' + '─'.repeat(13));
      L.push('   ' + col('fonction', 26) + col('appels', 8) + col('cumul', 10)
             + col('moyenne', 10) + col('pire', 10) + 'dont ecran fige');
      Object.keys(par).sort(function (a, b) { return par[b].tot - par[a].tot; }).forEach(function (n) {
        var d = par[n];
        L.push('   ' + col(n, 26) + col(d.n, 8) + col(d.tot + ' ms', 10)
               + col(Math.round(d.tot / d.n) + ' ms', 10) + col(d.pire + ' ms', 10) + d.bloq + ' ms');
      });
    }

    // 6. Ecran fige
    if (P.longues.length) {
      var cum = 0, pire = 0;
      P.longues.forEach(function (t) { cum += t.ms; if (t.ms > pire) pire = t.ms; });
      L.push('');
      L.push('── 6. Ecran fige ' + '─'.repeat(42));
      L.push('   ' + P.longues.length + ' tache(s) de plus de 50 ms · cumul ' + cum + ' ms · pire ' + pire + ' ms');
      L.push('   (pendant ce temps la page ne repond a aucun clic)');
    }

    // 7. Budget
    if (nav) {
      var apiTot = 0; (P.appels || []).forEach(function (c) { apiTot += c.ms; });
      // (01/08/2026) On somme le temps BLOQUANT et non le cumul : `initDashboard`
      // affichait 16 s de cumul pour 0 ms de blocage — elle attend le serveur.
      // Additionner les cumuls annoncait « affichage 16,7 s » au lieu de 0,3 s.
      var renduTot = 0; P.rendus.forEach(function (r) { renduTot += r.bloquant; });
      L.push('');
      L.push('── BUDGET ' + '─'.repeat(49));
      L.push('   statique (page + ressources) ' + col(sec(nav.domContentLoadedEventEnd), 10)
             + '   appels serveur ' + col(sec(apiTot), 10)
             + '   affichage ' + sec(renduTot) + ' (ecran fige)');
    }
    L.push('');
    return L.join('\n');
  };

  // ── chronoClics() : le detail des interactions ───────────────────────────
  P.rapportClics = function () {
    if (!P.clics.length) {
      return 'Aucune interaction de plus de 16 ms enregistree.\n'
           + '(Chrome/Edge uniquement. Sur Safari et Firefox cette mesure n\'existe pas.)';
    }
    var L = ['', '══ CLICS — ' + P.page + ' — ' + new Date().toLocaleTimeString('fr-FR') + ' ══', '',
             '   ' + col('#', 4) + col('cible', 30) + col('attente', 10) + col('traitement', 13)
             + col('ecran', 9) + 'total'];
    var tot = [], pire = null;
    P.clics.forEach(function (c, i) {
      tot.push(c.total);
      if (!pire || c.total > pire.total) pire = c;
      L.push('   ' + col(i + 1, 4) + col(c.cible, 30) + col(c.attente + ' ms', 10)
             + col(c.traitement + ' ms', 13) + col(c.ecran + ' ms', 9) + c.total + ' ms');
    });
    tot.sort(function (a, b) { return a - b; });
    var med = (tot.length % 2) ? tot[(tot.length - 1) / 2]
            : Math.round((tot[tot.length / 2 - 1] + tot[tot.length / 2]) / 2);
    L.push('   ' + '─'.repeat(66));
    L.push('   ' + P.clics.length + ' interaction(s) · mediane ' + med
           + ' ms · pire ' + pire.total + ' ms sur ' + pire.cible);
    L.push('   Repere : au-dela de 200 ms le clic est ressenti comme lent, au-dela de 500 ms comme bloque.');
    L.push('');
    return L.join('\n');
  };

  window.chrono = function () { var t = P.rapport(); console.log(t); return t; };
  window.chronoClics = function () { var t = P.rapportClics(); console.log(t); return t; };
})();

/* ── BRANCHEMENT DE L'INSTRUMENT ─────────────────────────────────────────
   Place a la toute fin du script : `render` a deja ete remplace par le hook
   mobile ci-dessus, on enveloppe donc bien la version reellement appelee. */

</script>
