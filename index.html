/* polices chargées via <link> (perf : @import bloquant supprimé) */

:root {
  --red: #CE1126;
  --red-soft: #F8E8EB;
  --amber: #D97706;
  --amber-soft: #FEF3C7;
  --ink: #0F172A;
  --ink-2: #334155;
  --ink-3: #64748B;
  --ink-4: #94A3B8;
  --line: #E2E8F0;
  --line-light: #F1F5F9;
  --bg: #F8FAFC;
  --white: #FFFFFF;
  --radius: 12px;
  --mono: 'DM Mono', monospace;
}

/* Rôles sémantiques complémentaires (clair) */
:root {
  --surface-2:#EEF1F5; --deep:#1E293B;
  --ok:#166534; --ok-soft:#F0FDF4; --info:#1D4ED8; --info-soft:#EFF6FF;
  --viol:#6D28D9; --viol-soft:#F5F3FF; --rose:#BE123C;
  --me:#1D6FB8; --me-soft:#E8F4FD; --me-border:#B9DCF5;
  --warn-bg:#FFF7E6; --warn-bd:#FBD38D; --warn-fg:#92400E;
  --today-soft:#FFF5F5; --rose-soft:#FFF1F2;
  --info-bd:#BFDBFE; --rose-bd:#FECDD3; --ok-bd:#BBF7D0; --viol-bd:#DDD6FE;
  --me-ring:#DCEEFB;
  /* Recuperation de samedi (R) : teinte propre, pour ne plus se confondre
     avec la journee 8h-18h, qui reste verte comme sur la vue Planning. */
  --recup:#0E7490; --recup-soft:#ECFEFF; --recup-bd:#A5F3FC;
}

/* ── MODE SOMBRE ── (activé par html[data-theme="dark"]) */
html[data-theme="dark"] {
  --bg:#0B1220; --white:#151D2E; --line:#28344B; --line-light:#1B2436;
  --ink:#E7ECF6; --ink-2:#C4CEDF; --ink-3:#8D9AB1; --ink-4:#697891;
  --red:#F4586B; --red-soft:#3A1620; --amber:#F0A64A; --amber-soft:#38290F;
  --surface-2:#1B2436; --deep:#232F45;
  --ok:#5BD08B; --ok-soft:#122A1D; --info:#7BAAF7; --info-soft:#152341;
  --viol:#B593F2; --viol-soft:#251B3C; --rose:#F27D96;
  --me:#93C3E8; --me-soft:#17293A; --me-border:#2B4763;
  --warn-bg:#33260F; --warn-bd:#79591F; --warn-fg:#F2C879;
  --today-soft:#261620; --rose-soft:#2B1822;
  --info-bd:#2E4A73; --rose-bd:#5A2A38; --ok-bd:#1F4634; --viol-bd:#3A2F5C;
  --me-ring:#1C3550;
  --recup:#5FC5DA; --recup-soft:#0F2A31; --recup-bd:#1C4551;
}
html[data-theme="dark"] body{background:var(--bg)}
html[data-theme="dark"] .med-card:hover,html[data-theme="dark"] .eqv-card:hover{box-shadow:0 6px 16px rgba(0,0,0,.5)}
html{color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}


* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
.header {
  background: var(--white);
  border-bottom: 1px solid var(--line);
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 60px;
  position: sticky;
  top: 0;
  z-index: 300;
}
.header-brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.header-brand > div:last-child { min-width: 0; overflow: hidden; }
.header-flag {
  display: flex; flex-direction: column; width: 28px; height: 28px; border-radius: 6px;
  overflow: hidden; flex-shrink: 0; box-shadow: 0 1px 3px rgba(0,0,0,.15);
}
.header-title { font-size: 16px; font-weight: 700; color: var(--ink); letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header-sub { font-size: 11px; color: var(--ink-4); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header-right { display: flex; align-items: center; gap: 8px; }
.mobile-period { display: none; }

/* ── SÉLECTEURS ── */
.year-select {
  border: 1.5px solid var(--red); border-radius: 8px; padding: 6px 10px;
  font-size: 13px; font-weight: 700; font-family: 'DM Sans', sans-serif;
  color: var(--red); background: var(--white); outline: none; cursor: pointer;
  transition: border-color .15s, background .15s;
  min-width: 82px;
}
.year-select:focus { background: var(--red-soft); }
.month-select {
  border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 10px;
  font-size: 13px; font-weight: 600; font-family: 'DM Sans', sans-serif;
  color: var(--ink); background: var(--white); outline: none; cursor: pointer; transition: border-color .15s;
}
.month-select:focus { border-color: var(--red); }

/* ── VIEW TOGGLE ── */
.view-toggle-main {
  background: var(--white);
  border-bottom: 1px solid var(--line);
  padding: 8px 32px;
  display: flex;
  gap: 4px;
}
.view-main-btn {
  border: 1.5px solid var(--line);
  background: var(--white);
  border-radius: 8px;
  padding: 6px 16px;
  font-size: 13px;
  font-weight: 600;
  font-family: 'DM Sans', sans-serif;
  color: var(--ink-3);
  cursor: pointer;
  transition: all .15s;
}
.view-main-btn:hover { border-color: var(--red); color: var(--red); }
.view-main-btn.active { background: var(--red); border-color: var(--red); color: var(--white); }

/* ── WEEK NAV ── */
.week-nav {
  background: var(--white);
  border-bottom: 1px solid var(--line);
  padding: 10px 32px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.nav-label { font-size: 11px; font-weight: 600; color: var(--ink-4); text-transform: uppercase; letter-spacing: .06em; }
.week-pills { display: flex; gap: 4px; flex-wrap: wrap; }
.week-bar{display:flex;align-items:center;gap:2px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:2px}
.week-nav-arrow{width:30px;height:30px;border:none;background:transparent;border-radius:8px;cursor:pointer;font-size:17px;color:var(--ink-2);line-height:1}
.week-nav-arrow:hover{background:var(--line-light);color:var(--red)}
.week-bar-label{min-width:150px;text-align:center;font-size:13px;color:var(--ink);padding:0 6px;white-space:nowrap}
.week-bar-label b{font-weight:800}
.prov-dot{font-size:12px}
/* ── Vernis premium ── */
body{font-variant-numeric:tabular-nums}
.med-card,.eqv-card{transition:transform .15s ease,box-shadow .15s ease}
.med-card:hover,.eqv-card:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(15,23,42,.08)}
.view-main-btn,.btn-today,.week-nav-arrow,.hdr-stepper button{transition:background .15s ease,color .15s ease}
/* ── Carte « Ce soir » ── */
.tonight-card{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;margin:0 0 12px}
.tonight-chip{display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:9px 14px;min-width:0}
.tonight-chip.hero{background:linear-gradient(135deg,#1E293B,#0F172A);border-color:#1E293B}
.tonight-chip.hero .tc-label,.tonight-chip.hero .tc-name{color:var(--white)}
.tonight-chip.hero .tc-label{opacity:.75}
.tonight-chip.me{background:var(--me-soft);border-color:var(--me-border)}
.tc-emoji{font-size:18px;flex-shrink:0}
.tc-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-3);white-space:nowrap}
.tc-name{font-size:14px;font-weight:800;color:var(--ink);white-space:nowrap}
/* ── Squelette de chargement ── */
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.skel{border-radius:10px;background:linear-gradient(90deg,var(--surface-2) 25%,var(--bg) 50%,var(--surface-2) 75%);background-size:800px 100%;animation:shimmer 1.2s infinite linear}
.skel-wrap{padding:8px 0}
.provisoire-banner{display:flex;align-items:center;gap:6px;background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-fg);border-radius:10px;padding:5px 12px;font-size:12px;font-weight:600;margin-left:8px}
.hdr-stepper{display:inline-flex;align-items:center;gap:2px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:2px}
.hdr-stepper button{width:28px;height:28px;border:none;background:transparent;border-radius:8px;cursor:pointer;font-size:15px;color:var(--ink-2);line-height:1}
.hdr-stepper button:hover{background:var(--line-light);color:var(--red)}
.hdr-stepper button:disabled{opacity:.3;cursor:default;background:transparent;color:var(--ink-2)}
.header-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 12px;text-decoration:none;transition:border-color .15s,box-shadow .15s,color .15s}
.header-btn:hover{border-color:var(--red);color:var(--red);box-shadow:0 1px 5px rgba(15,23,42,.08)}
.header-btn .hb-ico{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;font-weight:800;line-height:1}
.theme-btn{width:34px;height:34px;border:1px solid var(--line);background:var(--white);border-radius:10px;cursor:pointer;font-size:15px;line-height:1;transition:background .15s ease}
.theme-btn:hover{background:var(--line-light)}
.hdr-step-label{min-width:112px;text-align:center;font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;text-transform:capitalize}
/* PC : steppers élégants, selects natifs cachés. Mobile : l'inverse (plomberie existante). */
@media (min-width:769px){ #yearSelect,#monthSelect{display:none} }
@media (max-width:768px){ #monthStepper,#yearStepper{display:none !important} }
.week-pill {
  border: 1.5px solid var(--line); background: var(--white); border-radius: 8px;
  padding: 5px 12px; font-size: 12px; font-weight: 600; color: var(--ink-3);
  cursor: pointer; transition: all .15s; white-space: nowrap;
}
.week-pill:hover { border-color: var(--red); color: var(--red); }
.week-pill.active { background: var(--red); border-color: var(--red); color: var(--white); }
.nav-divider { width: 1px; height: 20px; background: var(--line); flex-shrink: 0; }
.btn-today {
  border: 1.5px solid var(--line); background: var(--white); border-radius: 8px;
  padding: 5px 12px; font-size: 12px; font-weight: 600; font-family: 'DM Sans', sans-serif;
  color: var(--ink-2); cursor: pointer; transition: all .15s;
}
.btn-today:hover { border-color: var(--red); color: var(--red); }


/* ── TABLE ── */
.table-container { padding: 20px 32px; overflow-x: auto; border-radius: var(--radius); }
.planning-table {
  width: 100%; border-collapse: separate; border-spacing: 0;
  background: var(--white); border: 1px solid var(--line); border-radius: var(--radius);
  min-width: 900px; box-shadow: 0 1px 4px rgba(0,0,0,.05);
}

/* ── TABLE HEADER ── */
.th-sector {
  width: 180px; min-width: 160px; padding: 12px 16px; text-align: left;
  font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em;
  color: var(--ink-3); background: var(--line-light); border-bottom: 1px solid var(--line);
  border-right: 1px solid var(--line); position: sticky; left: 0; z-index: 10;
}
.th-day {
  padding: 10px 6px 6px; text-align: center; background: var(--white);
  border-bottom: 1px solid var(--line); border-right: 1px solid var(--line);
  vertical-align: top; min-width: 100px; max-width: 100px; width: 100px;
}
.th-day:last-child { border-right: none; }
.th-day.weekend { background: var(--line-light); }
.th-day.today { background: var(--today-soft); }
.day-name { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin-bottom: 1px; }
.day-date { font-size: 18px; font-weight: 700; color: var(--ink); line-height: 1; margin-bottom: 6px; }
.th-day.today .day-date { color: var(--red); }
.th-day.weekend .day-date { color: var(--ink-4); }
.am-pm-labels { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; margin-top: 4px; }
.am-pm-label {
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
  color: var(--white); background: var(--red); border-radius: 4px; padding: 2px 0; text-align: center;
}
.am-pm-label.pm { background: var(--ink-3); }
.th-day.weekend .am-pm-label, .th-day.weekend .am-pm-label.pm { background: var(--ink-4); }

/* ── TABLE ROWS ── */
.sector-row { border-bottom: 1px solid var(--line); }
.sector-row:last-child { border-bottom: none; }
.td-sector {
  padding: 0 10px; background: var(--line-light); border-right: 1px solid var(--line);
  vertical-align: middle; height: 56px; position: sticky; left: 0; z-index: 5; overflow: visible;
}
.sector-label { display: flex; align-items: center; gap: 8px; overflow: visible; }
.sector-icon-svg {
  width: 18px; height: 18px; flex-shrink: 0;
  stroke: var(--ink-3); stroke-width: 1.5; fill: none; display: block;
}
.sector-name-text { font-size: 13px; font-weight: 700; color: var(--ink); line-height: 1.2; }

/* ── SLOT CELLS ── */
.td-day {
  border-right: 1px solid var(--line); padding: 0; vertical-align: top; height: 56px;
}
.td-day:last-child { border-right: none; }
.td-day.weekend { background: var(--line-light); }
.td-day.today { background: var(--today-soft); }
.slot-pair { display: grid; grid-template-columns: 1fr 1fr; height: 100%; }
.slot {
  padding: 4px 3px; display: grid; grid-template-columns: 1fr 1fr;
  gap: 2px; align-content: start; border-right: 1px solid var(--line-light);
  min-height: 56px; flex: 1; overflow: hidden;
}
.slot:last-child { border-right: none; }
.slot-name {
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; font-family: var(--mono);
  padding: 2px 4px; border-radius: 5px; background: var(--line-light);
  color: var(--ink-2); cursor: default; white-space: nowrap;
  max-width: 44px; overflow: hidden; text-overflow: ellipsis;
}
.slot-name-spacer { display: inline-flex; width: 44px; visibility: hidden; }
.chip-guard { background: var(--info-soft); color: var(--info); }
.chip-h18   { background: var(--ok-soft); color: var(--ok); }
.slot-name.me-chip { box-shadow: 0 0 0 1.5px var(--me); font-weight: 800; }
#apiBar{position:fixed;top:0;left:0;height:3px;width:100%;z-index:99999;overflow:hidden;opacity:0;transition:opacity .2s;pointer-events:none}
#apiBar.on{opacity:1}
#apiBar::before{content:"";position:absolute;top:0;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--red,#CE1126),transparent);animation:apiSlide 1s infinite linear}
@keyframes apiSlide{0%{left:-40%}100%{left:100%}}
.slot-dash { color: var(--ink-4); font-size: 12px; text-align: center; margin-top: 4px; }

/* ── BOTTOM TABLES ── */
.bottom-tables { padding: 0 32px 32px; }
.bt-card {
  background: var(--white); border: 1px solid var(--line);
  border-radius: var(--radius); overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.bt-card-header {
  padding: 10px 16px; font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: var(--ink-4); background: var(--line-light); border-bottom: 1px solid var(--line);
}
.bt-scroll { overflow-x: auto; }
.bt-table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 900px; table-layout: fixed; }
.bt-label {
  width: 180px; min-width: 160px; max-width: 180px; padding: 8px 16px;
  font-size: 11px; font-weight: 600; color: var(--ink-3); background: var(--line-light);
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  vertical-align: middle; position: sticky; left: 0; z-index: 5;
}
.bt-table tr:last-child .bt-label, .bt-table tr:last-child .bt-cell { border-bottom: none; }
.bt-cell {
  padding: 5px 4px; text-align: center; border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line); vertical-align: top;
  width: 100px; min-width: 100px; max-width: 100px;
}
.bt-cell:last-child { border-right: none; }
.bt-cell.weekend { background: var(--line-light); }
.bt-dash { color: var(--ink-4); font-size: 12px; }
.name-tag {
  font-size: 10px; font-weight: 600; font-family: var(--mono);
  padding: 2px 5px; border-radius: 5px; background: var(--line-light);
  color: var(--ink-2); display: inline-flex; margin: 1px;
}
.name-tag.guard  { background: var(--info-soft); color: var(--info); }
.name-tag.h18    { background: var(--ok-soft); color: var(--ok); }
.name-tag.rg     { background: var(--viol-soft); color: var(--viol); }
.name-tag.absent { background: var(--line-light); color: var(--ink-3); border: 1px solid var(--line); }

/* ── VUE MÉDECINS ── */
.med-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
  padding: 20px 32px;
}
.med-card {
  position: relative; display: flex; flex-direction: column;
  background: var(--white); border: 1px solid var(--line);
  border-radius: 14px; padding: 14px 14px 12px; cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  box-shadow: 0 1px 3px rgba(0,0,0,.05); overflow: hidden;
}
.med-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.1); }
.med-accent { position: absolute; top: 0; left: 0; bottom: 0; width: 4px; }
.med-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.med-avatar {
  width: 40px; height: 40px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; font-family: var(--mono);
  flex-shrink: 0;
}
.med-name { font-size: 13.5px; font-weight: 700; color: var(--ink); line-height: 1.15; }
.med-role { font-size: 10px; color: var(--ink-4); margin-top: 1px; }
.med-sector-badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 10.5px; font-weight: 700;
  font-family: var(--mono); align-self: flex-start;
}
.med-statline {
  display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px;
  padding-top: 10px; border-top: 1px solid var(--line-light);
  font-size: 11px; font-weight: 600; color: var(--ink-3);
}
.med-statline b { color: var(--ink); font-weight: 800; }
.med-foot { display: flex; align-items: center; gap: 6px; margin-top: 9px; font-size: 11px; color: var(--ink-3); }
.med-foot-yr { font-family: var(--mono); font-weight: 800; color: var(--red); font-size: 13px; }
.med-inactive { opacity: .45; }

/* ── Vue Équité ── */
.eq-wrap { padding: 4px 0 24px; }
.eq-summary { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }

<script>
'use strict';

// ── AUTHENTIFICATION (Étape 2 confidentialité) ─────────────────────────
// La page exige désormais un code valide (MAR ou admin). Le code est
// mémorisé en sessionStorage et envoyé en POST (jamais dans l'URL).
// (La liste DOCTORS en dur a été supprimée : code mort + noms en clair.)
let VIEW_CODE = '';
let MY_ID = null; // id du MAR connecté (null si connexion admin) — personnalisation des vues

// ── Carte « Ce soir » : qui est de garde cette nuit, demain, et ma prochaine ──
function _gardeOn(dateStr){
  for(const m of DATA.months){
    const di=m.days.findIndex(d=>d.date===dateStr);
    if(di<0) continue;
    const ids=m.doctors.filter(dc=>{const st=(dc.days[di]||{}).status;return st==='G'||st==='G2';}).map(dc=>dc.id);
    if(ids.length) return ids;
  }
  return [];
}
function _plusDays(dateStr,n){const d=new Date(dateStr+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function renderTonightCard(){
  const el=document.getElementById('tonightCard');
  if(!el||!DATA) return;
  const today=todayStr();
  // Uniquement si l'année affichée contient aujourd'hui
  const hasToday=DATA.months.some(m=>m.days.some(d=>d.date===today));
  if(!hasToday){ el.style.display='none'; return; }
  const fmtD=ds=>new Date(ds+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
  const nm=id=>(id==='PRUNET'?'Pr ':'Dr ')+id.charAt(0)+id.slice(1).toLowerCase();
  const chips=[];
  const tonight=_gardeOn(today);
  if(tonight.length){
    const isMe=MY_ID&&tonight.includes(MY_ID);
    chips.push(`<div class="tonight-chip hero"><span class="tc-emoji">🌙</span><div><div class="tc-label">Cette nuit</div><div class="tc-name">${tonight.map(nm).join(' + ')}${isMe?' — c\u2019est vous':''}</div></div></div>`);
  }
  const tom=_gardeOn(_plusDays(today,1));
  if(tom.length) chips.push(`<div class="tonight-chip"><span class="tc-emoji">🌄</span><div><div class="tc-label">Demain</div><div class="tc-name">${tom.map(nm).join(' + ')}</div></div></div>`);
  if(MY_ID && !(tonight.includes(MY_ID))){
    let next=null;
    outer: for(const m of DATA.months){
      const doc=m.doctors.find(dc=>dc.id===MY_ID);
      if(!doc) continue;
      for(let i=0;i<m.days.length;i++){
        const st=(doc.days[i]||{}).status;
        if((st==='G'||st==='G2') && m.days[i].date>today){ next=m.days[i].date; break outer; }
      }
    }
    if(next) chips.push(`<div class="tonight-chip me"><span class="tc-emoji">👤</span><div><div class="tc-label">Votre prochaine garde</div><div class="tc-name">${fmtD(next)}</div></div></div>`);
  }
  el.innerHTML=chips.join('');
  el.style.display=chips.length?'flex':'none';
}

// Une semaine est « provisoire » si son lundi est au-delà de aujourd'hui + 28 jours :
// le comité peut encore y faire des ajustements. Aucune action manuelle requise.
function isWeekProvisoire(mondayDateStr){
  const horizon = new Date(); horizon.setHours(12,0,0,0); horizon.setDate(horizon.getDate() + 28);
  return new Date(mondayDateStr + 'T12:00:00') > horizon;
}

function _meName(id){ return (id==='PRUNET'?'Pr ':'Dr ')+id.charAt(0)+id.slice(1).toLowerCase(); }
function applyUserBadge(r){
  MY_ID = (r && r.role === 'mar' && r.id) ? r.id : null;
  const pill = document.getElementById('mePill');
  if (pill) {
    // MAR : nom (ou initiales sur mobile) · Admin : "Admin". Toujours affiché,
    // cliquable → déconnexion (permet de changer d'utilisateur).
    const label = MY_ID ? (isMobile && r.initials ? r.initials : _meName(MY_ID)) : 'Admin';
    pill.innerHTML = '👤 ' + esc(label) + ' <span class="me-pill-logout" aria-label="Déconnexion" style="display:inline-flex;align-items:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>';
    pill.style.display = 'inline-flex';
    pill.style.cursor = 'pointer';
    pill.title = 'Changer d\'utilisateur / déconnexion';
    pill.onclick = logout;
  }
}
function logout(){
  if (!confirm('Se déconnecter de ce téléphone ?')) return;
  SessionPortail.oublier();
  VIEW_CODE = ''; MY_ID = null;
  location.reload();
}

let _apiBusy = 0;
function _apiBar(on) {
  let el = document.getElementById('apiBar');
  if (!el) { el = document.createElement('div'); el.id = 'apiBar'; document.body.appendChild(el); }
  _apiBusy = Math.max(0, _apiBusy + (on ? 1 : -1));
  el.classList.toggle('on', _apiBusy > 0);
}
/* ── (01/08/2026) FILET : CORPS DE REQUETE PERDU ─────────────────────────
   « Code absent de la requête » est un message que le serveur ne produit que
   dans un seul cas : il a recu la requete mais pas son corps, donc il n'a
   RIEN FAIT — ni lu, ni ecrit, ni envoye de mail. Renvoyer est donc sans
   danger, y compris pour une action d'ecriture : c'est la seule erreur du
   systeme dont on sache avec certitude qu'elle n'a laisse aucune trace.
   On ne rejoue QUE sur ce message, jamais sur un code refuse.
   Le second envoi apparait comme une ligne distincte dans chrono() : le
   probleme reste visible au lieu d'etre masque par le correctif. */
const ERR_CORPS_PERDU = 'Code absent de la requête';
async function _apiPostFilet(payload) {
  const r = await _apiPostDirect(payload);
  if (r && r.success === false && r.error === ERR_CORPS_PERDU) {
    console.warn('[api] corps de requete perdu (' + (payload.action || '?') + ') — renvoi immediat');
    return await _apiPostDirect(payload);
  }
  return r;
}

/* ── (03/08/2026) UN SEUL APPEL EN VOL A LA FOIS ─────────────────────
   Mesure du 03/08 a 18:46 (cas « MAR habitue », 6 appels, 25,9 s) :
   getAffectationsJson lance EN PARALLELE d'un autre appel a coute 8 461 ms de
   reseau ; le MEME appel, parti moins encombre, en a coute 1 761. Facteur 4,8
   sur le meme appel dans la meme ouverture.
   Apps Script met de toute facon les executions d'un meme compte en file
   (deploiement « Executer en tant que : moi »). Les envoyer en parallele ne
   fait donc rien gagner : ca transforme une attente ordonnee en bousculade.
   admin.html applique ce principe depuis le 28/07 ; index.html ne l'avait
   jamais recu.
   ⚠️ Ne jamais revenir a des appels paralleles « pour aller plus vite ». */
/* ══ MIROIR CLOUDFLARE — LECTURE (etape 4, 03/08/2026) ═══════════════════
   Mesures du 03/08 : un appel Apps Script coute 2,5 a 5 s quel que soit le
   travail serveur (compilation ~575 Ko a CHAQUE requete, redirection 302,
   file d'attente par compte). Le miroir Cloudflare (cloudflare/worker.js,
   alimente par gas/miroir.gs a chaque ecriture) sert les MEMES donnees en
   ~150 ms, authentification comprise (empreinte SHA-256 du code, calculee
   cote Worker — le code ne circule qu'en POST, jamais dans l'URL).
   REGLE DE REPLI : tout resultat autre qu'un succes complet (panne, miroir
   vide, cle manquante, code refuse) rend la main au circuit GAS historique,
   qui reste SEUL JUGE de la validite d'un code. Le pire cas est donc le
   comportement d'avant ce patch — jamais moins bien.
   FRAICHEUR : le stockage Cloudflare propage en ~60 s au plus. La donnee
   servie peut donc avoir jusqu'a une minute de retard sur une ecriture du
   comite — assume (voir guide technique, section Miroir). */
const MIROIR_URL = 'https://miroir.planningmedic.workers.dev';
const _MIROIR_PRE = { annees: null, secteurs: null };   // livre par miroirBoot(), consomme par init()/loadSecteurs()

async function miroirRead(keys) {
  const _dep = Math.round(performance.now()), _t0 = Date.now();
  const _ctrl = new AbortController();
  const _timer = setTimeout(() => _ctrl.abort(), 6000);   // 6 s : au-dela, le GAS fera mieux
  try {
    const res = await fetch(MIROIR_URL + '/read', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // requete « simple » : pas de preambule CORS
      body: JSON.stringify({ code: VIEW_CODE, keys }),
      signal: _ctrl.signal,
    });
    const rep = await res.json();
    try { if (window.PERF) PERF.appel('miroir:' + keys.join('+'), Date.now() - _t0, null, _dep,
                                      rep && rep.success ? 'ok' : 'ECHEC — ' + ((rep && rep.error) || 'HTTP ' + res.status)); } catch (_e) {}
    return rep;
  } catch (e) {
    try { if (window.PERF) PERF.appel('miroir:' + keys.join('+'), Date.now() - _t0, null, _dep,
                                      'ECHEC — ' + (e && e.message)); } catch (_e) {}
    return null;   // toute panne de transport → le repli GAS decide
  } finally { clearTimeout(_timer); }
}

/* Ouverture par le miroir : UN aller-retour qui authentifie et livre annees
   + secteurs + planning + affectations. Renvoie true si la page est partie
   sur le miroir ; tout autre retour → l'appelant bascule sur le GAS. */
async function miroirBoot() {
  const devine = new Date().getFullYear();
  const m = await miroirRead(['annees', 'secteurs', 'planning_' + devine, 'affectations_' + devine]);
  if (!m || !m.success) return m;
  const active = (m.data && m.data.annees && Number(m.data.annees.active)) || devine;
  if (active !== devine) {
    const m2 = await miroirRead(['planning_' + active, 'affectations_' + active]);
    if (m2 && m2.success && m2.data) Object.assign(m.data, m2.data);
  }
  const plan = m.data && m.data['planning_' + active];
  if (!plan) return null;   // cle jamais poussee → circuit GAS
  // Meme deballage que loadYear : le fichier affectations_{Y}.json contient
  // un objet { affectations: {...} }.
  const affBrut = m.data['affectations_' + active];
  const aff = (affBrut && affBrut.affectations) || {};
  PLANNING_CACHE[active] = plan;
  AFF_CACHE[active] = aff;
  _ssPlanWrite(active, plan, aff);
  _MIROIR_PRE.annees   = (m.data.annees && Array.isArray(m.data.annees.annees)) ? m.data.annees : null;
  _MIROIR_PRE.secteurs = Array.isArray(m.data.secteurs) ? m.data.secteurs : null;
  applyUserBadge(m.identite || {});
  /* Journal de connexion : l'action login du GAS part en arriere-plan et son
     resultat est IGNORE — l'authentification a deja eu lieu au miroir, cet
     appel ne sert que la ligne du journal CONNEXIONS. */
  /* (23/08/2026) JOURNAL DE CONNEXION RETIRE. Decision d'Arthur : la
     tracabilite ne se fait qu'a DEUX endroits — l'ouverture du portail
     (dashboard.html) et la connexion du comite (admin.html). Partout ailleurs

const API_MAX_ESSAIS = 2;
const API_PAUSE_REJEU = 1500;
async function _apiPostDirect(payload) {
  payload.code = VIEW_CODE;
  _apiBar(true);
  // (01/08/2026) Journal de mesure — lecture seule, alimente chrono().
  const _act = payload.action || '(sans action)';
  let _dernier = null;
  try {
    for (let essai = 1; essai <= API_MAX_ESSAIS; essai++) {
      const _dep = Math.round(performance.now()), _t0 = Date.now();
      const _ctrl = new AbortController();
      const _timer = setTimeout(() => _ctrl.abort(), 120000);
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
          redirect: 'follow',
          signal: _ctrl.signal,
        });
        const _rep = await res.json();
        try { if (window.PERF) PERF.appel(_act, Date.now() - _t0, _rep && _rep._srv_ms, _dep,
                                          res.ok ? 'ok' : 'ECHEC — HTTP ' + res.status,
                                          _rep && _rep._glob_ms); } catch (_e) {}
        return _rep;
      } catch (e) {
        try { if (window.PERF) PERF.appel(_act, Date.now() - _t0, null, _dep,
                                          'ECHEC — ' + (e && e.message)
                                          + (essai < API_MAX_ESSAIS ? ' (rejeu)' : '')); } catch (_e) {}
        _dernier = (e && e.name === 'AbortError')
          ? new Error('Délai dépassé (2 min) — serveur trop lent ou injoignable, réessayez')
          : e;
        if (essai < API_MAX_ESSAIS) {
          console.warn('[api] ' + _act + ' — echec de transport (' + (e && e.message) + ') : rejeu dans '
                       + API_PAUSE_REJEU + ' ms');
        }
      } finally { clearTimeout(_timer); }
      if (essai < API_MAX_ESSAIS) await new Promise(r => setTimeout(r, API_PAUSE_REJEU));
    }
    throw _dernier;
  } finally { _apiBar(false); }
}

function esc(s){ return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function isWeekend(wd){ return wd==='S'||wd==='D'; }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function isoWeek(dateStr){
  const dt=new Date(dateStr);
  const tmp=new Date(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate()));
  tmp.setUTCDate(tmp.getUTCDate()+4-(tmp.getUTCDay()||7));
  const ys=new Date(Date.UTC(tmp.getUTCFullYear(),0,1));
  return Math.ceil((((tmp-ys)/86400000)+1)/7);
}

function getWeeksInMonth(month){
  const weekNums=[...new Set(month.days.map(d=>isoWeek(d.date)))];
  const weeks=[];
  weekNums.forEach(wn=>{
    const refDay=month.days.find(d=>isoWeek(d.date)===wn);
    if(!refDay) return;
    const refDate=new Date(refDay.date);
    const dow=refDate.getDay()||7;
    const monday=new Date(refDate);
    monday.setDate(refDate.getDate()-(dow-1));
    let daysInThisMonth=0, daysInOtherMonths=0;
    for(let i=0;i<7;i++){
      const d=new Date(monday); d.setDate(monday.getDate()+i);
      if(d.getMonth()+1===month.month&&d.getFullYear()===month.year) daysInThisMonth++;
      else daysInOtherMonths++;
    }
    // Exception : dernier mois du planning (janvier N+1, < 7 jours) — on affiche quand même
    const isLastMonth = DATA && month === DATA.months[DATA.months.length - 1];
    if(!isLastMonth && daysInThisMonth<=daysInOtherMonths) return;
    const days=[];
    for(let i=0;i<7;i++){
      const d=new Date(monday); d.setDate(monday.getDate()+i);
      const dateStr=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const found=month.days.find(md=>md.date===dateStr);
      if(found){
        days.push({...found, dayIdx:month.days.indexOf(found), sourceMonth:null});
      } else {
        const wd=['D','L','M','M','J','V','S'][d.getDay()];
        const otherMonth=DATA.months.find(m=>m.days.some(md=>md.date===dateStr));
        if(otherMonth){
          const otherDay=otherMonth.days.find(md=>md.date===dateStr);
          days.push({...otherDay, dayIdx:otherMonth.days.indexOf(otherDay), sourceMonth:otherMonth});
        } else {
          days.push({day:d.getDate(), weekday:wd, date:dateStr, dayIdx:-1, sourceMonth:null});
        }
      }
    }
    weeks.push({weekNum:wn, days});
  });
  // (Horizon glissant) Toutes les semaines sont affichées — la validation
  // manuelle a été remplacée par le badge « provisoire » (> aujourd'hui + 4 sem.)
  return weeks.sort((a,b)=>a.weekNum-b.weekNum);
}

function weekDaysFull(weekInfo){
  const out=Array(7).fill(null);
  weekInfo.days.forEach(d=>{
    const dt=new Date(d.date);
    let dow=dt.getDay(); if(dow===0)dow=6; else dow-=1;
    out[dow]=d;
  });
  return out;
}

      if(yearData.success && yearData.year) activeYear = yearData.year;

  //    a) le chargement du planning de l'année active (affiché dès qu'il arrive),
  //    b) les sondes des AUTRES années (sélecteur), l'année active étant couverte par (a).
  currentYear = activeYear;
  const planP = loadYear(activeYear);   // rend le planning sans attendre les sondes

  /* (03/08/2026) UN SEUL APPEL au lieu d'une sonde par annee.
     On sondait chaque annee de 2026 a N+1 avec un getAffectationsJson : 1 appel en
     2026, 5 en 2030, 10 en 2035. Apps Script serialise les executions d'un meme
     utilisateur, donc ces sondes ne se recouvrent pas, elles s'additionnent — le
     plancher mesure par appel est d'environ 2,5 s (1,4 s de plateforme + 0,7 s de
     compilation), sans compter la file d'attente Google.
     getAnneesDisponibles repond pour toutes les annees d'un coup, et couvre aussi
     celles dont les onglets sont partis dans le classeur d'archives.
     AFF_CACHE n'est plus pre-rempli : loadYear() le remplit a la demande (l. 1376). */
  const availableYears = [];
  try {
    // (miroir) liste deja livree par miroirBoot() → zero appel ici dans ce cas.
    const r = _MIROIR_PRE.annees
      ? { success: true, annees: _MIROIR_PRE.annees.annees }
      : await apiPost({action: 'getAnneesDisponibles'});
    if (r && r.success && Array.isArray(r.annees)) {
      r.annees.forEach(a => { if (Number(a.annee) !== activeYear) availableYears.push(Number(a.annee)); });
    }
  } catch(e){}

  // 3. Résultat du chargement de l'année active
  const planOk = (await planP) !== false;

  availableYears.sort((a, b) => a - b);

  if(!availableYears.length) {
    document.body.innerHTML = `<div style="padding:40px;font-family:sans-serif;color:#CE1126"><h2>Aucun fichier planning trouvé</h2></div>`;

  document.getElementById('btnMedecins').onclick = () => setMainView('medecins');
  document.getElementById('btnEquite').onclick = () => setMainView('equite');

    const res = await apiPost({action:'getPlanningJson', year});
    let affRes = null;
    if (avecAff) affRes = await apiPost({action:'getAffectationsJson', year});
    if (!res || !res.success || !res.planning) return;
    const fresh = res.planning;
    const freshAff = avecAff
      ? ((affRes && affRes.success && affRes.affectations && affRes.affectations.affectations) || {})
      : (AFF_CACHE[year] || {});
    const changed = JSON.stringify(fresh) !== JSON.stringify(PLANNING_CACHE[year] || null)
                 || JSON.stringify(freshAff) !== JSON.stringify(AFF_CACHE[year] || null);
    PLANNING_CACHE[year] = fresh; AFF_CACHE[year] = freshAff;
    _ssPlanWrite(year, fresh, freshAff);
    if (changed && currentYear === year) {
      DATA = fresh; AFFECTATIONS_DATA = freshAff;
      const keep = DATA.months.find(m => m.id === currentMonthId);
      if (!keep) {
        const now = new Date();
        const found = DATA.months.find(m => m.year === now.getFullYear() && m.month === now.getMonth() + 1);
        currentMonthId = found ? found.id : DATA.months[0].id;
      }
      buildMonthSelect(); buildWeekNav(); render();
      if (typeof isMobile !== 'undefined' && isMobile) { buildMobileDayList(); renderMobileDay(); }
    }
  } catch(e){ /* silencieux */ }
}

async function loadYear(year) {
  // (perf) rehydratation depuis sessionStorage : affichage immediat + refresh derriere
  let fromSS = false, affFromSS = false;
  if (!PLANNING_CACHE[year]) {
    const c = _ssPlanRead(year);
    if (c) { PLANNING_CACHE[year] = c.p;
             if (c.a !== undefined) { AFF_CACHE[year] = c.a; affFromSS = true; }
             fromSS = true; }
  }
  if (!PLANNING_CACHE[year]) showSkeleton();
  try {
    if (PLANNING_CACHE[year]) {
      DATA = PLANNING_CACHE[year];
    } else {
      /* (miroir, 03/08/2026) Changement d'annee : miroir d'abord (N+1 y est
         poussee des qu'elle existe sur le Drive), GAS en repli. Le miroir
         livre aussi les affectations : AFF_CACHE evite l'appel suivant. */
      let _plan = null;
      const _mi = await miroirRead(['planning_' + year, 'affectations_' + year]);
      if (_mi && _mi.success && _mi.data && _mi.data['planning_' + year]) {
        _plan = _mi.data['planning_' + year];
        const _ab = _mi.data['affectations_' + year];
        if (_ab && _ab.affectations) AFF_CACHE[year] = _ab.affectations;
      }
      if (_plan) {
        DATA = _plan;
      } else {
        const res = await apiPost({action: 'getPlanningJson', year});
        if (!res || !res.success || !res.planning) throw new Error((res && res.error) || 'réponse API invalide');
        DATA = res.planning;
      }
      PLANNING_CACHE[year] = DATA;
      _ssPlanWrite(year, DATA, AFF_CACHE[year]);
    }
  } catch(e) {
    const msg = String((e && e.message) || e || '');
    if (/invalide|code/i.test(msg)) {
      // Auth : la session n'est plus valide → retour propre à l'écran de connexion
      SessionPortail.oublier();
      VIEW_CODE = '';
      const ov = document.getElementById('viewAuthOverlay'); if (ov) ov.style.display = 'flex';
      if (typeof _authErr === 'function') _authErr('Session expirée — reconnectez-vous');
    } else {
      // Erreur non-auth : bannière non destructive (ne rase plus tout le body)
      const box = document.createElement('div');
      box.style.cssText = 'padding:40px;font-family:sans-serif;color:#CE1126';
      box.innerHTML = '<h2>Erreur de chargement ' + year + '</h2><pre>' + esc(msg) + '</pre>';
      document.body.insertBefore(box, document.body.firstChild);
    }
    return false;
  }

  /* Affectations sectorielles : cache d'init(), puis miroir, puis API protégée.
     (13/08/2026) DEFAUT VU EN PRODUCTION — bascule sur 2027 interminable.
     Le dashboard precharge le planning de l'annee SUIVANTE et le range dans la
     memoire de session partagee (pmPlan:{Y}), mais il n'a que faire des
     affectations : il ne les y met pas. En arrivant ici, la page trouvait donc
     le planning tout de suite et partait chercher les affectations chez Google
     — appel lent, rejoue une fois, et ATTENDU avant le moindre affichage.
     Pendant deux a quatre minutes : temoin d'activite allume, et l'ecran
     conservant l'annee precedente sous le libelle de la nouvelle.
     L'annee en cours n'en souffrait pas : miroirBoot() charge planning ET
     affectations dans le meme appel. C'est le demi-remplissage du cache par une
     AUTRE page qui creait le piege — on ne se fie pas a un cache partiel.
     Le miroir sert la meme donnee en une fraction de seconde ; Google reste le
     dernier recours. */
  try {
    if (AFF_CACHE[year]) {
      AFFECTATIONS_DATA = AFF_CACHE[year];
    } else {
      let _aff = null;
      const _ma = await miroirRead(['affectations_' + year]);
      const _ab = _ma && _ma.success && _ma.data && _ma.data['affectations_' + year];
      if (_ab && _ab.affectations) _aff = _ab.affectations;
      if (!_aff) {
        const affRes = await apiPost({action: 'getAffectationsJson', year});
        _aff = (affRes && affRes.success && affRes.affectations && affRes.affectations.affectations) || {};
      }
      AFFECTATIONS_DATA = _aff;
      AFF_CACHE[year] = AFFECTATIONS_DATA;
      _ssPlanWrite(year, DATA, AFFECTATIONS_DATA);
    }
  } catch(e) { AFFECTATIONS_DATA = {}; }

  // (perf) si on a servi le cache de la visite precedente : rafraichir en arriere-plan.
  // Les affectations ne sont reverifiees que si elles venaient AUSSI du cache (03/08).
  if (fromSS) _refreshYearSilently(year, affFromSS);

  // Aller au mois actuel si disponible dans cette année, sinon premier mois
  const now = new Date();
  const found = DATA.months.find(m => m.year === now.getFullYear() && m.month === now.getMonth() + 1);
  currentMonthId = found ? found.id : DATA.months[0].id;
  currentWeekIdx = 0;
  window._weekInitialized = false;

  buildMonthSelect();
  buildWeekNav();
  render();
  // Init mobile après chargement
  checkMobile();
  if (isMobile) { buildMobileDayList(); renderMobileDay(); }
}

function goToToday(){
  // Basculer sur l'année active si on est sur une année archivée
  const now = new Date();
  const todayYear = now.getFullYear();
  if(currentYear !== todayYear) {
    const sel = document.getElementById('yearSelect');
    // Chercher si l'année courante est dans le sélecteur
    const opt = [...sel.options].find(o => parseInt(o.value) === todayYear);
    if(opt) {
      sel.value = todayYear;
      currentYear = todayYear;
      loadYear(todayYear).then(() => {
        _goToTodayInCurrentData();
      });
      return;
    }
  }
  _goToTodayInCurrentData();
}

function _goToTodayInCurrentData(){

  currentMonthId = found.id;

// ── MONTH SELECT ───────────────────────────────────────────────────────
function buildMonthSelect(){
  const sel=document.getElementById('monthSelect');
  sel.innerHTML='';
  DATA.months.forEach((m, idx)=>{
    // Masquer le dernier mois s'il a moins de 7 jours (janvier N+1 — déjà visible dans déc.)
    const isLast = idx === DATA.months.length - 1;
    if(isLast && m.days.length < 7) return;
    const opt=document.createElement('option');
    // Mobile : « Juillet » (l'année a son propre sélecteur — pas deux fois 2026)
    opt.value=m.id; opt.textContent=isMobile ? m.label.replace(/\s+\d{4}$/,'') : m.label;
    if(m.id===currentMonthId) opt.selected=true;
    sel.appendChild(opt);
  });
  sel.onchange=()=>{
    currentMonthId=sel.value;
    currentWeekIdx=0;
    window._weekInitialized=false;
    buildWeekNav();
    render();
    if(currentMainView==='medecins') renderMedecins();
    if(isMobile){buildMobileDayList();renderMobileDay();}
    updateHeaderSteppers();
  };
}

// ── WEEK NAV ───────────────────────────────────────────────────────────
function buildWeekNav(){
  const month=DATA.months.find(m=>m.id===currentMonthId);
  const weeks=getWeeksInMonth(month);
  const today=todayStr();
  if(currentWeekIdx===0&&!window._weekInitialized){
    const todayWk=weeks.findIndex(w=>w.days.some(d=>d.date===today));
    if(todayWk>=0) currentWeekIdx=todayWk;
    window._weekInitialized=true;
  }
  currentWeekIdx=Math.min(currentWeekIdx, weeks.length-1);
  const w=weeks[currentWeekIdx];
  const lbl=document.getElementById('weekBarLabel');
  if(lbl && w){
    const fmt=dt=>new Date(dt+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
    const prov=isWeekProvisoire(w.days[0].date);
    lbl.innerHTML=`<b>S${w.weekNum}</b> · ${fmt(w.days[0].date)} – ${fmt(w.days[w.days.length-1].date)}`+(prov?' <span class="prov-dot" title="Semaine provisoire">🚧</span>':'');
  }
}

// Navigation de semaine en semaine, en franchissant les mois sans couture
function stepWeek(dir){
  const idx=DATA.months.findIndex(m=>m.id===currentMonthId);
  const month=DATA.months[idx];
  const weeks=getWeeksInMonth(month);
  const curNum=weeks[Math.min(currentWeekIdx,weeks.length-1)].weekNum;
  let ni=currentWeekIdx+dir;
  if(ni>=0 && ni<weeks.length){ currentWeekIdx=ni; }
  else{
    const nm=DATA.months[idx+dir];
    if(!nm) return; // borne de l'année
    currentMonthId=nm.id;
    const nw=getWeeksInMonth(nm);
    // Une semaine à cheval sur deux mois apparaît dans les deux : on la saute
    let t=dir>0?0:nw.length-1;
    if(nw[t] && nw[t].weekNum===curNum) t+=dir;
    if(t<0||t>=nw.length) return;
    currentWeekIdx=t;
    buildMonthSelect();
    if(currentMainView==='medecins') renderMedecins();
  }
  buildWeekNav(); render();
  updateHeaderSteppers();
}

}

const DAYS_FR = ['LUNDI','MARDI','MERCREDI','JEUDI','VENDREDI','SAMEDI','DIMANCHE'];

function renderTable(month,daySlots,week){
  const today=todayStr();
  const MY_INIT = MY_ID ? ((month.doctors.find(d=>d.id===MY_ID)||{}).initials||null) : null;
  let thead=`<thead><tr><th class="th-sector">SECTEUR</th>`;
  daySlots.forEach((slot,i)=>{
    if(!slot){ thead+=`<th class="th-day weekend"></th>`; return; }
    const isWe=isWeekend(slot.weekday);
    const isFerie=slot.isFerie||false;
    const isTd=slot.date===today;
    const cls=['th-day',(isWe||isFerie)?'weekend':'',isTd?'today':''].filter(Boolean).join(' ');
    thead+=`<th class="${cls}">
      <div class="day-name">${DAYS_FR[i]}</div>
      <div class="day-date">${slot.day}${isFerie?' <span style="font-size:8px;color:#C2410C;font-weight:700">JF</span>':''}</div>
      <div class="am-pm-labels">
        <div class="am-pm-label">AM</div>
        <div class="am-pm-label pm">PM</div>
      </div>
    </th>`;
  });
  thead+=`</tr></thead>`;

  const smap={};
  SECTORS_DEF.forEach(s=>{ smap[s.code]=Array(7).fill(null).map(()=>({am:[],pm:[]})); });

  month.doctors.forEach(doc=>{
    daySlots.forEach((slot,dow)=>{
      if(!slot) return;
      let entry={};
      if(slot.dayIdx>=0){
        if(slot.sourceMonth){
          const otherDoc=slot.sourceMonth.doctors.find(d=>d.id===doc.id);
          entry=otherDoc?(otherDoc.days[slot.dayIdx]||{}):{};
        } else {
          entry=doc.days[slot.dayIdx]||{};
        }
      }
      if(entry.status && ABSENT_STATUSES.has(entry.status)) return;
      const status=entry.status||'';
      // multi-secteur "VIS+REA" → le MAR apparaît dans chaque secteur
      [['am',entry.morning],['pm',entry.afternoon]].forEach(([half,val])=>{
        (val||'').split('+').forEach(raw=>{
          const part=raw.trim(); if(!part) return;
          const key=part.startsWith('CS-')?'CS':part;
          if(smap[key]) smap[key][dow][half].push({init:doc.initials,status,sector:part});
        });
      });
      if(entry.cs&&smap['CS']) smap['CS'][dow].am.push({init:doc.initials,status,sector:entry.cs});
      if(entry.cs2&&smap[entry.cs2]) smap[entry.cs2][dow].am.push({init:doc.initials,status,sector:entry.cs2});
      if(entry.cs3&&smap[entry.cs3]) smap[entry.cs3][dow].pm.push({init:doc.initials,status,sector:entry.cs3});
    });
  });

  const active=SECTORS_DEF.filter(s=>s.code!=='CS'&&smap[s.code].some(d=>d.am.length||d.pm.length));
  let tbody='<tbody>';
  active.forEach(s=>{
    tbody+=`<tr class="sector-row"><td class="td-sector">
      <div class="sector-label">
        <i data-lucide="${esc(s.icon)}" class="sector-icon-svg"></i>
        <span class="sector-name-text">${esc(s.label)}</span>
      </div></td>`;
    daySlots.forEach((slot,dow)=>{
      const isWe=slot?isWeekend(slot.weekday):true;
      const isTd=slot?slot.date===today:false;
      const cls=['td-day',isWe?'weekend':'',isTd?'today':''].filter(Boolean).join(' ');
      tbody+=`<td class="${cls}">`;
      if(!slot||(!smap[s.code][dow].am.length&&!smap[s.code][dow].pm.length)){
        tbody+=`<div class="slot-pair"><div class="slot"><span class="slot-dash">—</span></div><div class="slot"><span class="slot-dash">—</span></div></div>`;
      } else if(isWe){
        const names=smap[s.code][dow].am;
        const chips=names.map(p=>{
          const c=(p.status==='G'||p.status==='G2')?'slot-name chip-guard':'slot-name';
          const me=(MY_INIT&&p.init===MY_INIT)?' me-chip':'';
          return `<span class="${c}${me}">${p.init||''}</span>`;
        });
        tbody+=`<div class="slot-pair" style="display:flex;align-items:center;justify-content:center;gap:4px;height:100%">${chips.join('')}</div>`;
      } else {
        const amNames=smap[s.code][dow].am;
        const pmNames=smap[s.code][dow].pm;
        const makeChips=arr=>{ const chips=arr.map(p=>{const c=(p.status==='G'||p.status==='G2')?'slot-name chip-guard':p.status==='18'?'slot-name chip-h18':'slot-name';const me=(MY_INIT&&p.init===MY_INIT)?' me-chip':'';return `<span class="${c}${me}">${p.init||''}</span>`;});if(chips.length%2!==0)chips.push('<span class="slot-name-spacer"></span>');return chips.join('');};
        tbody+=`<div class="slot-pair">
          <div class="slot">${amNames.length?makeChips(amNames):'<span class="slot-dash">—</span>'}</div>
          <div class="slot">${pmNames.length?makeChips(pmNames):'<span class="slot-dash">—</span>'}</div>
        </div>`;
      }
      tbody+=`</td>`;
    });
    tbody+=`</tr>`;
  });
  tbody+='</tbody>';
  document.getElementById('planningTable').innerHTML=thead+tbody;

  // Panneau consultations (agenda par jour, sous la grille)
  renderConsPanel(month,daySlots,today);
}

function renderConsPanel(month,daySlots,today){

  const csColor=spec=>SECTOR_COLORS[spec]||(spec==='INTER'?SECTOR_COLORS.CI:spec==='POLY'?SECTOR_COLORS.VOLANT:{bg:'#F1F5F9',fg:'#64748B'});
  const nameOf=id=>(id==='PRUNET'?'Pr ':'Dr ')+id.charAt(0)+id.slice(1).toLowerCase();
  const cons=Array(7).fill(null).map(()=>({am:[],pm:[]}));
  month.doctors.forEach(doc=>{
    daySlots.forEach((slot,dow)=>{

        if(slot.sourceMonth){ const od=slot.sourceMonth.doctors.find(d=>d.id===doc.id); entry=od?(od.days[slot.dayIdx]||{}):{}; }
        else { entry=doc.days[slot.dayIdx]||{}; }
      }
      if(entry.status && ABSENT_STATUSES.has(entry.status)) return;
      [['am',entry.morning],['pm',entry.afternoon]].forEach(function(hv){

          cons[dow][half].push({id:doc.id,spec:_sp,lib:!!(entry.lib && _sp==='END' && half==='pm')});
        });
      });
      // Miroir mater : le MAR en secteur MAT le matin (mardi/jeudi) fait aussi la consult mater.
      const _jsDowMat = slot.date ? new Date(slot.date+'T12:00:00').getDay() : -1;
      if((_jsDowMat===2||_jsDowMat===4) && String(entry.morning||'').split('+').map(x=>x.trim()).includes('MAT')){
        cons[dow].am.push({id:doc.id,spec:'MAT',lib:false});
      }
    });
  });
  // (Alignement) TOUJOURS 7 colonnes, comme le tableau : sans ça, une semaine
  // ordinaire n'en produisait que 5 (les week-ends vides étaient retirés) et rien
  // ne tombait en face des jours du planning.
  const cols=[];
  daySlots.forEach((slot,dow)=>{ cols.push({slot,dow}); });
  const _total=cons.reduce((n,c)=>n+c.am.length+c.pm.length,0);
  if(!_total){ panel.innerHTML=''; return; }
  let _hasLib=false;
  const chip=c=>{ const sc=csColor(c.spec), lbl=CS_LABELS[c.spec]||c.spec; const isLib=!!c.lib; if(isLib)_hasLib=true; const cls='cons-chip'+(isLib?' cons-chip-lib':''); const tag=isLib?'<span class="cons-lib">LIB</span>':''; const ttl=isLib?`${lbl} · libéral (rotation GR) · ${nameOf(c.id)}`:`${lbl} · ${nameOf(c.id)}`; return `<div class="${cls}" style="background:${sc.bg};color:${sc.fg}" title="${esc(ttl)}">${tag}<span class="cons-spec">${esc(lbl)}</span><span class="cons-mar">${esc(nameOf(c.id))}</span></div>`; };
  const half=arr=>arr.length?arr.map(chip).join(''):'<div class="cons-empty">—</div>';
  let _cols='';
  cols.forEach(function(col){
    const slot=col.slot, dow=col.dow;
    if(!slot){ _cols+='<div class="cons-day cons-day-vide"></div>'; return; }
    const isTd=slot.date===today;
    const dn=DAYS_FR[dow], lbl=dn.charAt(0)+dn.slice(1,3).toLowerCase();
    _cols+=`<div class="cons-day${isTd?' today':''}"><div class="cons-dayhead">${lbl} ${slot.day}</div><div class="cons-half-lbl">Matin</div>${half(cons[dow].am)}<div class="cons-half-lbl">Après-midi</div>${half(cons[dow].pm)}</div>`;
  });
  const _leg=_hasLib?`<span class="cons-legend"><span class="cons-lib">LIB</span>consultation libérale (endoscopie)</span>`:'';
  panel.innerHTML=`<div class="cons-head"><i data-lucide="stethoscope" class="cons-head-icon"></i><span>Consultations</span>${_leg}</div><div class="cons-grid"><div class="cons-spacer"></div>${_cols}</div>`;
  alignConsGrid();
}

function renderBottom(month,daySlots,week){
  const guards=Array(7).fill(null).map(()=>[]);
  const h18=Array(7).fill('');
  const sorties=Array(7).fill(null).map(()=>[]);
  const absents=Array(7).fill(null).map(()=>[]);
  month.doctors.forEach(doc=>{
    daySlots.forEach((slot,dow)=>{
      if(!slot) return;
      let entry={};
      if(slot.dayIdx>=0){
        if(slot.sourceMonth){
          const otherDoc=slot.sourceMonth.doctors.find(d=>d.id===doc.id);
          entry=otherDoc?(otherDoc.days[slot.dayIdx]||{}):{};
        } else { entry=doc.days[slot.dayIdx]||{}; }
      }
      const st=entry.status||'';
      if(st==='G'||st==='G2') guards[dow].push(doc.initials);
      if(st==='18') h18[dow]=doc.initials;
      if(st==='RG') sorties[dow].push(doc.initials);
      if(ABSENT_PANNEAU.includes(st)) absents[dow].push({init:doc.initials,reason:st});
    });
  });

  function buildRow(label,cellsFn){
    let row=`<tr><td class="bt-label">${label}</td>`;
    daySlots.forEach((slot,dow)=>{
      const isWe=slot?isWeekend(slot.weekday):true;
      row+=`<td class="bt-cell${isWe?' weekend':''}">${slot?cellsFn(dow):''}</td>`;
    });
    return row+'</tr>';
  }

  let html=`<div class="bt-card">
    <div class="bt-card-header">Gardes &amp; fonctions</div>
    <div class="bt-scroll"><table class="bt-table"><tbody>`;
  html+=buildRow('Garde 24h',dow=>guards[dow].length?guards[dow].map(i=>`<span class="name-tag guard">${i}</span>`).join(''):'<span class="bt-dash">—</span>');
  html+=buildRow('8h – 18h',dow=>h18[dow]?`<span class="name-tag h18">${h18[dow]}</span>`:'<span class="bt-dash">—</span>');
  html+=buildRow('Sortie de garde',dow=>sorties[dow].length?sorties[dow].map(i=>`<span class="name-tag rg">${i}</span>`).join(''):'<span class="bt-dash">—</span>');
  html+=buildRow('Absences / CP / F',dow=>{
    if(!absents[dow].length) return '<span class="bt-dash">—</span>';
    return absents[dow].map(a=>`<span class="name-tag absent" title="${a.reason}">${a.init}</span>`).join('');
  });
  html+=`</tbody></table></div></div>`;
  document.getElementById('bottomSection').innerHTML=html;
}

// Palette couleurs avatars
const _AVATAR_BASE = [
  {bg:'#EFF6FF',fg:'#1D4ED8'},{bg:'#F0FDF4',fg:'#166534'},
  {bg:'#FDF4FF',fg:'#7E22CE'},{bg:'#FFF7ED',fg:'#C2410C'},
  {bg:'#FFF1F2',fg:'#BE123C'},{bg:'#ECFDF5',fg:'#065F46'},
  {bg:'#FFFBEB',fg:'#92400E'},{bg:'#EEF2FF',fg:'#3730A3'},
];
let AVATAR_COLORS = _AVATAR_BASE.slice();
function AVATAR_COLORS_APPLY(){ AVATAR_COLORS = _AVATAR_BASE.map(c=>TCC(c.bg,c.fg)); }
// (initialisé par applyTheme() en fin de bloc — évite un accès avant déclaration)
// ── MOTEUR DE THÈME ────────────────────────────────────────────────────
// 3 états : auto (suit le réglage du téléphone) → clair → sombre.
// Les surfaces basculent par variables CSS ; les cartes de couleurs métier
// (secteurs, statuts, avatars) sont recalculées ici : en sombre, fond teinté
// assombri + texte éclairci, à lisibilité constante des codes couleur.
let IS_DARK=false;
function _hx(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function _mix(a,b,t){const A=_hx(a),B=_hx(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');}
function _luma(h){const[r,g,b]=_hx(h);return(0.299*r+0.587*g+0.114*b)/255;}
function TCC(bg,fg){
  if(!IS_DARK||_luma(bg)<0.45) return {bg,fg}; // déjà sombre (G, G2…) : inchangé
  return { bg:_mix('#121A29',fg,0.13), fg:_mix(fg,'#FFFFFF',0.64) };
}
function _themeMap(base){const o={};for(const k in base)o[k]=TCC(base[k].bg,base[k].fg);return o;}

let _SECTOR_BASE = {
  VIS:{bg:'#EFF6FF',fg:'#1D4ED8'},REA:{bg:'#FFF1F2',fg:'#BE123C'},
  ORT:{bg:'#FFF7ED',fg:'#C2410C'},ORL:{bg:'#FDF4FF',fg:'#7E22CE'},
  END:{bg:'#F0FDF4',fg:'#166534'},CI:{bg:'#ECFDF5',fg:'#065F46'},
  RI:{bg:'#FFFBEB',fg:'#92400E'},MAT:{bg:'#FDF2F8',fg:'#9D174D'},
  CS:{bg:'#F0FDF4',fg:'#166534'},VOLANT:{bg:'#F1F5F9',fg:'#64748B'},
};
let SECTOR_COLORS = {..._SECTOR_BASE};
// Libellés courts d'affectation (colonne AFF de l'onglet SECTEURS).
// Valeurs de REPLI uniquement : alimentées par loadSecteurs() au chargement.
// VOLANT n'est pas un secteur de l'onglet (pseudo-secteur) → toujours en dur.
let SECTOR_AFF = {
  VIS:'Viscéral', REA:'Réanimation', ORT:'Ortho', ORL:'ORL', END:'Endoscopies',
  CI:'Cardio/Inter', RI:'Radio/Inter', MAT:'Maternité', VOLANT:'Volant',
};

// ── Source unique : secteurs depuis l'onglet SECTEURS (via getSecteurs) ──
// Échec réseau / action absente → on garde silencieusement les définitions en dur.
async function loadSecteurs(){
  try{
    const arr = _MIROIR_PRE.secteurs || await apiPost({action:'getSecteurs'});   // (miroir) livre par miroirBoot() quand l'ouverture est passee par lui
    if(Array.isArray(arr) && arr.length){
      const actifs = arr.filter(s=>s.actif);
      // Grille : mêmes champs qu'avant ; l'entrée CS (hors onglet) est conservée.
      SECTORS_DEF = actifs.map(s=>({code:s.code, label:s.label, icon:s.icon}))
                          .concat([{code:'CS', label:'Consultation', icon:'Stethoscope'}]);
      // Couleurs : codes de l'onglet + extras CS/VOLANT conservés.
      const base = {};
      actifs.forEach(s=>{ if(s.bg) base[s.code] = {bg:s.bg, fg:s.fg}; });
      base.CS = _SECTOR_BASE.CS; base.VOLANT = _SECTOR_BASE.VOLANT;
      _SECTOR_BASE = base;
      SECTOR_COLORS = _themeMap(_SECTOR_BASE);   // ré-applique le thème (clair/sombre)
      // Libellés d'affectation : colonne AFF, secteurs sans AFF ignorés (ex. DVI).
      const aff = {};
      actifs.forEach(s=>{ if(s.aff) aff[s.code] = s.aff; });
      aff.VOLANT = SECTOR_AFF.VOLANT;            // pseudo-secteur, hors onglet
      SECTOR_AFF = aff;
    }
  }catch(e){ /* fallback : définitions en dur conservées */ }
}

function getThemePref(){ try{return localStorage.getItem('pmTheme')||'auto';}catch(e){return 'auto';} }
function resolveTheme(pref){ return pref==='auto' ? (window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light') : pref; }
function applyTheme(){
  const pref=getThemePref(), t=resolveTheme(pref);
  IS_DARK = t==='dark';
  document.documentElement.dataset.theme = t;
  SECTOR_COLORS = _themeMap(_SECTOR_BASE);
  AVATAR_COLORS_APPLY();
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content = IS_DARK ? '#0B1220' : '#CE1126';
  const btn=document.getElementById('themeBtn');
  if(btn) btn.textContent = pref==='auto'?'🌗':(pref==='dark'?'🌙':'☀️');
  if(btn) btn.title = 'Thème : '+(pref==='auto'?'automatique':(pref==='dark'?'sombre':'clair'));
}
function cycleTheme(){
  const order=['auto','light','dark'];
  const next=order[(order.indexOf(getThemePref())+1)%3];
  try{localStorage.setItem('pmTheme',next);}catch(e){}
  applyTheme();
  // Re-rendu complet de la vue courante (les cartes de couleurs ont changé)
  if(DATA){ buildWeekNav(); render();
    if(currentMainView==='medecins')renderMedecins();
    if(currentMainView==='equite')renderEquite();
    if(currentMainView==='affect')renderAffectations();
    if(currentMainView==='annee')renderAnnee(); }
}
try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(getThemePref()==='auto') cycleThemeRefresh(); }); }catch(e){}
function cycleThemeRefresh(){ applyTheme(); if(DATA){ buildWeekNav(); render(); } }
applyTheme();

      else{if(!ABSENT_STATUSES.has(st))counts.presents++;}

    });

function renderDocPanel(){
  if(!currentDocId||!DATA) return;
  const month=DATA.months[docPanelMonthIdx];
  const doc=month.doctors.find(d=>d.id===currentDocId);
  if(!doc) return;

  // Header
  const di=month.doctors.findIndex(d=>d.id===currentDocId);
  const color=AVATAR_COLORS[di%AVATAR_COLORS.length];

  document.getElementById('dpName').textContent=name;
  document.getElementById('dpNavLabel').textContent=month.label||`${MONTH_NAMES_FR[month.month-1]} ${month.year}`;

  // Secteur principal ce mois — depuis affectations JSON, fallback statistique
  const affSectorPanel = AFFECTATIONS_DATA[currentDocId]?.[month.month] || AFFECTATIONS_DATA[currentDocId]?.[String(month.month)];
  let sector;
  if (affSectorPanel) {
    sector = affSectorPanel;
  } else {
    const sectorCounts={};
    doc.days.forEach(entry=>{
      (entry.morning||'').split('+').forEach(raw=>{const s=raw.trim();if(s&&!s.startsWith('CS-'))sectorCounts[s]=(sectorCounts[s]||0)+1;});
    });
    sector=Object.entries(sectorCounts).sort((a,b)=>b[1]-a[1])[0]?.[0]||'VOLANT';
  }
  const sc=SECTOR_COLORS[sector]||SECTOR_COLORS.VOLANT;
  av.style.background=sc.bg; av.style.color=sc.fg; // avatar raccord au secteur
  document.getElementById('dpMeta').innerHTML=`<span style="background:${sc.bg};color:${sc.fg};padding:2px 7px;border-radius:5px;font-size:11px;font-weight:700;font-family:var(--mono)">${sector}</span>`;

  // Stats mois
  const counts={G:0,G2:0,'18':0,RG:0,A:0,CP:0,F:0,R:0,abs:0,presents:0};
  month.days.forEach((day,i)=>{
    const entry=doc.days[i]||{};
    const st=entry.status||'';
    if(counts[st]!==undefined) counts[st]++;
    if(ABSENT_COMPTEUR.has(st)) counts.abs++;
    const isWe=isWeekend(day.weekday);
    if(isWe){if(st==='G')counts.presents++;}
    else{if(!ABSENT_STATUSES.has(st))counts.presents++;}
  });
  const absTotal=counts.abs;

  // Stats annuelles
  let annualG=0,annualPresents=0;
  DATA.months.forEach(m=>{
    const d=m.doctors.find(x=>x.id===currentDocId);
    if(!d) return;
    m.days.forEach((day,i)=>{
      const st=(d.days[i]||{}).status||'';
      if(st==='G'||st==='G2') annualG++;
      const isWe=isWeekend(day.weekday);
      if(isWe){if(st==='G')annualPresents++;}
      else{if(!ABSENT_STATUSES.has(st))annualPresents++;}
    });
  });

  // Calendrier mini
  const today=todayStr();
  const y=month.year, m2=month.month;
  const firstDay=new Date(y,m2-1,1);
  const daysInMonth=new Date(y,m2,0).getDate();
  let startDow=firstDay.getDay(); if(startDow===0)startDow=7;

  let calHtml='';
  DAYS_SHORT_FR.forEach(d=>{ calHtml+=`<div class="doc-cal-hdr">${d}</div>`; });
  for(let i=1;i<startDow;i++) calHtml+=`<div class="doc-cal-day empty"></div>`;

  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${y}-${String(m2).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayData=month.days.find(md=>md.date===dateStr);
    const isWe=dayData?isWeekend(dayData.weekday):[0,6].includes(new Date(dateStr).getDay());
    const isToday=dateStr===today;
    const entry=dayData?doc.days[month.days.indexOf(dayData)]||{}:{};
    const st=entry.status||'';
    const morning=entry.morning||'';
    const afternoon=entry.afternoon||'';

    // Déterminer classe et tags
    let cls='doc-cal-day';
    if(isWe) cls+=' we';
    if(isToday) cls+=' today';
    let stClass='';
    let tags=[];

    if(st==='G'||st==='G2'){ stClass=`dc-${st}`; tags.push(`<div class="doc-cal-tag" style="background:#EFF6FF;color:#1D4ED8">${st}</div>`); }
    else if(st==='18'){ stClass='dc-18'; tags.push(`<div class="doc-cal-tag" style="background:#F0FDF4;color:#166534">18h</div>`); }
    else if(st==='RG'){ stClass='dc-RG'; tags.push(`<div class="doc-cal-tag" style="background:#F5F3FF;color:#6D28D9">RG</div>`); }
    else if(['A','CP','F'].includes(st)){ stClass=`dc-${st}`; tags.push(`<div class="doc-cal-tag" style="background:var(--line-light);color:var(--ink-3)">${st}</div>`); }
    else if(st==='R'){ stClass='dc-R'; tags.push(`<div class="doc-cal-tag" style="background:var(--recup-soft);color:var(--recup)">R</div>`); }
    else if(morning&&!isWe){
      stClass='dc-work';
      // multi-secteur "VIS+REA" → un tag coloré par secteur
      morning.split('+').forEach(raw=>{
        const part=raw.trim(); if(!part) return;
        const mIsCs = part.startsWith('CS-');
        const sc2 = mIsCs ? SECTOR_COLORS['CS'] : (SECTOR_COLORS[part]||{bg:'#F1F5F9',fg:'#64748B'});
        tags.push(`<div class="doc-cal-tag${mIsCs?' cs':''}" style="background:${sc2.bg};color:${sc2.fg}">${part}</div>`);
      });
      const pmRaw = afternoon && afternoon !== morning ? afternoon : '';
      if(pmRaw){
        pmRaw.split('+').forEach(raw=>{
          const part=raw.trim(); if(!part) return;
          const pIsCs = part.startsWith('CS-');
          const sc3 = pIsCs ? SECTOR_COLORS['CS'] : (SECTOR_COLORS[part]||{bg:'#F1F5F9',fg:'#64748B'});
          tags.push(`<div class="doc-cal-tag${pIsCs?' cs':''}" style="background:${sc3.bg};color:${sc3.fg}">${part}</div>`);
        });
      }
    }

    calHtml+=`<div class="${cls} ${stClass}">
      <div class="doc-cal-day-num">${d}</div>
      ${tags.join('')}
    </div>`;
  }

  // Bilan annuel par mois
  let annualHtml='';

/* ── CIBLES ENTIÈRES, RAMENÉES AUX GARDES RÉELLEMENT RÉPARTIES ─────────
   (05/09/2026) Deux défauts vus EN PRODUCTION sur l'écran 2026.

   1. « 19 MAR sur 20 dépassent 2 gardes d'écart », nommément. Vérifié dans le
      classeur : la colonne CIBLE promet 730,8 gardes pour 707 posées, et 103,7
      samedis pour 91. La différence, ce sont les gardes assurées par un médecin
      EXTÉRIEUR au service, absent de la liste. Tout le monde apparaissait ~1,7
      garde trop bas : GHIGLIONE, ALBOUY et SALA signalés alors qu'ils sont pile
      à leur part, LEY à +2,1 absent de la liste.
   2. Des cibles à quinze décimales (« 7 /5.258134490238612 ») : la correction
      du point 1 produisait un nombre brut, affiché tel quel.

   LA RÈGLE. On ne compare pas à un nombre à virgule — personne ne peut faire
   5,26 samedis. On répartit les gardes RÉELLEMENT posées en cibles ENTIÈRES,
   par la méthode des plus forts restes : chacun reçoit sa partie entière, les
   unités qui restent vont à ceux dont le reste est le plus fort. Deux
   propriétés qui font toute la valeur du calcul :
     · la somme des cibles est EXACTEMENT le nombre de gardes réparties ;
     · les écarts S'ANNULENT — ce qu'un MAR fait en trop, un autre le fait en
       moins. Ceux de 2026 totalisaient -23,8, ce qui prouvait l'anomalie.
   C'est la même méthode que celle du générateur à partir de 2027 : l'écran de
   2026 se lit donc comme celui des années suivantes, en gardes entières.

   Aucune référence à une année : la donnée dit elle-même si elle est cohérente.
   La correction n'est jamais silencieuse — dès que la somme des cibles s'écarte
   de plus de 1 % des gardes réparties, le certificat affiche la mention qui
   l'explique au lecteur. */
function ciblesEquite(evalues, axes){
  const T = {}, ECART = { }, SEUIL = 0.01;
  evalues.forEach(m => { T[m.name] = {}; });
  axes.forEach(a => {
    const rk = a[0], ck = a[1];
    /* Axe absent de l'onglet (les fériés sur les années d'avant) : aucun MAR n'a
       de cible, on ne fabrique rien — l'axe sera simplement muet à l'écran. */
    const elig = evalues.filter(m => (+m[ck] || 0) > 0);
    if(!elig.length) return;
    let sr = 0, sc = 0;
    elig.forEach(m => { sr += +m[rk] || 0; sc += +m[ck] || 0; });
    if(!(sc > 0)) return;
    ECART[ck] = Math.abs(sr - sc) > SEUIL * sc;
    const f = sr / sc;                       // ramène les cibles au réel
    const base = {}; let somme = 0;
    elig.forEach(m => { base[m.name] = Math.floor((+m[ck] || 0) * f); somme += base[m.name]; });
    let reste = Math.round(sr - somme);
    const ordre = elig.slice().sort((x, y) => {
      const fx = ((+x[ck] || 0) * f) % 1, fy = ((+y[ck] || 0) * f) % 1;
      return fy - fx || (String(x.name) < String(y.name) ? -1 : 1);
    });
    let k = 0;
    while(reste > 0 && k < ordre.length * 4){ base[ordre[k % ordre.length].name]++; reste--; k++; }
    while(reste < 0 && k < ordre.length * 4){
      const n = ordre[ordre.length - 1 - (k % ordre.length)].name;
      if(base[n] > 0){ base[n]--; reste++; } k++;
    }
    elig.forEach(m => { T[m.name][ck] = base[m.name]; });
  });
  T._corrige = Object.keys(ECART).some(k => ECART[k]);
  return T;
}

function renderEquiteCards(list){
  EQ_LIST = list;

  /* (05/09/2026) Les fériés ont désormais une CIBLE, servie par getStats. La barre

     dit rien de la justice de la répartition. */

  const NEUTRAL={lu:1,ma:1,me:1}; // hors équité : pas de cible, barre neutre
  const meanAx={};
  ['lu','ma','me'].forEach(k=>{const v=list.map(x=>+x[k]||0);meanAx[k]=v.length?v.reduce((s,n)=>s+n,0)/v.length:0;});

     lecteurs d'une même donnée qui divergent, c'est un écran qui se contredit. */
  const _CIB = ciblesEquite(list.filter(x=>!x.wish), AX_EQUITE);

    if(!CB[k]) return meanAx[k];
    const ck=CB[k], t=_CIB[it.name];

  const maxTot=Math.max(0.1,...list.map(x=>+x.total||0))*1.12; // échelle = totaux réels (une cible aberrante ne peut plus vider la barre)
  /* (28/08/2026) Axes SANS cible : UNE seule échelle pour Lun/Mar/Mer. Chacun
     avait la sienne, calculée sur son propre maximum d'équipe : 3 mercredis
     donnaient une barre quatre fois plus longue que 4 mardis. Le MAR à souhaits

     total « souhaits » sans cible. */

  const _meN = MY_ID ? _meName(MY_ID) : null; // (Perso) MAR connecté en tête

    return String(a.name).localeCompare(String(b.name));

    const _wish=!!it.wish;
    const _tci=_CIB[it.name];
    const tv=+it.total||0, tc=_wish?0:((_tci&&_tci.cTot!==undefined)?_tci.cTot:(+it.cTot||0)),
          tw=Math.min(100,tv/maxTot*100), tcx=Math.min(100,tc/maxTot*100);

    const _totVal=_wish?(tv+'<span> souhaits</span>'):(tv+'<span> /'+(tc>0?Math.round(tc):'—')+'</span>');

    const ORDRE=[['total','cTot'],['lu',null],['ma',null],['me',null],['je','cJe'],

      const d=Math.abs((+it[k]||0)-t);

    }).join('');
    const v=_wish?{t:'souhaits',c:'#7c3aed'}:eqVerdict(it,cib);
    // Le MAR connecté est TOUJOURS déplié : c'est sa carte qu'il vient voir.

      + '<div class="eqv-tete" onclick="eqBasculer(&quot;'+_esc+'&quot;)">'
      +   '<div class="eqv-name" style="width:82px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+it.name+'</div>'
      +   (ouvert?'<div style="flex:1"></div>':'<div class="eqv-bande">'+bande+'</div>')
      +   '<div class="eqv-verdict" style="color:'+v.c+'">'+v.t+'</div>'
      +   '<div class="eqv-chev">'+(ouvert?'▲':'▼')+'</div>'
      + '</div>'
      + (ouvert?('<div style="padding:0 11px 10px">'+totBar+bars+'</div>'):'')
      + '</div>';
  }).join('')+'</div>';
}

async function getCiblesFromStats(year){
  if(CIBLES_CACHE[year]) return CIBLES_CACHE[year];
  /* (13/08/2026) Le trait de chaque barre — la cible — arrivait d'un appel
     Apps Script : les barres s'affichaient, puis les traits apparaissaient une
     seconde plus tard, pour les 21 MAR d'un coup. La copie rapide sert
     desormais stats_{annee}, ou ces cibles sont deja deposees pour le comite.
     Ce n'est pas un elargissement : la vue Equite montre deja ces compteurs
     nominatifs a tout MAR, et getStatsLive ne porte aucun controle de role.
     L'appel direct reste le repli — et reste seul a fournir l'INSTANTANE, qui
     recompte les gardes reellement faites. */
  try{
    const m = await miroirRead(['stats_' + year]);
    const c = m && m.success && m.data && m.data['stats_' + year];
    if(c && Array.isArray(c.stats) && c.stats.length){
      const mm = {};
      c.stats.forEach(s=>{ mm[s.medecin] = {cible:s.cible||0, cSat:s.cSat||0, cJeu:s.cJeu||0, cVd:s.cVd||0, cVjf:s.cVjf||0, cJf:s.cJf||0}; });
      CIBLES_CACHE[year] = mm;
      return mm;
    }
  }catch(e){ /* copie indisponible : on continue par l'appel direct */ }
  try{
    const j = await apiPost({action:'getStatsLive', year});
    if(!j || !j.success || !Array.isArray(j.stats)) return {};
    const m = {};
    j.stats.forEach(s=>{ m[s.medecin] = {cible:s.cible||0, cSat:s.cSat||0, cJeu:s.cJeu||0, cVd:s.cVd||0, cVjf:s.cVjf||0, cJf:s.cJf||0}; });
    CIBLES_CACHE[year] = m;
    return m;
  }catch(e){ return {}; }
}

/* (13/08/2026) L'instantane arrive par la copie rapide.
   AVANT : chaque clic sur l'onglet declenchait computeStatsLive chez Google —
   le calcul le plus lourd du portail, plusieurs dizaines de secondes ressenties,
   payees par CHAQUE MAR a CHAQUE consultation.
   APRES : le calcul tourne une fois pour les 23, dans le declencheur differe du
   miroir, aux memes moments que les statistiques — un echange de garde le
   republie dans la minute. L'ecran n'est donc plus exact a la seconde mais a la
   minute : c'est assume, et le lien « recalculer » force le calcul direct pour
   qui veut la valeur fraiche.
   force = true : on saute la copie rapide ET la memoire, on redemande a Google. */
async function loadEquiteLive(force){
  const wrap = document.getElementById('eqWrap');
  if(!wrap) return;
  const nameOf = id => (id==='PRUNET'?'Pr ':'Dr ')+id.charAt(0)+id.slice(1).toLowerCase();
  const build = (stats)=>{
    if(EQ_SRC_IDX!=='live') return;
    const list = stats.filter(s=>(s.total||0)>0).map(s=>({
      name:nameOf(s.medecin), wish:s.medecin==='PRUNET', total:s.total||0, cTot:_cibNum(s.cible),
      lu:s.lun||0, ma:s.mar||0, me:s.mer||0, je:s.jeu||0, sa:s.sat||0, vd:s.vd||0, jf:s.jf||0, vjf:s.vjf||0,
      cSa:_cibNum(s.cSat), cJe:_cibNum(s.cJeu), cVd:_cibNum(s.cVd), cVjf:_cibNum(s.cVjf), cJf:_cibNum(s.cJf),
    }));
    if(!list.length){ wrap.innerHTML = '<div style="padding:30px;text-align:center;color:#94A3B8">Aucune garde dans ce planning.</div>'; return; }
    const sum=list.reduce((s,a)=>s+a.total,0), mean=sum/list.length;
    const totals=list.map(a=>a.total), max=Math.max(...totals), min=Math.min(...totals);
    const html = `<div class="eq-summary">
      <div class="eq-kpi"><div class="eq-kpi-num">${sum}</div><div class="eq-kpi-lbl">Gardes réparties</div></div>
      <div class="eq-kpi"><div class="eq-kpi-num">${list.length}</div><div class="eq-kpi-lbl">MAR de garde</div></div>
      <div class="eq-kpi"><div class="eq-kpi-num">${mean.toFixed(1)}</div><div class="eq-kpi-lbl">Moyenne / MAR</div></div>
      <div class="eq-kpi"><div class="eq-kpi-num">${min}\u2013${max}</div><div class="eq-kpi-lbl">Étendue</div></div>
    </div>
    <div class="eqv-legend">Instantané — gardes réelles, échanges et dons compris · à la minute près · trait = cible (STATS_GARDES) · Lun/Mar/Mer neutres · <button type="button" class="eqv-recalc" onclick="loadEquiteLive(true)">recalculer maintenant</button></div>`;
    paintEquite(wrap, html, list);
  };
  const cached = force ? null : LIVE_CACHE[currentYear];
  if(cached){ build(cached); return; }
  if(!wrap.querySelector('.eqv-grid')){ wrap.innerHTML = '<div style="padding:30px;text-align:center;color:#94A3B8">Chargement de l\'instantané…</div>'; }
  try{
    let stats = null;
    if(!force){
      const m = await miroirRead(['equite_live_' + currentYear]);
      const c = m && m.success && m.data && m.data['equite_live_' + currentYear];
      if(c && c.success && Array.isArray(c.stats) && c.stats.length) stats = c.stats;
    }
    if(!stats){
      const j = await apiPost({action:'getStatsLive', year: currentYear});
      if(!j.success) throw new Error(j.error||'erreur');
      stats = j.stats;
    }
    LIVE_CACHE[currentYear] = stats;
    build(stats);
  }catch(e){
    if(!cached && EQ_SRC_IDX==='live') wrap.innerHTML = '<div style="padding:30px;text-align:center;color:#CE1126">Instantané indisponible : '+(e.message||e)+'</div>';
  }
}

function renderAffectations(){
  const wrap = document.getElementById('affWrap');
  if(!wrap || !DATA) return;
  const MO = ['J','F','M','A','M','J','J','A','S','O','N','D'];
  const MOF = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const docs = (DATA.months[0]?.doctors || []).slice().sort((a,b)=>a.id.localeCompare(b.id));
  const baseYear = DATA.months[0]?.year;
  const _now = new Date();
  const curM = (_now.getFullYear()===baseYear) ? _now.getMonth()+1 : 0;
  const nameOf = id => (id==='PRUNET'?'Pr ':'Dr ')+id.charAt(0)+id.slice(1).toLowerCase();
  const secOf = (id,m) => { const a = AFFECTATIONS_DATA[id]||{}; return a[m] || a[String(m)] || 'VOLANT'; };
  const abbr = s => s==='VOLANT' ? 'VOL' : s;
  // (07/2026) SECLABELS et l'ordre de légende étaient FIGÉS ici : ils ne suivaient
  // pas l'onglet SECTEURS. Renommer un secteur dans le tableau laissait donc deux
  // libellés différents selon la vue. Tout vient désormais de SECTOR_AFF / SECTORS_DEF.
  const SECLABELS = SECTOR_AFF;
  const present = new Set();
  docs.forEach(d => { for(let m=1;m<=12;m++) present.add(secOf(d.id,m)); });
  // Ordre = celui de l'onglet (SECTORS_DEF est trié par ORDRE), VOLANT en dernier.
  const legendOrder = SECTORS_DEF.map(s=>s.code).filter(c=>c!=='CS')
                        .concat(['VOLANT']).filter(s=>present.has(s));

  let legend = `<div class="aff-legend">`;
  legendOrder.forEach(s=>{ const sc=SECTOR_COLORS[s]||SECTOR_COLORS.VOLANT; legend += `<span class="aff-legend-item"><span class="aff-legend-dot" style="background:${sc.fg}"></span>${SECLABELS[s]||s}</span>`; });
  legend += `</div>`;

  let head = `<tr><th class="aff-name aff-corner">Médecin</th>`;
  MO.forEach((mi,i)=>{ const cur=(i+1)===curM?' cur':''; head += `<th class="aff-mhead${cur}" title="${MOF[i]}">${mi}</th>`; });
  head += `</tr>`;

  const body = docs.map(d=>{
    let row = `<tr${d.id===MY_ID?' class="me-row"':''}><th class="aff-name" title="${nameOf(d.id)}">${nameOf(d.id)}</th>`;
    for(let m=1;m<=12;m++){
      const sec = secOf(d.id,m);
      const sc = SECTOR_COLORS[sec] || SECTOR_COLORS.VOLANT || {bg:'#F1F5F9',fg:'#64748B'};
      const cur = m===curM?' cur':'';
      row += `<td class="aff-cell${cur}" style="background:${sc.bg};color:${sc.fg}" title="${MOF[m-1]} : ${SECLABELS[sec]||sec}">${abbr(sec)}</td>`;
    }
    return row+`</tr>`;
  }).join('');

  wrap.innerHTML = legend + `<div class="aff-tablewrap"><table class="aff-table"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

   compressee a zero). Les elements sont DEPLACES, jamais copies : un seul #yearSelect
   et un seul #monthSelect existent a tout instant, avec leurs gestionnaires intacts.
